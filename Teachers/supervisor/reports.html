<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سبيل - التقارير التشغيلية</title>

  <script>
    try {
      if (localStorage.getItem('academy_dark_mode') === 'true' || localStorage.getItem('sabeel_theme') === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <header class="navbar" id="appNavbar"></header>

      <main class="content-body">
        <div class="card" style="margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;">
            <div>
              <h1 style="font-size: 1.15rem; font-weight: 800; margin: 0;">التقارير التشغيلية وجودة الالتزام</h1>
              <p style="margin: 0.25rem 0 0; font-size: 0.82rem; color: var(--text-secondary);">مؤشرات الحضور والغياب والتأجيل والتعويض دون أي بيانات مالية أو رواتب.</p>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
              <input type="month" id="reportMonthInput" class="form-control" style="width: auto;">
              <button type="button" id="btnExportCsv" class="btn btn-secondary btn-sm">
                <i data-lucide="download" style="width: 15px; height: 15px;"></i>
                تصدير CSV
              </button>
              <button type="button" id="btnPrintReport" class="btn btn-primary btn-sm">
                <i data-lucide="printer" style="width: 15px; height: 15px;"></i>
                طباعة التقرير
              </button>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;" id="statsCardsContainer">
          <div class="op-metric-card">
            <span class="metric-label">إجمالي الحصص المسجلة</span>
            <div class="metric-value tabular-nums" id="repTotalLessons">0</div>
          </div>
          <div class="op-metric-card">
            <span class="metric-label">نسبة حضور الطلاب والاكتمال</span>
            <div class="metric-value tabular-nums" id="repAttendanceRate">0%</div>
          </div>
          <div class="op-metric-card">
            <span class="metric-label">نسبة التزام المعلمين</span>
            <div class="metric-value tabular-nums" id="repTeacherCommitment">100%</div>
          </div>
          <div class="op-metric-card">
            <span class="metric-label">الحصص المؤجلة / المعوضة</span>
            <div class="metric-value tabular-nums" id="repPostponedSummary">0 / 0</div>
          </div>
        </div>

        <div class="dashboard-main-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
          <div class="card">
            <div class="card-header">
              <h2 style="font-size: 0.98rem; font-weight: 700;">توزيع الحالات التشغيلية للحصص</h2>
            </div>
            <div id="statusBreakdownBox" style="display: flex; flex-direction: column; gap: 0.55rem;"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 style="font-size: 0.98rem; font-weight: 700;">أكثر الطلاب والمعلمين تأجيلاً أو غياباً</h2>
            </div>
            <div id="topExceptionsBox" style="display: flex; flex-direction: column; gap: 0.55rem;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import {
      initSupervisorPage,
      PERMISSIONS,
      escapeHtml,
      badgeHtml
    } from '../assets/js/features/supervisor/supervisorPageShell.js';
    import { LESSON_STATUS_META } from '../assets/js/features/supervisor/supervisorDomainService.js';
    import { dataStore } from '../assets/js/shared/data/dataStore.js';
    import { Toast } from '../assets/js/shared/utils/toast.js';

    let sessionsCache = [];
    let filteredMonthSessions = [];

    initSupervisorPage({
      pageId: 'reports',
      pageTitle: 'التقارير التشغيلية',
      requiredPermission: PERMISSIONS.VIEW_OPERATIONAL_REPORTS,
      onReady: () => {
        const monthInput = document.getElementById('reportMonthInput');
        if (monthInput) monthInput.value = new Date().toISOString().slice(0, 7);

        dataStore.subscribe('sessions', (list) => {
          sessionsCache = list || [];
          renderReports();
        });

        monthInput?.addEventListener('change', renderReports);
        document.getElementById('btnPrintReport')?.addEventListener('click', () => window.print());
        document.getElementById('btnExportCsv')?.addEventListener('click', exportOperationalCsv);
      }
    });

    function renderReports() {
      const monthVal = document.getElementById('reportMonthInput')?.value || '';
      filteredMonthSessions = sessionsCache.filter((s) => !monthVal || String(s.date || '').startsWith(monthVal));

      const total = filteredMonthSessions.length;
      const completed = filteredMonthSessions.filter((s) => s.status === 'completed' || s.status === 'compensatory').length;
      const studentAbsent = filteredMonthSessions.filter((s) => s.status === 'student_absent').length;
      const teacherAbsent = filteredMonthSessions.filter((s) => s.status === 'teacher_absent').length;
      const delayed = filteredMonthSessions.filter((s) => s.status === 'delayed').length;
      const compensated = filteredMonthSessions.filter((s) => s.status === 'delayed' && s.compensationStatus === 'completed').length;

      const attendDenom = completed + studentAbsent;
      const attendanceRate = attendDenom > 0 ? Math.round((completed / attendDenom) * 100) : 0;
      // Commitment is measured against lessons that were actually due: completed
      // (including compensatory), student/teacher absences. Cancelled and delayed
      // lessons without a compensatory session are not due lessons.
      const dueLessons = completed + studentAbsent + teacherAbsent;
      const teacherCommitment = dueLessons > 0 ? Math.max(0, Math.round(((dueLessons - teacherAbsent) / dueLessons) * 100)) : 100;

      document.getElementById('repTotalLessons').textContent = String(total);
      document.getElementById('repAttendanceRate').textContent = `${attendanceRate}%`;
      document.getElementById('repTeacherCommitment').textContent = `${teacherCommitment}%`;
      document.getElementById('repPostponedSummary').textContent = `${delayed} / ${compensated}`;

      const statusBox = document.getElementById('statusBreakdownBox');
      if (statusBox) {
        statusBox.innerHTML = Object.entries(LESSON_STATUS_META).map(([key, meta]) => {
          const count = filteredMonthSessions.filter((s) => s.status === key).length;
          const pct = total > 0 ? Math.round((count / total) * 100) : 0;
          return `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm);">
              ${badgeHtml(meta.label, meta.tone)}
              <span class="tabular-nums" style="font-weight: 700; font-size: 0.86rem;">${count} حصة (${pct}%)</span>
            </div>
          `;
        }).join('');
      }

      const studentCounts = new Map();
      const teacherCounts = new Map();
      filteredMonthSessions.forEach((s) => {
        if (s.status === 'delayed' || s.status === 'student_absent') {
          const k = s.studentName || 'طالب';
          studentCounts.set(k, (studentCounts.get(k) || 0) + 1);
        }
        if (s.status === 'delayed' || s.status === 'teacher_absent') {
          const t = s.teacherName || 'معلم';
          teacherCounts.set(t, (teacherCounts.get(t) || 0) + 1);
        }
      });

      const topStudents = Array.from(studentCounts.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const topTeachers = Array.from(teacherCounts.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);

      const exBox = document.getElementById('topExceptionsBox');
      if (exBox) {
        const items = [
          ...topStudents.map(([name, c]) => ({ title: `طالب: ${name}`, count: c, tone: 'warning' })),
          ...topTeachers.map(([name, c]) => ({ title: `معلم: ${name}`, count: c, tone: 'danger' }))
        ];
        exBox.innerHTML = items.length === 0
          ? '<p style="margin:0; color:var(--text-muted); font-size:0.84rem;">لا توجد حالات تأجيل أو غياب متكررة في هذا الشهر.</p>'
          : items.map((it) => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:0.6rem 0.75rem; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:var(--border-radius-sm);">
                <strong style="font-size:0.84rem;">${escapeHtml(it.title)}</strong>
                ${badgeHtml(String(it.count) + ' مرات', it.tone)}
              </div>
            `).join('');
      }
    }

    function exportOperationalCsv() {
      const escapeCsvField = (value) => {
        const str = String(value ?? '');
        return /[",\r\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
      };
      const headers = ['التاريخ', 'الوقت', 'الطالب', 'المعلم', 'المدة', 'الحالة', 'الملاحظات'];
      const rows = filteredMonthSessions.map((s) => [
        s.date || '',
        s.time || '',
        s.studentName || '',
        s.teacherName || '',
        s.duration || 60,
        LESSON_STATUS_META[s.status]?.label || s.status || '',
        s.notes || s.postponeReason || s.absenceReason || ''
      ]);

      const csvContent = '\uFEFF' + [headers, ...rows].map((r) => r.map(escapeCsvField).join(',')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sabeel-operational-report-${document.getElementById('reportMonthInput')?.value || 'all'}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      Toast.success('تم تصدير التقرير التشغيلي بنجاح.');
    }
  </script>
</body>
</html>
