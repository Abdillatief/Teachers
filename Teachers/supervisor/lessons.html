<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سبيل - إدارة ومتابعة الحصص</title>

  <script>
    try {
      if (localStorage.getItem('academy_dark_mode') === 'true' || localStorage.getItem('sabeel_theme') === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="/assets/vendor/lucide-1.80.0.min.js"></script>

  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <header class="navbar" id="appNavbar"></header>

      <main class="content-body">
        <div class="card" style="margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
            <div>
              <h1 style="font-size: 1.15rem; font-weight: 800; margin: 0;">سجل ومتابعة الحصص</h1>
              <p style="margin: 0.2rem 0 0; font-size: 0.82rem; color: var(--text-secondary);">متابعة حالات الحضور والتأجيل والتعويض والإلغاء عبر المنصة.</p>
            </div>
            <button type="button" id="btnNewLesson" class="btn btn-primary" style="display: none;">
              <i data-lucide="plus-circle" style="width: 16px; height: 16px;"></i>
              تسجيل حصة جديدة
            </button>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; align-items: end;">
            <div class="form-group" style="margin: 0;">
              <label for="filterLessonDate">التاريخ</label>
              <input type="date" id="filterLessonDate" class="form-control">
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="filterShowAllDates">نطاق العرض</label>
              <select id="filterShowAllDates" class="form-control">
                <option value="date">حسب التاريخ المحدد</option>
                <option value="all">جميع التواريخ (الأحدث أولاً)</option>
              </select>
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="filterLessonStatus">حالة الحصة</label>
              <select id="filterLessonStatus" class="form-control">
                <option value="all">جميع الحالات (7)</option>
                <option value="scheduled">مجدولة</option>
                <option value="completed">مكتملة</option>
                <option value="student_absent">غياب طالب</option>
                <option value="teacher_absent">غياب معلم</option>
                <option value="delayed">مؤجلة</option>
                <option value="compensatory">تعويضية</option>
                <option value="cancelled">ملغاة</option>
              </select>
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="filterLessonTeacher">المعلم</label>
              <select id="filterLessonTeacher" class="form-control">
                <option value="all">جميع المعلمين</option>
              </select>
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="filterLessonSearch">بحث سريع</label>
              <input type="search" id="filterLessonSearch" class="form-control" placeholder="اسم الطالب أو المعلم...">
            </div>
          </div>
        </div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>التاريخ والوقت</th>
                <th>الطالب</th>
                <th>المعلم</th>
                <th>المدة</th>
                <th>الحالة</th>
                <th>تفاصيل وملاحظات</th>
                <th>الإجراء</th>
              </tr>
            </thead>
            <tbody id="lessonsTableBody">
              <tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">جاري تحميل سجل الحصص...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Record / Edit Lesson Modal -->
  <div id="lessonModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 640px;">
      <div class="modal-header">
        <h3 id="lessonModalTitle" style="margin: 0; font-size: 1.05rem; font-weight: 700;">تسجيل أو تعديل حالة حصة</h3>
        <button type="button" id="closeLessonModalBtn" class="btn btn-ghost btn-sm" aria-label="إغلاق">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
      <form id="lessonWorkflowForm">
        <div class="modal-body">
          <input type="hidden" id="formExistingSessionId">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;">
            <div class="form-group">
              <label for="formStudentId">الطالب</label>
              <select id="formStudentId" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label for="formTeacherId">المعلم</label>
              <select id="formTeacherId" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label for="formLessonDate">تاريخ الحصة</label>
              <input type="date" id="formLessonDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="formLessonTime">وقت الحصة</label>
              <input type="time" id="formLessonTime" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="formLessonDuration">مدة الحصة (دقيقة)</label>
              <select id="formLessonDuration" class="form-control">
                <option value="30">30 دقيقة</option>
                <option value="45">45 دقيقة</option>
                <option value="60" selected>60 دقيقة</option>
                <option value="90">90 دقيقة</option>
                <option value="120">120 دقيقة</option>
              </select>
              <small id="durationLockNotice" style="display: none; color: var(--text-muted); font-size: 0.72rem;">مقفل حسب باقة الطالب (يتطلب صلاحية تعديل المدة).</small>
            </div>
            <div class="form-group">
              <label for="formLessonStatus">حالة الحصة</label>
              <select id="formLessonStatus" class="form-control" required>
                <option value="scheduled">مجدولة (Scheduled)</option>
                <option value="completed">مكتملة (Completed)</option>
                <option value="student_absent">غياب طالب (Student Absent)</option>
                <option value="teacher_absent">غياب معلم (Teacher Absent)</option>
                <option value="delayed">مؤجلة (Delayed)</option>
                <option value="compensatory">حصة تعويضية (Compensatory)</option>
                <option value="cancelled">ملغاة (Cancelled)</option>
              </select>
            </div>
          </div>

          <!-- Conditional Student Absent -->
          <div id="condStudentAbsent" style="display: none; padding: 0.85rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); margin-bottom: 1rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
              <div class="form-group" style="margin: 0;">
                <label for="formAbsenceType">تصنيف غياب الطالب</label>
                <select id="formAbsenceType" class="form-control">
                  <option value="unexcused">غياب بدون عذر</option>
                  <option value="excused">غياب بعذر</option>
                </select>
              </div>
              <div class="form-group" style="margin: 0;">
                <label for="formAbsenceReason">سبب الغياب</label>
                <input type="text" id="formAbsenceReason" class="form-control" placeholder="سبب غياب الطالب...">
              </div>
            </div>
          </div>

          <!-- Conditional Teacher Absent -->
          <div id="condTeacherAbsent" style="display: none; padding: 0.85rem; background: var(--bg-primary); border: 1px solid var(--danger-border); border-radius: var(--border-radius-sm); margin-bottom: 1rem;">
            <div class="form-group" style="margin: 0;">
              <label for="formTeacherAbsenceReason">سبب غياب المعلم</label>
              <input type="text" id="formTeacherAbsenceReason" class="form-control" placeholder="يُحفظ تلقائياً في سجل الغياب...">
            </div>
          </div>

          <!-- Conditional Delayed -->
          <div id="condDelayed" style="display: none; padding: 0.85rem; background: var(--bg-primary); border: 1px solid var(--primary-border); border-radius: var(--border-radius-sm); margin-bottom: 1rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
              <div class="form-group" style="margin: 0;">
                <label for="formResponsibleParty">الطرف المتسبب</label>
                <select id="formResponsibleParty" class="form-control">
                  <option value="student">الطالب / ولي الأمر</option>
                  <option value="teacher">المعلم</option>
                  <option value="academy">الأكاديمية / ظرف عام</option>
                </select>
              </div>
              <div class="form-group" style="margin: 0;">
                <label for="formPostponeReason">سبب التأجيل</label>
                <input type="text" id="formPostponeReason" class="form-control" placeholder="سبب التأجيل...">
              </div>
              <div class="form-group" style="margin: 0;">
                <label for="formMakeupDate">تاريخ الحصة التعويضية (اختياري)</label>
                <input type="date" id="formMakeupDate" class="form-control">
              </div>
              <div class="form-group" style="margin: 0;">
                <label for="formMakeupTime">وقت التعويض (من المواعيد المتاحة)</label>
                <input type="time" id="formMakeupTime" class="form-control">
              </div>
            </div>
            <div id="availableSlotsPreview" style="margin-bottom: 0.75rem;"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
              <div class="form-group" style="margin: 0;">
                <label for="formTeacherDelayNotes">ملاحظات المعلم</label>
                <input type="text" id="formTeacherDelayNotes" class="form-control">
              </div>
              <div class="form-group" style="margin: 0;">
                <label for="formSlotSelectionReason">سبب اختيار الموعد</label>
                <input type="text" id="formSlotSelectionReason" class="form-control">
              </div>
            </div>
          </div>

          <!-- Conditional Compensatory -->
          <div id="condCompensatory" style="display: none; padding: 0.85rem; background: var(--bg-primary); border: 1px solid var(--primary-border); border-radius: var(--border-radius-sm); margin-bottom: 1rem;">
            <div class="form-group" style="margin: 0;">
              <label for="formOriginalLessonId">الحصة المؤجلة المرتبطة</label>
              <select id="formOriginalLessonId" class="form-control"></select>
            </div>
          </div>

          <!-- Conditional Cancelled -->
          <div id="condCancelled" style="display: none; padding: 0.85rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); margin-bottom: 1rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
              <div class="form-group" style="margin: 0;">
                <label for="formCancelResponsibility">جهة الإلغاء</label>
                <select id="formCancelResponsibility" class="form-control">
                  <option value="academy">الإدارة / الأكاديمية</option>
                  <option value="student">الطالب</option>
                  <option value="teacher">المعلم</option>
                </select>
              </div>
              <div class="form-group" style="margin: 0;">
                <label for="formCancelReason">سبب الإلغاء</label>
                <input type="text" id="formCancelReason" class="form-control">
              </div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="formLessonNotes">ملاحظات تشغيلية</label>
            <textarea id="formLessonNotes" class="form-control" rows="2" placeholder="أي ملاحظات مرتبطة بسير الحصة..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelLessonModalBtn" class="btn btn-secondary">إلغاء</button>
          <button type="submit" id="saveLessonBtn" class="btn btn-primary">حفظ الحصة</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import {
      initSupervisorPage,
      PERMISSIONS,
      escapeHtml,
      getTodayIsoDate,
      badgeHtml
    } from '../assets/js/features/supervisor/supervisorPageShell.js';
    import {
      getLessonStatusMeta,
      getStudentDefaultDuration,
      computeTeacherAvailableSlots,
      recordLessonWithWorkflow
    } from '../assets/js/features/supervisor/supervisorDomainService.js';
    import { dataStore } from '../assets/js/shared/data/dataStore.js';
    import { Toast } from '../assets/js/shared/utils/toast.js';

    let actorCtx = null;
    let sessionsCache = [];
    let studentsCache = [];
    let teachersCache = [];
    let groupsCache = [];

    initSupervisorPage({
      pageId: 'lessons',
      pageTitle: 'إدارة ومتابعة الحصص',
      requiredPermission: PERMISSIONS.VIEW_LESSONS,
      onReady: (ctx) => {
        actorCtx = ctx;
        const today = getTodayIsoDate();
        document.getElementById('filterLessonDate').value = today;

        toggleActionCapabilities();

        dataStore.subscribe('sessions', (list) => {
          sessionsCache = (list || []).slice().sort((a, b) => {
            const d = (b.date || '').localeCompare(a.date || '');
            return d !== 0 ? d : (b.time || '').localeCompare(a.time || '');
          });
          renderLessonsTable();
        });
        dataStore.subscribe('studentOperationalSummaries', (list) => {
          studentsCache = list || [];
          populateStudentFormOptions();
        });
        dataStore.subscribe('teacherOperationalProfiles', (list) => {
          teachersCache = list || [];
          populateTeacherSelectors();
        });
        dataStore.subscribe('groups', (list) => {
          groupsCache = list || [];
        });

        ['filterLessonDate', 'filterShowAllDates', 'filterLessonStatus', 'filterLessonTeacher', 'filterLessonSearch'].forEach((id) => {
          document.getElementById(id)?.addEventListener('change', renderLessonsTable);
          document.getElementById(id)?.addEventListener('input', renderLessonsTable);
        });

        document.getElementById('btnNewLesson')?.addEventListener('click', () => openLessonModal(null));
        document.getElementById('closeLessonModalBtn')?.addEventListener('click', closeLessonModal);
        document.getElementById('cancelLessonModalBtn')?.addEventListener('click', closeLessonModal);
        document.getElementById('formStudentId')?.addEventListener('change', syncFormForSelectedStudent);
        document.getElementById('formLessonStatus')?.addEventListener('change', syncConditionalSections);
        document.getElementById('formMakeupDate')?.addEventListener('change', refreshAvailableSlotsForDelay);
        document.getElementById('formTeacherId')?.addEventListener('change', refreshAvailableSlotsForDelay);
        document.getElementById('lessonWorkflowForm')?.addEventListener('submit', handleLessonSubmit);
      },
      onPermissionsUpdated: ({ hasPerm }) => {
        if (actorCtx) actorCtx.hasPerm = hasPerm;
        toggleActionCapabilities();
        renderLessonsTable();
      }
    });

    function toggleActionCapabilities() {
      const btn = document.getElementById('btnNewLesson');
      if (btn) btn.style.display = actorCtx?.hasPerm(PERMISSIONS.MANAGE_LESSONS) ? 'inline-flex' : 'none';
    }

    function populateTeacherSelectors() {
      const sorted = teachersCache.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      const filterSel = document.getElementById('filterLessonTeacher');
      if (filterSel) {
        const prev = filterSel.value;
        filterSel.innerHTML = '<option value="all">جميع المعلمين</option>' +
          sorted.map((t) => `<option value="${escapeHtml(t.uid || t.id)}">${escapeHtml(t.name || 'معلم')}</option>`).join('');
        if (prev) filterSel.value = prev;
      }

      const formSel = document.getElementById('formTeacherId');
      if (formSel) {
        formSel.innerHTML = '<option value="">اختر المعلم...</option>' +
          sorted.map((t) => `<option value="${escapeHtml(t.uid || t.id)}">${escapeHtml(t.name || 'معلم')}</option>`).join('');
      }
    }

    function populateStudentFormOptions() {
      const sel = document.getElementById('formStudentId');
      if (!sel) return;
      const active = studentsCache
        .filter((s) => !['archived', 'Suspended', 'suspended'].includes(s.status))
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      sel.innerHTML = '<option value="">اختر الطالب...</option>' +
        active.map((s) => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name || 'طالب')}</option>`).join('');
    }

    function renderLessonsTable() {
      const tbody = document.getElementById('lessonsTableBody');
      if (!tbody) return;

      const dateVal = document.getElementById('filterLessonDate')?.value || '';
      const modeVal = document.getElementById('filterShowAllDates')?.value || 'date';
      const statusVal = document.getElementById('filterLessonStatus')?.value || 'all';
      const teacherVal = document.getElementById('filterLessonTeacher')?.value || 'all';
      const qVal = (document.getElementById('filterLessonSearch')?.value || '').trim().toLowerCase();

      const filtered = sessionsCache.filter((s) => {
        if (modeVal === 'date' && dateVal && s.date !== dateVal && s.postponedFrom !== dateVal) return false;
        if (statusVal !== 'all' && s.status !== statusVal) return false;
        if (teacherVal !== 'all' && s.teacherId !== teacherVal) return false;
        if (qVal) {
          const hay = `${s.studentName || ''} ${s.teacherName || ''} ${s.notes || ''}`.toLowerCase();
          if (!hay.includes(qVal)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">لا توجد حصص مطابقة لخيارات التصفية.</td></tr>';
        return;
      }

      const canManage = actorCtx?.hasPerm(PERMISSIONS.MANAGE_LESSONS);

      tbody.innerHTML = filtered.slice(0, 150).map((s) => {
        const meta = getLessonStatusMeta(s.status, s);
        const detailLine = [
          s.postponeReason ? `سبب التأجيل: ${s.postponeReason}` : '',
          s.makeupDate ? `موعد التعويض: ${s.makeupDate} ${s.makeupTime || ''}` : '',
          s.absenceReason ? `سبب الغياب: ${s.absenceReason}` : '',
          s.cancellationReason ? `سبب الإلغاء: ${s.cancellationReason}` : '',
          s.notes || ''
        ].filter(Boolean).join(' — ');

        return `
          <tr>
            <td>
              <strong class="tabular-nums">${escapeHtml(s.date || '-')}</strong>
              <div style="font-size: 0.74rem; color: var(--text-muted);" class="tabular-nums">${escapeHtml(s.time || '-')}</div>
            </td>
            <td><strong>${escapeHtml(s.studentName || 'طالب')}</strong></td>
            <td>${escapeHtml(s.teacherName || 'غير معين')}</td>
            <td class="tabular-nums">${escapeHtml(String(s.duration || 60))} دقيقة</td>
            <td>${badgeHtml(meta.label, meta.tone)}</td>
            <td style="max-width: 240px; font-size: 0.78rem; color: var(--text-secondary);">${escapeHtml(detailLine || '-')}</td>
            <td>
              ${canManage ? `
                <button type="button" class="btn btn-secondary btn-sm btn-edit-lesson" data-id="${escapeHtml(s.id)}">
                  <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
                  تحديث
                </button>
              ` : badgeHtml('عرض فقط', 'neutral')}
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.btn-edit-lesson').forEach((btn) => {
        btn.addEventListener('click', () => {
          const sess = sessionsCache.find((item) => item.id === btn.dataset.id);
          if (sess) openLessonModal(sess);
        });
      });

      if (window.lucide) window.lucide.createIcons({ root: tbody });
    }

    function openLessonModal(sess = null) {
      if (!actorCtx?.hasPerm(PERMISSIONS.MANAGE_LESSONS)) {
        Toast.warning('لا تمتلك صلاحية إدارة أو تسجيل الحصص.');
        return;
      }

      document.getElementById('lessonWorkflowForm').reset();
      document.getElementById('formExistingSessionId').value = sess?.id || '';
      document.getElementById('lessonModalTitle').textContent = sess ? 'تحديث حالة الحصة' : 'تسجيل حصة جديدة';

      document.getElementById('formStudentId').value = sess?.studentId || '';
      document.getElementById('formTeacherId').value = sess?.teacherId || '';
      document.getElementById('formLessonDate').value = sess?.date || getTodayIsoDate();
      document.getElementById('formLessonTime').value = sess?.time || '17:00';
      document.getElementById('formLessonStatus').value = sess?.status || 'completed';
      document.getElementById('formLessonNotes').value = sess?.notes || '';

      document.getElementById('formAbsenceType').value = sess?.absenceType || 'unexcused';
      document.getElementById('formAbsenceReason').value = sess?.absenceReason || '';
      document.getElementById('formTeacherAbsenceReason').value = sess?.absenceReason || '';
      document.getElementById('formResponsibleParty').value = sess?.responsibleParty || 'student';
      document.getElementById('formPostponeReason').value = sess?.postponeReason || '';
      document.getElementById('formMakeupDate').value = sess?.makeupDate || '';
      document.getElementById('formMakeupTime').value = sess?.makeupTime || '';
      document.getElementById('formTeacherDelayNotes').value = sess?.teacherNotes || '';
      document.getElementById('formSlotSelectionReason').value = sess?.slotSelectionReason || '';
      document.getElementById('formCancelResponsibility').value = sess?.cancellationResponsibility || 'academy';
      document.getElementById('formCancelReason').value = sess?.cancellationReason || '';

      syncFormForSelectedStudent(sess?.duration);
      syncConditionalSections();
      document.getElementById('lessonModal').style.display = 'flex';
    }

    function closeLessonModal() {
      document.getElementById('lessonModal').style.display = 'none';
    }

    function syncFormForSelectedStudent(explicitDuration = null) {
      const stId = document.getElementById('formStudentId').value;
      const st = studentsCache.find((item) => item.id === stId);
      const teacherSel = document.getElementById('formTeacherId');
      if (st?.teacherId && !teacherSel.value) {
        teacherSel.value = st.teacherId;
      }

      const durSel = document.getElementById('formLessonDuration');
      const lockNotice = document.getElementById('durationLockNotice');
      const canEditDuration = actorCtx?.hasPerm(PERMISSIONS.EDIT_LESSON_DURATION);
      const hasExplicitDuration = explicitDuration !== null && explicitDuration !== undefined &&
        typeof explicitDuration !== 'object' && String(explicitDuration).trim() !== '';
      // On edit always keep the stored lesson duration; package duration is only a creation default.
      const targetDur = (st && !hasExplicitDuration)
        ? getStudentDefaultDuration(st)
        : String(hasExplicitDuration ? explicitDuration : '60');

      if (!Array.from(durSel.options).some((o) => o.value === targetDur)) {
        const opt = document.createElement('option');
        opt.value = targetDur;
        opt.textContent = `${targetDur} دقيقة`;
        durSel.appendChild(opt);
      }

      durSel.value = targetDur;
      durSel.disabled = !canEditDuration;
      if (lockNotice) lockNotice.style.display = canEditDuration ? 'none' : 'block';

      const delayedSel = document.getElementById('formOriginalLessonId');
      if (delayedSel) {
        const pendingDelayed = sessionsCache.filter(
          (s) => s.studentId === stId && s.status === 'delayed' && s.compensationStatus !== 'completed'
        );
        delayedSel.innerHTML = '<option value="">-- بدون ربط بحصة مؤجلة --</option>' +
          pendingDelayed.map((d) => `<option value="${escapeHtml(d.id)}">حصة ${escapeHtml(d.date || '')} (${escapeHtml(d.postponeReason || 'مؤجلة')})</option>`).join('');
      }
    }

    function syncConditionalSections() {
      const st = document.getElementById('formLessonStatus').value;
      document.getElementById('condStudentAbsent').style.display = st === 'student_absent' ? 'block' : 'none';
      document.getElementById('condTeacherAbsent').style.display = st === 'teacher_absent' ? 'block' : 'none';
      document.getElementById('condDelayed').style.display = st === 'delayed' ? 'block' : 'none';
      document.getElementById('condCompensatory').style.display = st === 'compensatory' ? 'block' : 'none';
      document.getElementById('condCancelled').style.display = st === 'cancelled' ? 'block' : 'none';
      if (st === 'delayed') refreshAvailableSlotsForDelay();
    }

    function refreshAvailableSlotsForDelay() {
      const container = document.getElementById('availableSlotsPreview');
      if (!container) return;
      const teacherId = document.getElementById('formTeacherId').value;
      const makeupDate = document.getElementById('formMakeupDate').value;
      const duration = Number(document.getElementById('formLessonDuration').value || 60);

      if (!teacherId || !makeupDate) {
        container.innerHTML = '<p style="margin: 0; font-size: 0.76rem; color: var(--text-muted);">اختر المعلم وتاريخ التعويض لعرض الأوقات المتاحة تلقائياً.</p>';
        return;
      }

      const teacherProfile = teachersCache.find((t) => (t.uid || t.id) === teacherId) || { uid: teacherId };
      const res = computeTeacherAvailableSlots({
        teacherProfile,
        students: studentsCache,
        groups: groupsCache,
        sessions: sessionsCache,
        targetDate: makeupDate,
        slotDurationMinutes: duration
      });

      if (res.slots.length === 0) {
        container.innerHTML = '<p style="margin: 0; font-size: 0.76rem; color: var(--danger);">لا توجد أوقات متاحة لهذا المعلم في هذا التاريخ.</p>';
        return;
      }

      container.innerHTML = `
        <div style="font-size: 0.75rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-secondary);">الأوقات المتاحة ليوم ${escapeHtml(res.targetDayName)} (اضغط للاختيار):</div>
        <div style="display: flex; flex-wrap: wrap; gap: 0.35rem; max-height: 110px; overflow-y: auto;">
          ${res.slots.slice(0, 14).map((slot) => `
            <button type="button" class="btn btn-outline btn-sm pick-slot-btn" data-time="${escapeHtml(slot.time24)}">${escapeHtml(slot.startLabel)}</button>
          `).join('')}
        </div>
      `;

      container.querySelectorAll('.pick-slot-btn').forEach((b) => {
        b.addEventListener('click', () => {
          document.getElementById('formMakeupTime').value = b.dataset.time;
        });
      });
    }

    async function handleLessonSubmit(e) {
      e.preventDefault();
      if (!actorCtx?.hasPerm(PERMISSIONS.MANAGE_LESSONS)) return;

      const existingSessionId = document.getElementById('formExistingSessionId').value || null;
      const studentId = document.getElementById('formStudentId').value;
      const teacherId = document.getElementById('formTeacherId').value;
      const studentObj = studentsCache.find((s) => s.id === studentId);
      const teacherObj = teachersCache.find((t) => (t.uid || t.id) === teacherId);
      const status = document.getElementById('formLessonStatus').value;
      const currentSession = existingSessionId ? sessionsCache.find((s) => s.id === existingSessionId) : null;
      const hasCompensatoryLink = Boolean(currentSession?.compensatedBySessionId);

      if (!studentId || !teacherId) {
        Toast.warning('يرجى تحديد الطالب والمعلم.');
        return;
      }

      const btn = document.getElementById('saveLessonBtn');
      btn.disabled = true;

      try {
        const makeupDate = document.getElementById('formMakeupDate').value;
        await recordLessonWithWorkflow({
          existingSessionId,
          studentId,
          studentName: studentObj?.name || '',
          teacherId,
          teacherName: teacherObj?.name || '',
          date: document.getElementById('formLessonDate').value,
          time: document.getElementById('formLessonTime').value,
          duration: Number(document.getElementById('formLessonDuration').value || 60),
          status,
          absenceType: status === 'student_absent' ? document.getElementById('formAbsenceType').value : null,
          absenceReason: status === 'teacher_absent'
            ? document.getElementById('formTeacherAbsenceReason').value.trim()
            : document.getElementById('formAbsenceReason').value.trim(),
          notes: document.getElementById('formLessonNotes').value.trim(),
          postponeReason: document.getElementById('formPostponeReason').value.trim(),
          responsibleParty: document.getElementById('formResponsibleParty').value,
          makeupDate,
          makeupTime: document.getElementById('formMakeupTime').value,
          teacherNotes: document.getElementById('formTeacherDelayNotes').value.trim(),
          slotSelectionReason: document.getElementById('formSlotSelectionReason').value.trim(),
          createMakeupSession: Boolean(status === 'delayed' && makeupDate && !hasCompensatoryLink),
          originalLessonId: document.getElementById('formOriginalLessonId').value,
          cancellationResponsibility: document.getElementById('formCancelResponsibility').value,
          cancellationReason: document.getElementById('formCancelReason').value.trim()
        }, {
          uid: actorCtx.uid,
          name: actorCtx.name,
          role: 'supervisor',
          canEditDuration: actorCtx.hasPerm(PERMISSIONS.EDIT_LESSON_DURATION)
        });

        Toast.success('تم حفظ سجل الحصة وتوثيقه بنجاح.');
        closeLessonModal();
      } catch (err) {
        console.error(err);
        Toast.danger('تعذر حفظ الحصة: ' + (err?.message || 'خطأ غير متوقع'));
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
