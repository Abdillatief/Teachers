<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سبيل - متابعة الطلاب التشغيلية</title>

  <script>
    try {
      if (localStorage.getItem('academy_dark_mode') === 'true' || localStorage.getItem('sabeel_theme') === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="/assets/vendor/lucide.min.js"></script>

  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <header class="navbar" id="appNavbar"></header>

      <main class="content-body">
        <!-- Filters Toolbar -->
        <div class="card" style="margin-bottom: 1.25rem;">
          <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 0.85rem; align-items: end;" class="form-row-2">
            <div class="form-group" style="margin: 0;">
              <label for="searchStudentsInput">بحث بالاسم أو ولي الأمر أو الهاتف</label>
              <input type="search" id="searchStudentsInput" name="sabeel_sup_student_q" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="form-control" placeholder="ابحث عن طالب أو ولي أمر...">
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="filterStatusSelect">حالة الطالب</label>
              <select id="filterStatusSelect" class="form-control" autocomplete="off">
                <option value="all">جميع الحالات</option>
                <option value="active">نشط ومنتظم</option>
                <option value="paused">متوقف مؤقتاً</option>
                <option value="suspended">موقوف</option>
                <option value="archived">مؤرشف</option>
              </select>
            </div>
            <div class="form-group" style="margin: 0;">
              <label for="filterTeacherSelect">المعلم المسؤول</label>
              <select id="filterTeacherSelect" class="form-control" autocomplete="off">
                <option value="all">جميع المعلمين</option>
              </select>
            </div>
            <div>
              <button type="button" id="refreshStudentsBtn" class="btn btn-secondary" title="تحديث القائمة">
                <i data-lucide="refresh-cw" style="width: 15px; height: 15px;"></i>
                تحديث
              </button>
            </div>
          </div>
        </div>

        <!-- Operational Summary -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;" id="statsCardsContainer">
          <div class="op-metric-card">
            <span class="metric-label">إجمالي الطلاب المعروضين</span>
            <div class="metric-value tabular-nums" id="countFilteredStudents">0</div>
          </div>
          <div class="op-metric-card">
            <span class="metric-label">طلاب نشطون</span>
            <div class="metric-value tabular-nums" id="countActiveStudents">0</div>
          </div>
          <div class="op-metric-card">
            <span class="metric-label">حصص متبقية منخفضة (أقل من 3)</span>
            <div class="metric-value tabular-nums" id="countLowBalanceStudents">0</div>
          </div>
        </div>

        <!-- Students Operational Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>الطالب والعمر</th>
                <th>ولي الأمر والتواصل</th>
                <th>المعلم</th>
                <th>الباقة والمدة</th>
                <th>الرصيد التشغيلي للحصص</th>
                <th>أيام ومواعيد الجدول</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody">
              <tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">جاري تحميل بيانات الطلاب التشغيلية...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Operational Student Edit Modal -->
  <div id="editStudentModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 560px;">
      <div class="modal-header">
        <h3 style="margin: 0; font-size: 1.05rem; font-weight: 700;">تحديث البيانات التشغيلية للطالب</h3>
        <button type="button" id="closeEditStudentBtn" class="btn btn-ghost btn-sm" aria-label="إغلاق">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
      <form id="editStudentForm">
        <div class="modal-body">
          <input type="hidden" id="editStudentId">
          <div style="margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm);">
            <strong id="editStudentNameHeader" style="color: var(--text-primary);"></strong>
            <div id="editStudentPackageHeader" style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.2rem;"></div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;">
            <div class="form-group">
              <label for="editParentName">اسم ولي الأمر</label>
              <input type="text" id="editParentName" class="form-control">
            </div>
            <div class="form-group">
              <label for="editParentPhone">رقم التواصل / الواتساب</label>
              <input type="tel" id="editParentPhone" class="form-control">
            </div>
            <div class="form-group">
              <label for="editStudentStatus">الحالة التشغيلية</label>
              <select id="editStudentStatus" class="form-control">
                <option value="active">نشط ومنتظم</option>
                <option value="paused">متوقف مؤقتاً</option>
                <option value="frozen">مجمد مؤقتاً</option>
              </select>
            </div>
            <div class="form-group">
              <label for="editMemorizationDir">مسار الحفظ</label>
              <select id="editMemorizationDir" class="form-control">
                <option value="ascending">تصاعدي (من البقرة)</option>
                <option value="descending">تنازلي (من جزء عم)</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="editStudentNotes">ملاحظات تشغيلية</label>
            <textarea id="editStudentNotes" class="form-control" rows="3" placeholder="ملاحظات المتابعة التعليمية والتشغيلية..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelEditStudentBtn" class="btn btn-secondary">إلغاء</button>
          <button type="submit" id="saveEditStudentBtn" class="btn btn-primary">حفظ التعديلات</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { db } from '../assets/js/config/firebase.js';
    import { doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import {
      initSupervisorPage,
      PERMISSIONS,
      escapeHtml,
      badgeHtml
    } from '../assets/js/features/supervisor/supervisorPageShell.js';
    import {
      STUDENT_STATUS_META,
      getStudentDefaultDuration,
      logActivity
    } from '../assets/js/features/supervisor/supervisorDomainService.js';
    import { dataStore } from '../assets/js/shared/data/dataStore.js';
    import { Toast } from '../assets/js/shared/utils/toast.js';

    let actorCtx = null;
    let summariesCache = [];
    let teachersCache = [];
    let userHasTypedSearch = false;

    initSupervisorPage({
      pageId: 'students',
      pageTitle: 'متابعة الطلاب التشغيلية',
      requiredPermission: PERMISSIONS.VIEW_STUDENTS,
      onReady: (ctx) => {
        actorCtx = ctx;

        const searchEl = document.getElementById('searchStudentsInput');
        if (searchEl) {
          searchEl.value = '';
          setTimeout(() => {
            if (!userHasTypedSearch && searchEl.value) {
              searchEl.value = '';
              renderStudentsTable();
            }
          }, 300);
          searchEl.addEventListener('input', () => {
            userHasTypedSearch = true;
            renderStudentsTable();
          });
        }

        dataStore.subscribe('studentOperationalSummaries', (list) => {
          summariesCache = (list || []).slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
          renderStudentsTable();
        });

        dataStore.subscribe('teacherOperationalProfiles', (list) => {
          teachersCache = list || [];
          populateTeacherFilter();
        });

        document.getElementById('filterStatusSelect')?.addEventListener('change', renderStudentsTable);
        document.getElementById('filterTeacherSelect')?.addEventListener('change', renderStudentsTable);
        document.getElementById('refreshStudentsBtn')?.addEventListener('click', async () => {
          await dataStore.refreshCollection('studentOperationalSummaries');
          Toast.info('تم تحديث بيانات الطلاب التشغيلية.');
        });

        document.getElementById('closeEditStudentBtn')?.addEventListener('click', closeModal);
        document.getElementById('cancelEditStudentBtn')?.addEventListener('click', closeModal);
        document.getElementById('editStudentForm')?.addEventListener('submit', handleSaveStudentEdit);
      },
      onPermissionsUpdated: ({ hasPerm }) => {
        if (actorCtx) actorCtx.hasPerm = hasPerm;
        renderStudentsTable();
      }
    });

    function populateTeacherFilter() {
      const sel = document.getElementById('filterTeacherSelect');
      if (!sel) return;
      const prev = sel.value;
      sel.innerHTML = '<option value="all">جميع المعلمين</option>' +
        teachersCache
          .slice()
          .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'))
          .map((t) => `<option value="${escapeHtml(t.uid || t.id)}">${escapeHtml(t.name || 'معلم')}</option>`)
          .join('');
      if (prev) sel.value = prev;
    }

    function renderStudentsTable() {
      const tbody = document.getElementById('studentsTableBody');
      if (!tbody) return;

      const queryStr = (document.getElementById('searchStudentsInput')?.value || '').trim().toLowerCase();
      const statusFilter = document.getElementById('filterStatusSelect')?.value || 'all';
      const teacherFilter = document.getElementById('filterTeacherSelect')?.value || 'all';

      const filtered = summariesCache.filter((st) => {
        const normStatus = String(st.status || 'active').toLowerCase();
        if (statusFilter !== 'all') {
          if (statusFilter === 'suspended' && !['suspended', 'Suspended'].includes(st.status)) return false;
          else if (statusFilter !== 'suspended' && normStatus !== statusFilter) return false;
        }
        if (teacherFilter !== 'all' && st.teacherId !== teacherFilter) return false;
        if (queryStr) {
          const hay = `${st.name || ''} ${st.parentName || ''} ${st.parentPhone || ''} ${st.whatsapp || ''} ${st.teacherName || ''}`.toLowerCase();
          if (!hay.includes(queryStr)) return false;
        }
        return true;
      });

      const activeCount = filtered.filter((s) => String(s.status || 'active').toLowerCase() === 'active').length;
      const lowBalCount = filtered.filter((s) => {
        const rem = Number(s.remainingLessons ?? s.remainingSessions ?? 0);
        return String(s.status || 'active').toLowerCase() === 'active' && rem < 3;
      }).length;

      document.getElementById('countFilteredStudents').textContent = String(filtered.length);
      document.getElementById('countActiveStudents').textContent = String(activeCount);
      document.getElementById('countLowBalanceStudents').textContent = String(lowBalCount);

      if (summariesCache.length === 0) {
        const streamErr = dataStore.getError('studentOperationalSummaries');
        if (streamErr) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--danger);">تعذر تحميل بيانات الطلاب التشغيلية من قاعدة البيانات (${escapeHtml(streamErr.code || streamErr.message || 'permission-denied')}). تأكد من نشر قواعد Firestore الأخيرة واعتماد حساب المشرف.</td></tr>`;
        } else {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">لا توجد بيانات طلاب تشغيلية مزامنة حتى الآن. يرجى فتح لوحة المدير أو صفحة الطلاب من حساب الإدارة لمزامنة الملخصات التشغيلية.</td></tr>';
        }
        return;
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">
              <div>لا توجد سجلات طلاب مطابقة لخيارات البحث (${summariesCache.length} طالب متاح).</div>
              <button type="button" id="resetStudentFiltersBtn" class="btn btn-secondary btn-sm" style="margin-top: 0.75rem;">
                إعادة ضبط البحث والفلاتر
              </button>
            </td>
          </tr>
        `;
        document.getElementById('resetStudentFiltersBtn')?.addEventListener('click', () => {
          userHasTypedSearch = false;
          const sInput = document.getElementById('searchStudentsInput');
          const stSel = document.getElementById('filterStatusSelect');
          const tSel = document.getElementById('filterTeacherSelect');
          if (sInput) sInput.value = '';
          if (stSel) stSel.value = 'all';
          if (tSel) tSel.value = 'all';
          renderStudentsTable();
        });
        return;
      }

      const canEdit = actorCtx?.hasPerm(PERMISSIONS.EDIT_STUDENT_OPERATIONAL);
      const canRequest = actorCtx?.hasPerm(PERMISSIONS.CREATE_REQUESTS);

      tbody.innerHTML = filtered.map((st) => {
        const statusMeta = STUDENT_STATUS_META[st.status] || { label: st.status || 'نشط', tone: 'neutral' };
        const duration = getStudentDefaultDuration(st);
        const total = Number(st.totalLessons || 0);
        const remaining = Number(st.remainingLessons ?? st.remainingSessions ?? 0);
        const used = Number(st.usedLessons || 0);
        const daysList = Array.isArray(st.schedule?.days) && st.schedule.days.length > 0 ? st.schedule.days : (st.days || []);
        const timeStr = st.schedule?.uniformTime || st.sessionTime || 'غير محدد';
        const phone = st.whatsapp || st.parentPhone || 'غير مسجل';

        return `
          <tr>
            <td>
              <strong style="color: var(--text-primary);">${escapeHtml(st.name || 'طالب')}</strong>
              <div style="font-size: 0.74rem; color: var(--text-muted);">${st.age ? `العمر: ${escapeHtml(st.age)}` : 'العمر غير محدد'}</div>
            </td>
            <td>
              <div style="font-weight: 600;">${escapeHtml(st.parentName || 'غير مسجل')}</div>
              <div style="font-size: 0.76rem; color: var(--primary-color);" class="tabular-nums">${escapeHtml(phone)}</div>
            </td>
            <td>${escapeHtml(st.teacherName || 'غير معين')}</td>
            <td>
              <div style="font-weight: 600;">${escapeHtml(st.packageName || 'باقة قياسية')}</div>
              <div style="font-size: 0.74rem; color: var(--text-muted);" class="tabular-nums">${escapeHtml(duration)} دقيقة / حصة</div>
            </td>
            <td>
              <div style="font-weight: 700;" class="tabular-nums">المتبقي: <span style="color: ${remaining < 3 ? 'var(--danger)' : 'var(--success)'};">${remaining}</span></div>
              <div style="font-size: 0.74rem; color: var(--text-muted);" class="tabular-nums">المستهلك: ${used} من ${total}</div>
            </td>
            <td>
              <div style="font-size: 0.78rem; font-weight: 600;">${daysList.length > 0 ? escapeHtml(daysList.join('، ')) : 'بدون أيام مجدولة'}</div>
              <div style="font-size: 0.74rem; color: var(--text-muted);" class="tabular-nums">${escapeHtml(timeStr)}</div>
            </td>
            <td>${badgeHtml(statusMeta.label, statusMeta.tone)}</td>
            <td>
              <div style="display: flex; gap: 0.35rem; flex-wrap: wrap;">
                ${canEdit ? `
                  <button type="button" class="btn btn-secondary btn-sm btn-edit-student" data-id="${escapeHtml(st.id)}" title="تعديل البيانات التشغيلية">
                    <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
                    تعديل
                  </button>
                ` : ''}
                ${canRequest ? `
                  <a href="./requests.html?type=teacher_replacement&targetId=${encodeURIComponent(st.id)}&targetName=${encodeURIComponent(st.name || '')}" class="btn btn-outline btn-sm" title="رفع طلب إداري">
                    <i data-lucide="send" style="width: 14px; height: 14px;"></i>
                    طلب إداري
                  </a>
                ` : ''}
                ${!canEdit && !canRequest ? badgeHtml('عرض فقط', 'neutral') : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.btn-edit-student').forEach((btn) => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });

      if (window.lucide) window.lucide.createIcons({ root: tbody });
    }

    function openEditModal(studentId) {
      if (!actorCtx?.hasPerm(PERMISSIONS.EDIT_STUDENT_OPERATIONAL)) {
        Toast.warning('لا تمتلك صلاحية تعديل بيانات الطلاب التشغيلية.');
        return;
      }
      const st = summariesCache.find((s) => s.id === studentId);
      if (!st) return;

      document.getElementById('editStudentId').value = st.id;
      document.getElementById('editStudentNameHeader').textContent = st.name || 'طالب';
      document.getElementById('editStudentPackageHeader').textContent = `الباقة: ${st.packageName || 'غير محددة'} | المعلم: ${st.teacherName || 'غير معين'}`;
      document.getElementById('editParentName').value = st.parentName || '';
      document.getElementById('editParentPhone').value = st.whatsapp || st.parentPhone || '';
      document.getElementById('editStudentStatus').value = ['paused', 'frozen'].includes(String(st.status || '').toLowerCase())
        ? String(st.status).toLowerCase()
        : 'active';
      document.getElementById('editMemorizationDir').value = st.memorizationDirection || 'ascending';
      document.getElementById('editStudentNotes').value = st.notes || '';

      document.getElementById('editStudentModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editStudentModal').style.display = 'none';
    }

    async function handleSaveStudentEdit(e) {
      e.preventDefault();
      if (!actorCtx?.hasPerm(PERMISSIONS.EDIT_STUDENT_OPERATIONAL)) return;

      const studentId = document.getElementById('editStudentId').value;
      const existing = summariesCache.find((s) => s.id === studentId);
      if (!existing) return;

      const btn = document.getElementById('saveEditStudentBtn');
      btn.disabled = true;

      const updates = {
        parentName: document.getElementById('editParentName').value.trim(),
        parentPhone: document.getElementById('editParentPhone').value.trim(),
        whatsapp: document.getElementById('editParentPhone').value.trim(),
        status: document.getElementById('editStudentStatus').value,
        memorizationDirection: document.getElementById('editMemorizationDir').value,
        notes: document.getElementById('editStudentNotes').value.trim(),
        updatedAt: serverTimestamp()
      };

      try {
        await updateDoc(doc(db, 'studentOperationalSummaries', studentId), updates);
        await logActivity({
          actorId: actorCtx.uid,
          actorName: actorCtx.name,
          actorRole: 'supervisor',
          actionType: 'student_operational_updated',
          targetCollection: 'studentOperationalSummaries',
          targetId: studentId,
          summary: `تحديث البيانات التشغيلية للطالب (${existing.name || studentId})`,
          oldValue: { status: existing.status, parentPhone: existing.parentPhone || '' },
          newValue: { status: updates.status, parentPhone: updates.parentPhone }
        });
        Toast.success('تم حفظ البيانات التشغيلية للطالب وتوثيق التعديل.');
        closeModal();
      } catch (err) {
        console.error(err);
        Toast.danger('تعذر حفظ التعديلات، يرجى التحقق من الصلاحيات.');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
