<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سبيل - الملف الشخصي والصلاحيات</title>

  <script>
    try {
      if (localStorage.getItem('academy_dark_mode') === 'true' || localStorage.getItem('sabeel_theme') === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="/assets/vendor/lucide-1.80.0.min.js"></script>

  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <header class="navbar" id="appNavbar"></header>

      <main class="content-body">
        <div class="dashboard-main-grid" style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 1.25rem; align-items: start;">
          <!-- Profile Identity Card -->
          <div class="card">
            <div class="card-header">
              <h1 style="font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="user-circle" style="width: 18px; height: 18px; color: var(--primary-color);"></i>
                بيانات حساب المشرف
              </h1>
              <span class="badge badge-primary">مشرف تشغيلي</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.8rem;">
              <div style="padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm);">
                <div style="font-size: 0.74rem; color: var(--text-muted);">الاسم الكامل</div>
                <strong id="profileName" style="font-size: 0.95rem;">-</strong>
              </div>
              <div style="padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm);">
                <div style="font-size: 0.74rem; color: var(--text-muted);">البريد الإلكتروني</div>
                <strong id="profileEmail" style="font-size: 0.88rem;" class="tabular-nums">-</strong>
              </div>
              <div style="padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm);">
                <div style="font-size: 0.74rem; color: var(--text-muted);">المسمى / القسم</div>
                <strong id="profileTitle" style="font-size: 0.9rem;">-</strong>
              </div>

              <div style="padding: 0.85rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-weight: 700; font-size: 0.86rem;">الوضع الداكن (Matte Black)</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">يتم حفظ المظهر تلقائياً في جميع الصفحات</div>
                </div>
                <button type="button" id="profileThemeToggleBtn" class="btn btn-secondary btn-sm">تبديل المظهر</button>
              </div>

              <button type="button" id="btnSendPasswordReset" class="btn btn-outline" style="width: 100%;">
                <i data-lucide="key-round" style="width: 16px; height: 16px;"></i>
                إرسال رابط تغيير كلمة المرور للبريد
              </button>
            </div>
          </div>

          <!-- Live Read-Only Permissions Matrix -->
          <div class="card">
            <div class="card-header">
              <h2 style="font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="shield-check" style="width: 18px; height: 18px; color: var(--primary-color);"></i>
                مصفوفة الصلاحيات النشطة لحسابك
              </h2>
              <span class="badge badge-info" id="activePermsCountBadge">0 من 12</span>
            </div>
            <p style="margin: 0 0 1rem; font-size: 0.82rem; color: var(--text-secondary);">تُحدَّث هذه الصلاحيات مباشرة من الإدارة العامة وتنعكس فورياً على القائمة الجانبية والوصول للبيانات.</p>
            <div id="permissionsMatrixGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth } from '../assets/js/config/firebase.js';
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      initSupervisorPage,
      escapeHtml,
      badgeHtml
    } from '../assets/js/features/supervisor/supervisorPageShell.js';
    import { PERMISSION_CATALOG } from '../assets/js/features/rbac/rbacService.js';
    import { Toast } from '../assets/js/shared/utils/toast.js';

    let currentEmail = '';

    initSupervisorPage({
      pageId: 'profile',
      pageTitle: 'الملف الشخصي والصلاحيات',
      requiredPermission: null,
      onReady: (ctx) => {
        currentEmail = ctx.email;
        document.getElementById('profileName').textContent = ctx.name || '-';
        document.getElementById('profileEmail').textContent = ctx.email || '-';
        document.getElementById('profileTitle').textContent = ctx.supervisorTitle || ctx.department || 'مشرف تشغيلي';

        renderPermissionsMatrix(ctx.permissions);

        document.getElementById('profileThemeToggleBtn')?.addEventListener('click', () => {
          const isDark = document.documentElement.classList.contains('dark-theme');
          const nextDark = !isDark;
          localStorage.setItem('academy_dark_mode', nextDark ? 'true' : 'false');
          localStorage.setItem('sabeel_theme', nextDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark-theme', nextDark);
          document.body.classList.toggle('dark-theme', nextDark);
          window.dispatchEvent(new CustomEvent('sabeel-theme-changed', { detail: { isDark: nextDark } }));
          Toast.success(nextDark ? 'تم تفعيل الوضع الداكن بنجاح.' : 'تم تفعيل الوضع الفاتح بنجاح.');
        });

        document.getElementById('btnSendPasswordReset')?.addEventListener('click', async () => {
          if (!currentEmail) return;
          try {
            await sendPasswordResetEmail(auth, currentEmail);
            Toast.success('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.');
          } catch (err) {
            console.error(err);
            Toast.danger('تعذر إرسال رابط استعادة كلمة المرور.');
          }
        });
      },
      onPermissionsUpdated: ({ permissions }) => {
        renderPermissionsMatrix(permissions);
      }
    });

    function renderPermissionsMatrix(perms = {}) {
      const container = document.getElementById('permissionsMatrixGrid');
      const countBadge = document.getElementById('activePermsCountBadge');
      if (!container) return;

      let enabledCount = 0;
      container.innerHTML = PERMISSION_CATALOG.map((perm) => {
        const granted = perms[perm.key] === true;
        if (granted) enabledCount++;
        return `
          <div style="padding: 0.75rem; background: var(--bg-primary); border: 1px solid ${granted ? 'var(--primary-border)' : 'var(--border-color)'}; border-radius: var(--border-radius-sm);">
            <div style="display: flex; justify-content: space-between; align-items: start; gap: 0.5rem; margin-bottom: 0.35rem;">
              <strong style="font-size: 0.84rem; color: var(--text-primary);">${escapeHtml(perm.label)}</strong>
              ${badgeHtml(granted ? 'مفعلة' : 'مقيدة', granted ? 'success' : 'neutral')}
            </div>
            <p style="margin: 0; font-size: 0.75rem; color: var(--text-secondary); line-height: 1.45;">${escapeHtml(perm.description)}</p>
          </div>
        `;
      }).join('');

      if (countBadge) {
        countBadge.textContent = `${enabledCount} من ${PERMISSION_CATALOG.length}`;
      }
    }
  </script>
</body>
</html>
