<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - سلة المهملات والمحذوفات</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="/assets/vendor/lucide.min.js"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>

</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">سلة المحذوفات والمستندات المؤقتة</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">استعراض السجلات المحذوفة إدارياً، مع خيار استعادتها وتعميمها بنقرة واحدة.</p>
        </div>

        <div class="card">
          <div class="table-container" style="margin-top: 0;">
            <table>
              <thead>
                <tr>
                  <th>المستند المحذوف</th>
                  <th>النوع والمصدر</th>
                  <th>سبب وتاريخ الحذف</th>
                  <th>المشرف المنفذ</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="trashTableBody">
                <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">جاري مزامنة وجلب السجلات المحذوفة مع الخادم...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';
    import { showCustomConfirm } from '../assets/js/shared/utils/helpers.js';

    protectRoute('admin');

    let currentAdminName = "مشرف النظام";

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Accepts Firestore Timestamp, ISO string, epoch number or {seconds} object.
    function toMillis(value) {
      if (!value) return null;
      if (typeof value.toDate === 'function') {
        const d = value.toDate();
        return d instanceof Date && !Number.isNaN(d.getTime()) ? d.getTime() : null;
      }
      if (typeof value === 'number') {
        const ms = value > 1e12 ? value : value * 1000;
        return Number.isFinite(ms) ? ms : null;
      }
      if (typeof value === 'string') {
        const ms = Date.parse(value);
        return Number.isFinite(ms) ? ms : null;
      }
      if (typeof value.seconds === 'number') {
        const ms = value.seconds * 1000 + Math.floor((value.nanoseconds || 0) / 1e6);
        return Number.isFinite(ms) ? ms : null;
      }
      return null;
    }

    // Single local formatter: Arabic date/time, or "—" for missing/invalid dates.
    function formatDateSafe(value) {
      const ms = toMillis(value);
      return ms === null ? '—' : new Date(ms).toLocaleString('ar-EG');
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentAdminName = user.displayName || "مدير الأكاديمية";
        renderSidebar('trash', 'admin');
        renderNavbar('سلة المحذوفات', { name: 'الإدارة العامة', roleName: 'مدير الأكاديمية' });
        initTrashRealtime();
      }
    });

    function initTrashRealtime() {
      const tbody = document.getElementById('trashTableBody');
      if (!tbody) return;

      onSnapshot(collection(db, "trash"), (snapshot) => {
        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">سلة المحذوفات فارغة تماماً ولا توجد قيود معلقة.</td></tr>`;
          return;
        }

        const list = [];
        snapshot.forEach(docSnap => {
          list.push({ id: docSnap.id, ...docSnap.data() });
        });

        // فرز من الأحدث للأقدم (يتوافق مع كل أشكال الطابع الزمني)
        list.sort((a, b) => (toMillis(b.deletedAt) ?? 0) - (toMillis(a.deletedAt) ?? 0));

        tbody.innerHTML = list.map(item => {
          const dateStr = escapeHtml(formatDateSafe(item.deletedAt));
          const payloadData = item.data || {};
          const label = escapeHtml(payloadData.name || payloadData.studentName || item.originalId || "مستند مبهم");
          const originalId = escapeHtml(item.originalId ?? '');
          const reason = escapeHtml(item.deletionReason || item.description || 'حذف معلق');
          const deletedBy = escapeHtml(item.deletedByName || 'مدير عام');
          const docId = escapeHtml(item.id);
          
          return `
            <tr>
              <td><strong>${label}</strong><div style="font-size: 0.75rem; color: var(--text-muted);">ID: ${originalId}</div></td>
              <td><span class="badge" style="position: static; background-color: var(--primary-light); color: var(--primary-color);">${item.originalCollection === 'users' ? 'معلم 👤' : 'طالب / حصة 📅'}</span></td>
              <td>${dateStr}<div style="font-size: 0.75rem; color: var(--danger); font-weight: 600;">السبب: ${reason}</div></td>
              <td>${deletedBy}</td>
              <td>
                <div style="display: flex; gap: 0.5rem;">
                  <button class="btn btn-primary restore-btn" data-id="${docId}" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;"><i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i> استعادة</button>
                  <button class="btn btn-secondary delete-final-btn" data-id="${docId}" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; color: var(--danger);"><i data-lucide="trash-2" style="width:14px;height:14px;"></i> إتلاف</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        if (window.lucide) {
          window.lucide.createIcons();
        }
        setupTrashListeners(list);
      }, (err) => console.warn("Trash listener warning:", err));
    }

    function setupTrashListeners(list) {
      document.querySelectorAll('.restore-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const btnEl = e.target.closest('.restore-btn');
          const id = btnEl?.dataset.id;
          const record = list.find(r => r.id === id);
          if (!record) return;

          showCustomConfirm(`هل تريد استعادة السجل المحذوف (${escapeHtml(record.data?.name || record.data?.studentName || 'المستند')}) وإعادته لمكانه المعتمد فوراً؟`, async () => {
            try {
              // 1. إعادة المستند لجدوله الأصلي
              await setDoc(doc(db, record.originalCollection, record.originalId), record.data);
              
              // 2. إزالته من السلة
              await deleteDoc(doc(db, "trash", id));
              
              Toast.success("تم استعادة وترميم السجل بنجاح وإعادته لقاعدة البيانات الفعالة.");
            } catch (err) {
              console.error(err);
              Toast.danger("حدث خطأ أثناء محاولة الاستعادة المباشرة.");
            }
          });
        });
      });

      document.querySelectorAll('.delete-final-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const btnEl = e.target.closest('.delete-final-btn');
          const id = btnEl?.dataset.id;
          showCustomConfirm("🚨 تنبيه: هل تريد إتلاف وإزالة هذا السجل نهائياً تماماً من الخادم وقاعدة البيانات؟ لا يمكن التراجع!", async () => {
            try {
              await deleteDoc(doc(db, "trash", id));
              Toast.success("تم إتلاف وإزالة السجل نهائياً.");
            } catch (err) {
              console.error(err);
              Toast.danger("فشل إتلاف السجل.");
            }
          });
        });
      });
    }
  </script>
</body>
</html>
