<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - الحصص الجارية اليوم (الإدارة)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="/assets/vendor/lucide-1.80.0.min.js"></script>
  <style>
    .session-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .session-item-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform var(--transition-fast), border-color var(--transition-fast);
    }
    .session-item-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>

</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="play-circle" style="color: var(--primary-color); width: 28px; height: 28px;"></i>
              الحصص الجارية اليوم
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">متابعة فورية للحصص المجدولة والمكتملة لليوم مع أسماء المعلمين وحالة التنفيذ.</p>
          </div>
          <div style="font-size: 0.85rem; padding: 0.5rem 1rem; border-radius: 30px; background-color: rgba(var(--primary-rgb, 14, 165, 233), 0.1); color: var(--primary-color); font-weight: 700;" id="todayAdminDateLabel">
            اليوم: ...
          </div>
        </div>

        <!-- summary stats -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="card" style="border-right: 4px solid var(--primary-color);">
            <div style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">إجمالي حصص اليوم</div>
            <h3 id="statTodayTotal" style="font-size: 1.6rem; font-weight: 800; margin-top: 0.25rem;">جار التحميل…</h3>
          </div>
          <div class="card" style="border-right: 4px solid var(--success);">
            <div style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">تمت بنجاح ✅</div>
            <h3 id="statTodayCompleted" style="font-size: 1.6rem; font-weight: 800; margin-top: 0.25rem; color: var(--success);">جار التحميل…</h3>
          </div>
          <div class="card" style="border-right: 4px solid #6366f1;">
            <div style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">لم تتم بعد ⏳</div>
            <h3 id="statTodayPending" style="font-size: 1.6rem; font-weight: 800; margin-top: 0.25rem; color: #6366f1;">جار التحميل…</h3>
          </div>
          <div class="card" style="border-right: 4px solid #d97706;">
            <div style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">مؤجلة 🔄</div>
            <h3 id="statTodayDelayed" style="font-size: 1.6rem; font-weight: 800; margin-top: 0.25rem; color: #d97706;">جار التحميل…</h3>
          </div>
          <div class="card" style="border-right: 4px solid var(--danger);">
            <div style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">غياب / ملغاة 🔴</div>
            <h3 id="statTodayAbsent" style="font-size: 1.6rem; font-weight: 800; margin-top: 0.25rem; color: var(--danger);">جار التحميل…</h3>
          </div>
        </div>

        <!-- filters -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1rem 1.25rem;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
            <div style="flex: 1; min-width: 220px;">
              <input type="text" id="adminSearchInput" class="form-control" placeholder="بحث باسم الطالب أو المعلم...">
            </div>
            <div style="width: 180px;">
              <select id="adminStatusFilter" class="form-control">
                <option value="all">كل الحالات</option>
                <option value="completed">تمت بنجاح ✅</option>
                <option value="pending">لم تتم بعد ⏳</option>
                <option value="delayed">مؤجلة 🔄</option>
                <option value="absent">غياب / ملغاة 🔴</option>
              </select>
            </div>
          </div>
        </div>

        <!-- list container -->
        <div id="adminTodaySessionsGrid" class="session-card-grid">
          <p style="text-align: center; color: var(--text-muted); padding: 2rem; grid-column: 1 / -1;">جاري تحميل حصص اليوم الفورية...</p>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { db } from '../assets/js/config/firebase.js';
    import { collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { openRecordGroupSessionModal, openGroupSessionDetailsModal } from '../assets/js/features/groups/groupSessionModal.js';

    protectRoute('admin');

    // تواريخ محلية (توقيت مصر): لا نستخدم toISOString() لتحديد يوم اليوم
    const pad2 = n => String(n).padStart(2, '0');
    const localDate = (value) => {
      if (value === null || value === undefined || value === '') return '';
      let d;
      try {
        if (typeof value === 'string') {
          const match = value.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (match) return `${match[1]}-${match[2]}-${match[3]}`;
          d = new Date(value);
        } else if (value instanceof Date) {
          d = value;
        } else if (typeof value?.toDate === 'function') {
          d = value.toDate();
        } else if (typeof value?.seconds === 'number') {
          d = new Date(value.seconds * 1000);
        } else {
          d = new Date(value);
        }
      } catch (_) {
        return '';
      }
      if (!d || isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    };
    const localMonthKey = (value) => {
      const key = localDate(value);
      return key ? key.slice(0, 7) : '';
    };
    const escapeHtml = (value) => {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('today-sessions', 'admin');
      renderNavbar('الحصص الجارية اليوم', { name: 'المشرف العام', roleName: 'مدير النظام' });

      function normalizeArabicDay(dayStr) {
        if (!dayStr) return '';
        return String(dayStr).trim()
          .replace(/[أإآ]/g, 'ا')
          .replace(/ة/g, 'ه');
      }

      const arabicDays = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const now = new Date();
      const todayArabic = arabicDays[now.getDay()];
      const todayStr = localDate(now);
      const todayMonthKey = localMonthKey(now);

      const dateLabel = document.getElementById('todayAdminDateLabel');
      if (dateLabel) dateLabel.textContent = `اليوم: ${todayArabic} (${todayStr})`;

      let sessionsCached = [];
      let studentsCached = [];
      let groupsCached = [];
      let groupSessionsCached = [];
      const adminTodayUnsubs = [];

      // 1. Listen to individual sessions today (scoped query)
      const qToday = query(collection(db, "sessions"), where("date", "==", todayStr));
      adminTodayUnsubs.push(onSnapshot(qToday, (sessSnap) => {
        const todaySessions = sessSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        // merge with postponed-from-today set
        const prevPostponed = sessionsCached.filter(s => localDate(s.postponedFrom) === todayStr && localDate(s.date) !== todayStr);
        sessionsCached = [...todaySessions, ...prevPostponed];
        renderAdminTodayList();
      }, (err) => console.warn("Admin today sessions listener error:", err)));

      // 1b. Sessions postponed from today (separate scoped query)
      const qPostponed = query(collection(db, "sessions"), where("postponedFrom", "==", todayStr));
      adminTodayUnsubs.push(onSnapshot(qPostponed, (snap) => {
        const postponed = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => localDate(s.date) !== todayStr);
        const todayOnly = sessionsCached.filter(s => localDate(s.date) === todayStr);
        sessionsCached = [...todayOnly, ...postponed];
        renderAdminTodayList();
      }, (err) => console.warn("Admin today postponed sessions listener error:", err)));

      // 2. Listen to active students
      adminTodayUnsubs.push(onSnapshot(collection(db, "students"), (studSnap) => {
        studentsCached = [];
        studSnap.forEach(d => {
          const student = { id: d.id, ...d.data() };
          studentsCached.push(student);
        });
        renderAdminTodayList();
      }, (err) => console.warn("Admin today students listener error:", err)));

      // 3. Listen to active groups
      adminTodayUnsubs.push(onSnapshot(collection(db, "groups"), (grpSnap) => {
        groupsCached = [];
        grpSnap.forEach(d => {
          const gData = d.data();
          if (gData.status !== 'archived') {
            groupsCached.push({ id: d.id, ...gData });
          }
        });
        renderAdminTodayList();
      }, (err) => console.warn("Admin today groups listener error:", err)));

      // 4. Listen to group_sessions today (استعلام مقيّد بتاريخ اليوم بدل تحميل كل السجلات)
      const qGroupSessionsToday = query(collection(db, "group_sessions"), where("date", "==", todayStr));
      adminTodayUnsubs.push(onSnapshot(qGroupSessionsToday, (gsSnap) => {
        groupSessionsCached = [];
        gsSnap.forEach(d => {
          const gs = d.data();
          if (localDate(gs.date) === todayStr) {
            groupSessionsCached.push({ id: d.id, ...gs });
          }
        });
        renderAdminTodayList();
      }, (err) => console.warn("Admin today group_sessions listener error:", err)));

      document.getElementById('adminSearchInput')?.addEventListener('input', renderAdminTodayList);
      document.getElementById('adminStatusFilter')?.addEventListener('change', renderAdminTodayList);

      function parseTimeToMinutes(timeStr) {
        if (!timeStr || typeof timeStr !== 'string') return 9999;
        const str = timeStr.trim().toLowerCase();
        if (str === 'غير محدد' || !str) return 9999;
        
        let isPM = false;
        let isAM = false;

        if (str.includes('م') || str.includes('مساء') || str.includes('pm')) {
          isPM = true;
        } else if (str.includes('ص') || str.includes('صباح') || str.includes('am')) {
          isAM = true;
        }

        const match = str.match(/(\d{1,2})(?::(\d{2}))?/);
        if (!match) return 9999;

        let hours = parseInt(match[1], 10);
        let minutes = match[2] ? parseInt(match[2], 10) : 0;

        if (isPM && hours < 12) {
          hours += 12;
        } else if (isAM && hours === 12) {
          hours = 0;
        }

        return hours * 60 + minutes;
      }

      function renderAdminTodayList() {
        const grid = document.getElementById('adminTodaySessionsGrid');
        if (!grid) return;

        const queryVal = (document.getElementById('adminSearchInput')?.value || '').trim().toLowerCase();
        const statusFilter = document.getElementById('adminStatusFilter')?.value || 'all';

        const displayItems = [];

        // --- A. Process Group Sessions (Groups as primary entity) ---
        groupsCached.forEach(grp => {
          const grpDays = grp.day ? [grp.day] : (grp.days || []);
          const isScheduledToday = grpDays.some(d => normalizeArabicDay(d) === normalizeArabicDay(todayArabic));
          const recordedGroupSession = groupSessionsCached.find(gs => gs.groupId === grp.id && localDate(gs.date) === todayStr);
          // الحصة الجماعية تُعد مكتملة فقط إذا كانت حالة السجل صريحة completed
          const isGroupCompleted = recordedGroupSession?.status === 'completed';

          if (!isScheduledToday) return;

          let statusKey = 'pending';
          let statusLabel = 'لم تتم بعد ⏳';
          let badgeBg = 'background: rgba(99, 102, 241, 0.12); color: #6366f1;';

          if (isGroupCompleted) {
            statusKey = 'completed';
            statusLabel = 'تمت بنجاح ✅';
            badgeBg = 'background: rgba(16, 185, 129, 0.12); color: var(--success);';
          }

          displayItems.push({
            id: `grp_${grp.id}`,
            isGroup: true,
            groupId: grp.id,
            groupObj: grp,
            name: `📚 ${grp.name || 'مجموعة جماعية'}`,
            teacherName: grp.teacherName || recordedGroupSession?.teacherName || 'غير معين',
            time: grp.time || recordedGroupSession?.time || '05:30 مساءً',
            studentCount: grp.studentIds?.length || 0,
            statusKey,
            statusLabel,
            badgeBg,
            recordedGroupSession
          });
        });

        // --- B. Process Individual Scheduled Students (excluding group students) ---
        studentsCached.forEach(st => {
          if (st.status === 'archived' || st.status === 'Suspended' || st.status === 'pending_approval') return;
          if (st.subscriptionType === 'group' || st.groupId) return; // Exclude group students from individual cards

          const scheduleDays = (st.schedule && st.schedule.days) ? st.schedule.days : (st.sessionDays || []);
          const isScheduledToday = scheduleDays.some(d => normalizeArabicDay(d) === normalizeArabicDay(todayArabic));

          if (!isScheduledToday) return;

          // 1. Session recorded specifically for TODAY
          const sessionToday = sessionsCached.find(s => s.studentId === st.id && localDate(s.date) === todayStr);

          // 2. Session postponed FROM today to a future date
          const postponedFromToday = sessionsCached.find(s => s.studentId === st.id && localDate(s.postponedFrom) === todayStr && localDate(s.date) !== todayStr && s.status === 'delayed');

          let statusKey = 'pending';
          let statusLabel = 'لم تتم بعد ⏳';
          let badgeBg = 'background: rgba(99, 102, 241, 0.12); color: #6366f1;';

          const activeSession = sessionToday || postponedFromToday;

          if (activeSession) {
            if (activeSession.status === 'completed') {
              statusKey = 'completed';
              statusLabel = 'تمت بنجاح ✅';
              badgeBg = 'background: rgba(16, 185, 129, 0.12); color: var(--success);';
            } else if (activeSession.status === 'student_absent') {
              statusKey = 'absent';
              statusLabel = activeSession.absenceType === 'unexcused' ? 'غياب بدون عذر 🔴' : 'غياب بعذر 🟢';
              badgeBg = 'background: rgba(239, 68, 68, 0.12); color: var(--danger);';
            } else if (activeSession.status === 'delayed') {
              statusKey = 'delayed';
              if (localDate(activeSession.postponedFrom) === todayStr && localDate(activeSession.date) !== todayStr) {
                statusLabel = `مؤجلة إلى (${localDate(activeSession.date)}) ⏳`;
              } else if (activeSession.postponedFrom && localDate(activeSession.postponedFrom) !== todayStr) {
                statusLabel = `مؤجلة من (${localDate(activeSession.postponedFrom)}) 🔄`;
              } else {
                statusLabel = 'مؤجلة 🔄';
              }
              badgeBg = 'background: rgba(217, 119, 6, 0.12); color: #d97706;';
            } else if (activeSession.status === 'teacher_absent') {
              statusKey = 'absent';
              statusLabel = 'غياب معلم 🟠';
              badgeBg = 'background: rgba(249, 115, 22, 0.12); color: #ea580c;';
            } else if (activeSession.status === 'compensatory') {
              statusKey = 'completed';
              statusLabel = 'حصة تعويضية 🔁';
              badgeBg = 'background: rgba(16, 185, 129, 0.12); color: var(--success);';
            } else if (activeSession.status === 'cancelled') {
              statusKey = 'absent';
              statusLabel = 'ملغاة ❌';
              badgeBg = 'background: rgba(239, 68, 68, 0.12); color: var(--danger);';
            }
          }

          let sessionTime = st.schedule?.uniformTime || st.sessionTime || 'غير محدد';
          if (st.schedule?.differentTimes && st.schedule?.times?.[todayArabic]) {
            sessionTime = st.schedule.times[todayArabic];
          }

          displayItems.push({
            id: st.id,
            isGroup: false,
            name: st.name || 'طالب',
            teacherName: st.teacherName || activeSession?.teacherName || 'غير معين',
            time: sessionTime,
            statusKey,
            statusLabel,
            badgeBg,
            recorded: activeSession
          });
        });

        // Update Summary Stats Counters
        document.getElementById('statTodayTotal').textContent = displayItems.length;
        document.getElementById('statTodayCompleted').textContent = displayItems.filter(i => i.statusKey === 'completed').length;
        document.getElementById('statTodayPending').textContent = displayItems.filter(i => i.statusKey === 'pending').length;
        document.getElementById('statTodayDelayed').textContent = displayItems.filter(i => i.statusKey === 'delayed').length;
        document.getElementById('statTodayAbsent').textContent = displayItems.filter(i => i.statusKey === 'absent').length;

        // Filter items by search & status
        const filtered = displayItems.filter(item => {
          const matchSearch = !queryVal || 
            item.name.toLowerCase().includes(queryVal) || 
            item.teacherName.toLowerCase().includes(queryVal);
          const matchStatus = statusFilter === 'all' || item.statusKey === statusFilter;
          return matchSearch && matchStatus;
        });

        // Sort chronologically by time
        filtered.sort((a, b) => parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time));

        if (filtered.length === 0) {
          grid.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 2rem; grid-column: 1 / -1;">لا توجد حصص مطابقة لشروط البحث أو الفلترة المحددة اليوم.</p>`;
          return;
        }

        grid.innerHTML = filtered.map(item => {
          if (item.isGroup) {
            const isCompleted = item.statusKey === 'completed';
            const recorded = item.recordedGroupSession;

            return `
              <div class="session-item-card" style="border-right: 4px solid ${isCompleted ? 'var(--success)' : 'var(--primary-color)'};">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;">
                  <div>
                    <div style="display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;">
                      <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--text-primary); margin: 0;">${escapeHtml(item.name)}</h4>
                      <span class="badge" style="position: static; font-size: 0.7rem; background: rgba(14, 165, 233, 0.12); color: var(--primary-color); font-weight: 800;">حصة جماعية 👥</span>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
                      <i data-lucide="clock" style="width: 14px; height: 14px; color: var(--text-muted);"></i>
                      <span>موعد الحصة: <strong>${escapeHtml(item.time)}</strong></span>
                    </div>
                  </div>
                  <span class="badge" style="position: static; font-weight: 800; font-size: 0.75rem; padding: 0.3rem 0.65rem; border-radius: 6px; ${item.badgeBg}">
                    ${item.statusLabel}
                  </span>
                </div>

                ${isCompleted ? `
                  <div style="font-size: 0.78rem; background: var(--bg-primary); padding: 0.55rem 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;">
                    <span>🕒 تسجلت: <strong>${escapeHtml(recorded?.recordedAt || '')}</strong></span>
                    <span style="color: var(--success); font-weight: 800;">👥 حضور: ${recorded?.presentCount || 0}/${recorded?.totalCount || 0}</span>
                    <span style="color: var(--danger); font-weight: 800;">❌ غياب: ${recorded?.absentCount || 0}</span>
                  </div>
                ` : `
                  <div style="font-size: 0.78rem; color: var(--text-secondary);">
                    <span>👥 عدد الطلاب بالمجموعة: <strong>${item.studentCount} طلاب</strong></span>
                  </div>
                `}

                <div style="padding-top: 0.5rem; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; font-size: 0.85rem;">
                  <span style="color: var(--text-primary);">المعلم: <strong style="color: var(--primary-color); font-weight: 800;">${escapeHtml(item.teacherName)}</strong></span>
                  ${isCompleted ? `
                    <button type="button" class="btn btn-secondary btn-admin-view-grp" data-grp-id="${escapeHtml(item.groupId)}" style="padding: 0.35rem 0.75rem; font-size: 0.78rem; font-weight: 800; color: var(--primary-color); border-color: var(--primary-color);">
                      <i data-lucide="eye" style="width: 13px; height: 13px;"></i> عرض التفاصيل
                    </button>
                  ` : `
                    <button type="button" class="btn btn-primary btn-admin-rec-grp" data-grp-id="${escapeHtml(item.groupId)}" style="padding: 0.35rem 0.75rem; font-size: 0.78rem; font-weight: 800;">
                      <i data-lucide="edit-3" style="width: 13px; height: 13px;"></i> تسجيل الحصة
                    </button>
                  `}
                </div>
              </div>
            `;
          }

          // Individual Student Card
          return `
            <div class="session-item-card">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;">
                <div>
                  <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--text-primary); margin: 0;">${escapeHtml(item.name)}</h4>
                  <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem; display: flex; align-items: center; gap: 0.35rem;">
                    <i data-lucide="clock" style="width: 14px; height: 14px; color: var(--text-muted);"></i>
                    <span>موعد الحصة: <strong>${item.time}</strong></span>
                  </div>
                </div>
                <span class="badge" style="position: static; font-weight: 800; font-size: 0.75rem; padding: 0.3rem 0.65rem; border-radius: 6px; ${item.badgeBg}">
                  ${item.statusLabel}
                </span>
              </div>

              <div style="padding-top: 0.5rem; border-top: 1px dashed var(--border-color); display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text-primary);">
                <i data-lucide="user-check" style="width: 16px; height: 16px; color: var(--primary-color);"></i>
                <span>المعلم التابع: <strong style="color: var(--primary-color); font-weight: 800;">${escapeHtml(item.teacherName)}</strong></span>
              </div>
            </div>
          `;
        }).join('');

        if (window.lucide) window.lucide.createIcons();

        // Attach event handlers for Admin group action buttons
        grid.querySelectorAll('.btn-admin-rec-grp').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const grpId = e.currentTarget.dataset.grpId;
            const grpObj = groupsCached.find(g => g.id === grpId);
            if (grpObj) {
              openRecordGroupSessionModal(grpObj, grpObj.teacherName || 'المعلم', () => renderAdminTodayList());
            }
          });
        });

        grid.querySelectorAll('.btn-admin-view-grp').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const grpId = e.currentTarget.dataset.grpId;
            const gsDoc = groupSessionsCached.find(gs => gs.groupId === grpId && localDate(gs.date) === todayStr);
            if (gsDoc) {
              openGroupSessionDetailsModal(gsDoc);
            }
          });
        });
      }
    });
  </script>
</body>
</html>
