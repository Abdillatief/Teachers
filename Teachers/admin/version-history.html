<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - أرشيف التعديلات والتدقيق</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="/assets/vendor/lucide.min.js"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>

</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0;">أرشيف التعديلات والنشاط الرقابي</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">سجل شامل لتدقيق عمليات النظام وسجل حركة الأموال وتعديلات أجور الساعات المحدثة.</p>
          </div>
          <button class="btn btn-secondary" id="clearOldLogsBtn" style="color: var(--danger);"><i data-lucide="trash-2"></i> تصفية الأرشيف القديم</button>
        </div>

        <div class="card">
          <div class="table-container" style="margin-top: 0;">
            <table>
              <thead>
                <tr>
                  <th>تاريخ الإجراء</th>
                  <th>المستخدم المسؤول</th>
                  <th>نوع العملية</th>
                  <th>البيانات السابقة</th>
                  <th>البيانات اللاحقة والمستهدفة</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">جاري مزامنة وتحميل سجل التدقيق الأمني...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';
    import { showCustomConfirm, safeStringify } from '../assets/js/shared/utils/helpers.js';

    protectRoute('admin');

    auth.onAuthStateChanged((user) => {
      if (user) {
        renderSidebar('version-history', 'admin');
        renderNavbar('أرشيف التدقيق والعمليات', { name: 'الإدارة العامة', roleName: 'مدير الأكاديمية' });
        initAuditRealtime();
      }
    });

    function safeStr(obj) {
      if (!obj) return 'لا يوجد';
      return safeStringify(obj);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Accepts Firestore Timestamp, ISO string, epoch number or {seconds} object.
    function toMillis(value) {
      if (!value) return null;
      if (typeof value.toDate === 'function') {
        const d = value.toDate();
        return d instanceof Date && !Number.isNaN(d.getTime()) ? d.getTime() : null;
      }
      if (typeof value === 'number') {
        const ms = value > 1e12 ? value : value * 1000;
        return Number.isFinite(ms) ? ms : null;
      }
      if (typeof value === 'string') {
        const ms = Date.parse(value);
        return Number.isFinite(ms) ? ms : null;
      }
      if (typeof value.seconds === 'number') {
        const ms = value.seconds * 1000 + Math.floor((value.nanoseconds || 0) / 1e6);
        return Number.isFinite(ms) ? ms : null;
      }
      return null;
    }

    // Single local formatter: Arabic date/time, or "—" for missing/invalid dates.
    function formatDateSafe(value) {
      const ms = toMillis(value);
      return ms === null ? '—' : new Date(ms).toLocaleString('ar-EG');
    }

    function initAuditRealtime() {
      const tbody = document.getElementById('auditTableBody');
      if (!tbody) return;

      onSnapshot(collection(db, "auditLogs"), (snapshot) => {
        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">لا توجد سجلات تعديل أو نشاط أمني مسجل حالياً.</td></tr>`;
          return;
        }

        const logs = [];
        snapshot.forEach(docSnap => {
          logs.push({ id: docSnap.id, ...docSnap.data() });
        });

        // ترتيب من الأحدث للأقدم تنازليًا (يتوافق مع كل أشكال الطابع الزمني)
        logs.sort((a, b) => (toMillis(b.timestamp) ?? 0) - (toMillis(a.timestamp) ?? 0));

        tbody.innerHTML = logs.map(log => {
          const dateStr = escapeHtml(formatDateSafe(log.timestamp));
          const actorName = escapeHtml(log.userName || log.actorName || 'النظام');
          const actorId = escapeHtml(log.userId || log.actorId || '-');
          const actionType = escapeHtml(log.actionType || log.action || '—');
          const before = escapeHtml(safeStr(log.dataBefore || log.details));
          const after = escapeHtml(safeStr(log.dataAfter || log.details));
          return `
            <tr>
              <td><strong>${dateStr}</strong></td>
              <td>${actorName}<div style="font-size: 0.75rem; color: var(--text-muted);">UID: ${actorId}</div></td>
              <td><span class="badge" style="position: static; font-weight: 700; background-color: var(--primary-light); color: var(--primary-color);">${actionType}</span></td>
              <td style="font-family: monospace; font-size: 0.75rem; max-width: 200px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; direction: ltr;" title='${before}'>${before}</td>
              <td style="font-family: monospace; font-size: 0.75rem; max-width: 250px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; direction: ltr;" title='${after}'>${after}</td>
            </tr>
          `;
        }).join('');

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, (err) => console.warn("Audit logs listener warning:", err));
    }

    // تصفية السجلات الأقدم من 90 يوماً فقط من المستندات المخزنة بـ auditLogs
    const OLD_LOG_DAYS = 90;
    document.getElementById('clearOldLogsBtn').addEventListener('click', async () => {
      showCustomConfirm(`🚨 تحذير: هل أنت متأكد تماماً من تصفية أرشيف التدقيق الأمني؟ سيتم إتلاف السجلات الأقدم من ${OLD_LOG_DAYS} يوماً فقط نهائياً من الخادم!`, async () => {
        try {
          const cutoff = Date.now() - OLD_LOG_DAYS * 24 * 60 * 60 * 1000;
          const querySnapshot = await getDocs(collection(db, "auditLogs"));
          const staleRefs = [];
          querySnapshot.forEach((docSnap) => {
            const ms = toMillis(docSnap.data()?.timestamp);
            if (ms !== null && ms < cutoff) {
              staleRefs.push(doc(db, "auditLogs", docSnap.id));
            }
          });
          if (!staleRefs.length) {
            Toast.info(`لا توجد سجلات أقدم من ${OLD_LOG_DAYS} يوماً لتصفيتها.`);
            return;
          }
          await Promise.all(staleRefs.map(ref => deleteDoc(ref)));
          Toast.success(`تم تصفية ${staleRefs.length} من السجلات الأقدم من ${OLD_LOG_DAYS} يوماً بنجاح.`);
        } catch (err) {
          console.error(err);
          Toast.danger("فشل تصفية أرشيف التعديلات.");
        }
      });
    });
  </script>
</body>
</html>
