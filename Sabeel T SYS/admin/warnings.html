<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - مركز التحذيرات الإدارية</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>

  <style>
    .warnings-table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .warning-row {
      transition: background-color 0.15s ease;
    }
    .warning-row:hover {
      background-color: var(--bg-primary);
    }
    .tab-btn-pill {
      padding: 0.55rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
    }
    .tab-btn-pill.active {
      background: var(--bg-card);
      color: var(--primary-color);
      border-color: var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .stat-metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header -->
        <div style="margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="alert-triangle" style="color: #d97706; width: 26px; height: 26px;"></i>
              مركز التحذيرات
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
              متابعة وتدقيق التحذيرات التشغيلية وتكرار تسجيل الحصص في النظام.
            </p>
          </div>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <button id="btnRefreshWarnings" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.45rem 0.95rem;">
              <i data-lucide="refresh-cw" style="width: 15px; height: 15px;"></i>
              تحديث
            </button>
          </div>
        </div>

        <!-- Metrics Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="stat-metric-card" style="border-right: 4px solid #d97706;">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
              <span>تحذيرات بانتظار المراجعة</span>
              <i data-lucide="bell" style="width: 16px; height: 16px; color: #d97706;"></i>
            </div>
            <h3 id="statUnreviewedCount" style="font-size: 1.6rem; font-weight: 800; margin: 0; color: #d97706;">0</h3>
          </div>

          <div class="stat-metric-card" style="border-right: 4px solid var(--success);">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
              <span>تحذيرات تمت مراجعتها</span>
              <i data-lucide="check-check" style="width: 16px; height: 16px; color: var(--success);"></i>
            </div>
            <h3 id="statReviewedCount" style="font-size: 1.6rem; font-weight: 800; margin: 0; color: var(--success);">0</h3>
          </div>

          <div class="stat-metric-card" style="border-right: 4px solid var(--primary-color);">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
              <span>إجمالي التحذيرات المسجلة</span>
              <i data-lucide="shield-alert" style="width: 16px; height: 16px; color: var(--primary-color);"></i>
            </div>
            <h3 id="statTotalCount" style="font-size: 1.6rem; font-weight: 800; margin: 0; color: var(--text-primary);">0</h3>
          </div>
        </div>

        <!-- Filters & Tabs -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 0.85rem 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <!-- Tabs -->
            <div style="display: flex; gap: 0.5rem; background: var(--bg-primary); padding: 0.25rem; border-radius: 10px; border: 1px solid var(--border-color);">
              <button class="tab-btn-pill active" id="tabActiveBtn" data-tab="unreviewed">
                <i data-lucide="alert-circle" style="width: 15px; height: 15px;"></i>
                بانتظار المراجعة
                <span id="tabUnreviewedBadge" class="badge" style="background: rgba(217, 119, 6, 0.15); color: #d97706; padding: 1px 7px; font-size: 0.7rem; border-radius: 10px;">0</span>
              </button>
              <button class="tab-btn-pill" id="tabArchivedBtn" data-tab="reviewed">
                <i data-lucide="archive" style="width: 15px; height: 15px;"></i>
                سجل المراجعة والأرشيف
              </button>
            </div>

            <!-- Search & Type Filter -->
            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
              <div style="position: relative; min-width: 220px;">
                <input type="text" id="warningsSearchInput" class="form-control" placeholder="بحث باسم المعلم أو الطالب..." style="font-size: 0.82rem; padding-right: 2rem;">
                <i data-lucide="search" style="position: absolute; right: 0.65rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted);"></i>
              </div>

              <select id="warningTypeFilter" class="form-control" style="font-size: 0.82rem; width: auto; font-weight: 600;">
                <option value="all">كل أنواع التحذيرات</option>
                <option value="duplicate_session">تكرار تسجيل الحصص</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Table Container -->
        <div class="warnings-table-card">
          <div style="overflow-x: auto;">
            <table class="table" style="margin: 0; width: 100%; text-align: right;">
              <thead>
                <tr style="background: var(--bg-primary); border-bottom: 1px solid var(--border-color);">
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">نوع التحذير</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">المعلم</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">الطالب</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">التاريخ</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">وقت التسجيل الأول</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">وقت التسجيل الثاني</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">الحالة</th>
                  <th style="padding: 0.85rem 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-align: left;">الإجراء</th>
                </tr>
              </thead>
              <tbody id="warningsTableBody">
                <tr>
                  <td colspan="8" style="padding: 2.5rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                    جاري تحميل التحذيرات...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { 
      collection, 
      onSnapshot, 
      doc, 
      updateDoc, 
      serverTimestamp, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('admin');

    renderSidebar('warnings', 'admin');
    renderNavbar('مركز التحذيرات', { name: 'إدارة النظام' });

    let allWarnings = [];
    let currentTab = 'unreviewed'; // 'unreviewed' | 'reviewed'

    const tableBody = document.getElementById('warningsTableBody');
    const statUnreviewed = document.getElementById('statUnreviewedCount');
    const statReviewed = document.getElementById('statReviewedCount');
    const statTotal = document.getElementById('statTotalCount');
    const tabUnreviewedBadge = document.getElementById('tabUnreviewedBadge');
    const searchInput = document.getElementById('warningsSearchInput');
    const typeFilter = document.getElementById('warningTypeFilter');
    const tabActiveBtn = document.getElementById('tabActiveBtn');
    const tabArchivedBtn = document.getElementById('tabArchivedBtn');

    // Subscribe to warnings in real-time
    const q = query(collection(db, 'warnings'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snapshot) => {
      allWarnings = [];
      snapshot.forEach(docSnap => {
        allWarnings.push({ id: docSnap.id, ...docSnap.data() });
      });
      updateStats();
      renderWarnings();
    }, (err) => {
      console.error('Error fetching warnings:', err);
      tableBody.innerHTML = `
        <tr>
          <td colspan="8" style="padding: 2rem; text-align: center; color: var(--danger); font-size: 0.88rem;">
            تعذر تحميل التحذيرات من قاعدة البيانات.
          </td>
        </tr>
      `;
    });

    function updateStats() {
      const unreviewed = allWarnings.filter(w => w.status !== 'reviewed').length;
      const reviewed = allWarnings.filter(w => w.status === 'reviewed').length;
      statUnreviewed.textContent = unreviewed;
      statReviewed.textContent = reviewed;
      statTotal.textContent = allWarnings.length;
      tabUnreviewedBadge.textContent = unreviewed;
    }

    function renderWarnings() {
      const searchTerm = (searchInput.value || '').trim().toLowerCase();
      const selectedType = typeFilter.value;

      const filtered = allWarnings.filter(w => {
        // Tab condition
        const isReviewed = w.status === 'reviewed';
        if (currentTab === 'unreviewed' && isReviewed) return false;
        if (currentTab === 'reviewed' && !isReviewed) return false;

        // Type filter
        if (selectedType !== 'all' && w.type !== selectedType) return false;

        // Search condition
        if (searchTerm) {
          const tName = (w.teacherName || '').toLowerCase();
          const sName = (w.studentName || '').toLowerCase();
          if (!tName.includes(searchTerm) && !sName.includes(searchTerm)) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" style="padding: 3rem 1rem; text-align: center;">
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--text-muted);">
                <i data-lucide="check-circle-2" style="width: 32px; height: 32px; color: var(--success); opacity: 0.7;"></i>
                <span style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);">لا توجد تحذيرات في هذا القسم</span>
                <span style="font-size: 0.8rem;">جميع العمليات المسجلة تمت مراجعتها أو لا توجد تنبيهات نشطة.</span>
              </div>
            </td>
          </tr>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      tableBody.innerHTML = filtered.map(w => {
        const isReviewed = w.status === 'reviewed';
        const typeLabel = w.type === 'duplicate_session' ? 'تكرار تسجيل الحصة' : (w.type || 'تحذير نظام');

        const statusBadge = isReviewed
          ? `<span class="badge" style="background: rgba(16, 185, 129, 0.12); color: #059669; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 6px;">تمت المراجعة</span>`
          : `<span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #d97706; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 6px;">بانتظار المراجعة</span>`;

        const actionBtn = !isReviewed
          ? `<button class="btn btn-secondary btn-mark-reviewed" data-id="${w.id}" style="font-size: 0.78rem; padding: 0.35rem 0.85rem; font-weight: 700; border-color: var(--success); color: var(--success); gap: 0.35rem; display: inline-flex; align-items: center;">
              <i data-lucide="check" style="width: 14px; height: 14px;"></i>
              تمت المراجعة
            </button>`
          : `<span style="font-size: 0.75rem; color: var(--text-muted);">تم التدقيق</span>`;

        return `
          <tr class="warning-row" style="border-bottom: 1px solid var(--border-color);">
            <td style="padding: 0.85rem 1rem; font-size: 0.82rem; font-weight: 700; color: #b45309;">
              <span style="display: inline-flex; align-items: center; gap: 0.35rem;">
                <i data-lucide="copy" style="width: 14px; height: 14px; color: #d97706;"></i>
                ${typeLabel}
              </span>
            </td>
            <td style="padding: 0.85rem 1rem; font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">
              ${w.teacherName || 'غير محدد'}
            </td>
            <td style="padding: 0.85rem 1rem; font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">
              ${w.studentName || 'غير محدد'}
            </td>
            <td style="padding: 0.85rem 1rem; font-size: 0.82rem; color: var(--text-secondary); direction: ltr; text-align: right;">
              ${w.date || 'اليوم'}
            </td>
            <td style="padding: 0.85rem 1rem; font-size: 0.82rem; color: var(--text-secondary);">
              ${w.firstRecordedAt || 'غير متوفر'}
            </td>
            <td style="padding: 0.85rem 1rem; font-size: 0.82rem; font-weight: 700; color: #d97706;">
              ${w.secondRecordedAt || 'غير متوفر'}
            </td>
            <td style="padding: 0.85rem 1rem;">
              ${statusBadge}
            </td>
            <td style="padding: 0.85rem 1rem; text-align: left;">
              ${actionBtn}
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      // Attach click events for mark reviewed
      tableBody.querySelectorAll('.btn-mark-reviewed').forEach(btn => {
        btn.addEventListener('click', async () => {
          const warnId = btn.dataset.id;
          btn.disabled = true;
          try {
            const currentAdmin = auth.currentUser;
            await updateDoc(doc(db, 'warnings', warnId), {
              status: 'reviewed',
              reviewedAt: serverTimestamp(),
              reviewedBy: currentAdmin?.email || 'admin'
            });
            Toast.success('تم تحديد التحذير كمُراجَع ونقله إلى الأرشيف.');
          } catch (err) {
            console.error('Error reviewing warning:', err);
            Toast.danger('تعذر تحديث حالة التحذير.');
            btn.disabled = false;
          }
        });
      });
    }

    // Tab switching
    tabActiveBtn.addEventListener('click', () => {
      currentTab = 'unreviewed';
      tabActiveBtn.classList.add('active');
      tabArchivedBtn.classList.remove('active');
      renderWarnings();
    });

    tabArchivedBtn.addEventListener('click', () => {
      currentTab = 'reviewed';
      tabArchivedBtn.classList.add('active');
      tabActiveBtn.classList.remove('active');
      renderWarnings();
    });

    searchInput.addEventListener('input', renderWarnings);
    typeFilter.addEventListener('change', renderWarnings);

    document.getElementById('btnRefreshWarnings').addEventListener('click', () => {
      updateStats();
      renderWarnings();
      Toast.info('تم تحديث قائمة التحذيرات.');
    });
  </script>
</body>
</html>
