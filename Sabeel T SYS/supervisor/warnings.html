<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة التحذيرات والأخطاء</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>

  <style>
    .warnings-table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .warning-row {
      transition: background-color 0.15s ease;
    }
    .warning-row:hover {
      background-color: var(--bg-primary);
    }
    .tab-btn-pill {
      border: none;
      background: transparent;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .tab-btn-pill.active {
      background: var(--primary-color);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="content-body">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="shield-alert" style="color: #dc2626; width: 26px; height: 26px;"></i>
              سجل التحذيرات التشغيلية
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">متابعة فورية للحصص المكررة وتجاوزات التسجيل من المعلمين</p>
          </div>
          <button id="btnRefreshWarnings" class="btn btn-secondary btn-sm" style="display: flex; align-items: center; gap: 0.4rem;">
            <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i>
            <span>تحديث البيانات</span>
          </button>
        </div>

        <!-- Metrics Cards -->
        <div id="statsCardsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="card" style="border-right: 4px solid #d97706;">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
              <span>تحذيرات بانتظار المراجعة</span>
              <i data-lucide="bell" style="width: 16px; height: 16px; color: #d97706;"></i>
            </div>
            <h3 id="statUnreviewedCount" style="font-size: 1.6rem; font-weight: 800; margin: 0.35rem 0 0 0; color: #d97706;">0</h3>
          </div>

          <div class="card" style="border-right: 4px solid var(--success);">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
              <span>تحذيرات تمت مراجعتها</span>
              <i data-lucide="check-check" style="width: 16px; height: 16px; color: var(--success);"></i>
            </div>
            <h3 id="statReviewedCount" style="font-size: 1.6rem; font-weight: 800; margin: 0.35rem 0 0 0; color: var(--success);">0</h3>
          </div>

          <div class="card" style="border-right: 4px solid var(--primary-color);">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
              <span>إجمالي التحذيرات المسجلة</span>
              <i data-lucide="shield-alert" style="width: 16px; height: 16px; color: var(--primary-color);"></i>
            </div>
            <h3 id="statTotalCount" style="font-size: 1.6rem; font-weight: 800; margin: 0.35rem 0 0 0; color: var(--text-primary);">0</h3>
          </div>
        </div>

        <!-- Filters & Tabs -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 0.85rem 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; gap: 0.5rem; background: var(--bg-primary); padding: 0.25rem; border-radius: 10px; border: 1px solid var(--border-color);">
              <button class="tab-btn-pill active" id="tabActiveBtn" data-tab="unreviewed">
                <i data-lucide="alert-circle" style="width: 15px; height: 15px;"></i>
                بانتظار المراجعة
                <span id="tabUnreviewedBadge" class="badge" style="background: rgba(217, 119, 6, 0.15); color: #d97706; padding: 1px 7px; font-size: 0.7rem; border-radius: 10px;">0</span>
              </button>
              <button class="tab-btn-pill" id="tabArchivedBtn" data-tab="reviewed">
                <i data-lucide="archive" style="width: 15px; height: 15px;"></i>
                سجل المراجعة والأرشيف
              </button>
            </div>

            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
              <div style="position: relative; min-width: 220px;">
                <input type="text" id="warningsSearchInput" class="form-control" placeholder="بحث باسم المعلم أو الطالب..." style="font-size: 0.82rem; padding-right: 2rem;">
                <i data-lucide="search" style="position: absolute; right: 0.65rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted);"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Table Container -->
        <div class="warnings-table-card">
          <div class="table-container" style="overflow-x: auto;">
            <table class="table" style="width: 100%; min-width: 650px; border-collapse: collapse;">
              <thead>
                <tr style="background: var(--bg-primary); border-bottom: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-secondary);">
                  <th style="padding: 0.85rem 1rem; text-align: right;">النوع والتاريخ</th>
                  <th style="padding: 0.85rem 1rem; text-align: right;">المعلم المعني</th>
                  <th style="padding: 0.85rem 1rem; text-align: right;">الدارس / الحصة</th>
                  <th style="padding: 0.85rem 1rem; text-align: right;">تفاصيل التحذير والسبب</th>
                  <th style="padding: 0.85rem 1rem; text-align: center;">الحالة</th>
                </tr>
              </thead>
              <tbody id="warningsTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.85rem;">
                    جارٍ تحميل سجل التحذيرات...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderBottomNav } from '../assets/js/shared/components/bottomNav.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    let allWarnings = [];
    let currentTab = 'unreviewed';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container', 'متابعة التحذيرات والأخطاء', 'supervisor');
      renderSidebar('sidebar-container', 'warnings', 'supervisor');
      renderBottomNav('supervisor');
      if (window.lucide) window.lucide.createIcons();

      initWarningsListener();
      setupTabs();
      setupSearch();
    });

    function initWarningsListener() {
      try {
        const q = query(collection(db, 'system_warnings'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snapshot) => {
          allWarnings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          updateCounts();
          renderWarningsTable();
        }, (err) => {
          console.error("Error loading warnings:", err);
          document.getElementById('warningsTableBody').innerHTML = `
            <tr>
              <td colspan="5" style="text-align: center; padding: 2rem; color: var(--danger); font-size: 0.85rem;">
                حدث خطأ أثناء تحميل سجل التحذيرات.
              </td>
            </tr>
          `;
        });
      } catch (e) {
        console.error("Firebase query error:", e);
      }
    }

    function updateCounts() {
      const unreviewed = allWarnings.filter(w => !w.reviewed).length;
      const reviewed = allWarnings.filter(w => w.reviewed).length;
      document.getElementById('statUnreviewedCount').textContent = unreviewed;
      document.getElementById('statReviewedCount').textContent = reviewed;
      document.getElementById('statTotalCount').textContent = allWarnings.length;
      document.getElementById('tabUnreviewedBadge').textContent = unreviewed;
    }

    function renderWarningsTable() {
      const tbody = document.getElementById('warningsTableBody');
      const searchVal = (document.getElementById('warningsSearchInput')?.value || '').trim().toLowerCase();

      let filtered = allWarnings.filter(w => {
        if (currentTab === 'unreviewed') return !w.reviewed;
        return w.reviewed;
      });

      if (searchVal) {
        filtered = filtered.filter(w => 
          (w.teacherName && w.teacherName.toLowerCase().includes(searchVal)) ||
          (w.studentName && w.studentName.toLowerCase().includes(searchVal)) ||
          (w.reason && w.reason.toLowerCase().includes(searchVal))
        );
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.85rem;">
              <i data-lucide="check-circle" style="width: 32px; height: 32px; color: var(--success); margin: 0 auto 0.5rem auto; display: block;"></i>
              لا توجد تحذيرات في هذا القسم حالياً
            </td>
          </tr>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      tbody.innerHTML = filtered.map(w => {
        const dateStr = w.date || (w.createdAt ? new Date(w.createdAt).toLocaleDateString('ar-EG') : '-');
        const typeBadge = w.type === 'duplicate_session'
          ? '<span class="badge" style="background: rgba(239, 68, 68, 0.12); color: #dc2626; font-weight: 700;">تكرار تسجيل حصة</span>'
          : '<span class="badge" style="background: rgba(245, 158, 11, 0.12); color: #d97706; font-weight: 700;">تحذير نظام</span>';

        return `
          <tr class="warning-row" style="border-bottom: 1px solid var(--border-color); font-size: 0.82rem;">
            <td style="padding: 0.85rem 1rem;">
              <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 0.2rem;">${typeBadge}</div>
              <div style="font-size: 0.72rem; color: var(--text-muted); direction: ltr; text-align: right;">${dateStr}</div>
            </td>
            <td style="padding: 0.85rem 1rem;">
              <div style="font-weight: 700; color: var(--text-primary);">${w.teacherName || '-'}</div>
            </td>
            <td style="padding: 0.85rem 1rem;">
              <div style="font-weight: 600; color: var(--text-primary);">${w.studentName || '-'}</div>
              <div style="font-size: 0.72rem; color: var(--text-muted);">${w.sessionTime ? 'الموعد: ' + w.sessionTime : ''}</div>
            </td>
            <td style="padding: 0.85rem 1rem; max-width: 300px;">
              <div style="color: var(--text-primary); font-size: 0.8rem; line-height: 1.4;">${w.reason || 'قام المعلم بمحاولة تسجيل نفس الحصة مرتين في نفس اليوم وتم توثيق العملية.'}</div>
            </td>
            <td style="padding: 0.85rem 1rem; text-align: center;">
              ${w.reviewed 
                ? '<span class="badge" style="background: rgba(16, 185, 129, 0.12); color: #059669; font-weight: 700;">تمت المراجعة</span>'
                : '<span class="badge" style="background: rgba(217, 119, 6, 0.12); color: #d97706; font-weight: 700;">بانتظار المراجعة</span>'
              }
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    function setupTabs() {
      document.getElementById('tabActiveBtn')?.addEventListener('click', (e) => {
        currentTab = 'unreviewed';
        document.querySelectorAll('.tab-btn-pill').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        renderWarningsTable();
      });

      document.getElementById('tabArchivedBtn')?.addEventListener('click', (e) => {
        currentTab = 'reviewed';
        document.querySelectorAll('.tab-btn-pill').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        renderWarningsTable();
      });
    }

    function setupSearch() {
      document.getElementById('warningsSearchInput')?.addEventListener('input', renderWarningsTable);
      document.getElementById('btnRefreshWarnings')?.addEventListener('click', () => {
        initWarningsListener();
        Toast.success("تم تحديث سجل التحذيرات بنجاح");
      });
    }
  </script>
</body>
</html>
