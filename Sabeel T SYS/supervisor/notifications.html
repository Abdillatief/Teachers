<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - إشعارات المشرف</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="content-body">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="bell" style="color: var(--primary-color); width: 24px; height: 24px;"></i>
              مركز الإشعارات والتنبيهات
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">سجل الإشعارات الإدارية والتنبيهات التشغيلية الواردة</p>
          </div>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
          <div id="supervisorNotifsList" style="display: flex; flex-direction: column; gap: 0.75rem;">
            <div style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.85rem;">
              <i data-lucide="inbox" style="width: 32px; height: 32px; color: var(--text-muted); margin: 0 auto 0.5rem auto; display: block;"></i>
              لا توجد إشعارات جديدة حالياً
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderBottomNav } from '../assets/js/shared/components/bottomNav.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container', 'الإشعارات', 'supervisor');
      renderSidebar('sidebar-container', 'notifications', 'supervisor');
      renderBottomNav('supervisor');
      if (window.lucide) window.lucide.createIcons();

      try {
        const q = query(collection(db, 'notifications'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snap) => {
          const list = document.getElementById('supervisorNotifsList');
          if (snap.empty) {
            list.innerHTML = `
              <div style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.85rem;">
                <i data-lucide="inbox" style="width: 32px; height: 32px; color: var(--text-muted); margin: 0 auto 0.5rem auto; display: block;"></i>
                لا توجد إشعارات جديدة حالياً
              </div>
            `;
            if (window.lucide) window.lucide.createIcons();
            return;
          }
          list.innerHTML = snap.docs.slice(0, 30).map(d => {
            const data = d.data();
            const date = data.createdAt ? new Date(data.createdAt).toLocaleDateString('ar-EG') : '';
            return `
              <div style="padding: 0.85rem 1rem; background: var(--bg-primary); border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem;">
                <div>
                  <div style="font-weight: 700; color: var(--text-primary); font-size: 0.9rem; margin-bottom: 0.2rem;">${data.title || 'إشعار إداري'}</div>
                  <div style="font-size: 0.82rem; color: var(--text-secondary); line-height: 1.4;">${data.body || data.message || ''}</div>
                </div>
                <span style="font-size: 0.72rem; color: var(--text-muted); white-space: nowrap;">${date}</span>
              </div>
            `;
          }).join('');
          if (window.lucide) window.lucide.createIcons();
        });
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
