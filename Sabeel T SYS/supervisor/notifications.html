<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - الإشعارات التشغيلية</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>

  <style>
    .notif-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transition: all 0.2s ease;
    }
    .notif-card:hover {
      border-color: var(--primary-color);
    }
    .notif-card.unread {
      background: rgba(2, 132, 199, 0.04);
      border-right: 4px solid var(--primary-color);
    }
    .notif-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header -->
        <div style="margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem;">
              <span class="badge" style="background: rgba(2, 132, 199, 0.12); color: #0284c7; font-weight: 700; padding: 2px 9px; border-radius: 6px; font-size: 0.76rem;">
                التنبيهات والمستجدات
              </span>
            </div>
            <h1 style="font-size: 1.55rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="bell" style="color: var(--primary-color); width: 26px; height: 26px;"></i>
              مركز الإشعارات التشغيلية 🔔
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin: 0.35rem 0 0 0;">
              متابعة قرارات المدير حول طلباتك، التحديثات الأكاديمية، والتحذيرات اللحظية.
            </p>
          </div>

          <div style="display: flex; gap: 0.5rem;">
            <button id="btnMarkAllRead" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.55rem 1.15rem; gap: 0.4rem;">
              <i data-lucide="check-check" style="width: 16px; height: 16px;"></i>
              تحديد الكل كمقروء
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card" style="padding: 0.85rem 1.25rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-primary notif-filter-btn" data-filter="all" style="font-size: 0.8rem; padding: 0.35rem 0.85rem;">الكل</button>
            <button class="btn btn-secondary notif-filter-btn" data-filter="unread" style="font-size: 0.8rem; padding: 0.35rem 0.85rem;">غير المقروءة فقط</button>
            <button class="btn btn-secondary notif-filter-btn" data-filter="requests" style="font-size: 0.8rem; padding: 0.35rem 0.85rem;">ردود قرارات المدير</button>
          </div>
          <div style="font-size: 0.82rem; color: var(--text-muted);" id="unreadCounterText">
            0 إشعارات غير مقروءة
          </div>
        </div>

        <!-- Notifications Container -->
        <div id="notificationsContainer">
          <div class="card" style="padding: 3rem 1rem; text-align: center;">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--text-muted);">
              <i data-lucide="loader" class="spin" style="width: 28px; height: 28px; color: var(--primary-color);"></i>
              <span>جارٍ تحميل الإشعارات...</span>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { 
      collection, 
      onSnapshot, 
      query, 
      orderBy,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('supervisor');
    renderSidebar('notifications', 'supervisor');
    renderNavbar('الإشعارات التشغيلية', { name: 'المشرف التشغيلي' });

    let notifications = [];
    let currentFilter = 'all';
    let currentUser = null;

    const container = document.getElementById('notificationsContainer');
    const unreadCounterText = document.getElementById('unreadCounterText');
    const filterButtons = document.querySelectorAll('.notif-filter-btn');

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.classList.remove('btn-primary');
          b.classList.add('btn-secondary');
        });
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-primary');
        currentFilter = btn.dataset.filter;
        renderNotifications();
      });
    });

    auth.onAuthStateChanged((user) => {
      if (!user) return;
      currentUser = user;

      const q = query(collection(db, "notifications"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snap) => {
        notifications = [];
        snap.forEach(d => {
          const n = { id: d.id, ...d.data() };
          // Filter notifications for this supervisor or targetRole supervisor/all
          if (!n.userId || n.userId === user.uid || n.targetRole === 'supervisor' || n.targetRole === 'all') {
            notifications.push(n);
          }
        });
        renderNotifications();
      }, (err) => {
        console.warn("Notifications fallback:", err);
        onSnapshot(collection(db, "notifications"), (snap) => {
          notifications = [];
          snap.forEach(d => {
            const n = { id: d.id, ...d.data() };
            if (!n.userId || n.userId === user.uid || n.targetRole === 'supervisor' || n.targetRole === 'all') {
              notifications.push(n);
            }
          });
          notifications.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
          renderNotifications();
        });
      });
    });

    function renderNotifications() {
      if (!container) return;

      const filtered = notifications.filter(n => {
        if (currentFilter === 'unread' && n.isRead) return false;
        if (currentFilter === 'requests' && !n.type?.includes('request')) return false;
        return true;
      });

      const unreadCount = notifications.filter(n => !n.isRead).length;
      if (unreadCounterText) unreadCounterText.textContent = `${unreadCount} إشعار غير مقروء`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="card" style="padding: 3.5rem 1rem; text-align: center;">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--text-muted);">
              <i data-lucide="bell-off" style="width: 36px; height: 36px; opacity: 0.6;"></i>
              <strong style="font-size: 1rem; color: var(--text-primary);">لا توجد إشعارات حالياً</strong>
              <span style="font-size: 0.8rem;">ستظهر هنا أي تنبيهات تشغيلية أو ردود من المدير حول طلباتك.</span>
            </div>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons({ root: container });
        return;
      }

      container.innerHTML = filtered.map(n => {
        const isUnread = !n.isRead;
        const isRequestResponse = n.type?.includes('request');

        let iconBg = 'rgba(2, 132, 199, 0.12)';
        let iconColor = '#0284c7';
        let iconName = 'bell';

        if (isRequestResponse) {
          if (n.message?.includes('تمت الموافقة') || n.title?.includes('موافقة')) {
            iconBg = 'rgba(16, 185, 129, 0.12)';
            iconColor = '#10b981';
            iconName = 'check-circle';
          } else {
            iconBg = 'rgba(239, 68, 68, 0.12)';
            iconColor = '#ef4444';
            iconName = 'x-circle';
          }
        }

        let timeFormatted = '--';
        if (n.createdAt) {
          try {
            const d = new Date(n.createdAt);
            timeFormatted = `${d.toLocaleDateString('ar-EG')} - ${d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
          } catch(e) {
            timeFormatted = n.createdAt;
          }
        }

        return `
          <div class="notif-card ${isUnread ? 'unread' : ''}">
            <div class="notif-icon-circle" style="background: ${iconBg}; color: ${iconColor};">
              <i data-lucide="${iconName}" style="width: 20px; height: 20px;"></i>
            </div>

            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                <h4 style="margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--text-primary);">
                  ${n.title || 'إشعار تشغيلي'}
                </h4>
                <span style="font-size: 0.72rem; color: var(--text-muted);">${timeFormatted}</span>
              </div>

              <p style="margin: 0 0 0.5rem 0; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5;">
                ${n.message || ''}
              </p>

              <div style="display: flex; gap: 0.5rem; align-items: center;">
                ${n.link ? `
                  <a href="${n.link}" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.25rem 0.65rem; color: var(--primary-color);">
                    عرض التفاصيل
                  </a>
                ` : ''}

                ${isUnread ? `
                  <button class="btn btn-secondary btn-mark-read" data-id="${n.id}" style="font-size: 0.75rem; padding: 0.25rem 0.65rem;">
                    تحديد كمقروء
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons({ root: container });

      container.querySelectorAll('.btn-mark-read').forEach(btn => {
        btn.addEventListener('click', async () => {
          const notifId = btn.dataset.id;
          btn.disabled = true;
          try {
            await updateDoc(doc(db, "notifications", notifId), { isRead: true });
          } catch (e) {
            console.error("Error marking read:", e);
          }
        });
      });
    }

    document.getElementById('btnMarkAllRead').addEventListener('click', async () => {
      const unreadList = notifications.filter(n => !n.isRead);
      if (unreadList.length === 0) {
        Toast.info("جميع الإشعارات مقروءة بالفعل.");
        return;
      }

      for (const n of unreadList) {
        try {
          await updateDoc(doc(db, "notifications", n.id), { isRead: true });
        } catch(e) {}
      }
      Toast.success("تم تحديد جميع الإشعارات كمقروءة.");
    });
  </script>
</body>
</html>
