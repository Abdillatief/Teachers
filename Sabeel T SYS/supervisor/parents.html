<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة أولياء الأمور</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="content-body">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="phone-call" style="color: #059669; width: 24px; height: 24px;"></i>
              سجل التواصل مع أولياء الأمور
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">متابعة شكاوى وملاحظات ومكالمات أولياء أمور الطلاب</p>
          </div>
          <button id="btnOpenNewParentLog" class="btn btn-primary btn-sm" style="display: flex; align-items: center; gap: 0.4rem;">
            <i data-lucide="plus" style="width: 15px; height: 15px;"></i>
            <span>تسجيل تواصل جديد</span>
          </button>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="table-container" style="overflow-x: auto;">
            <table class="table" style="width: 100%; min-width: 600px;">
              <thead>
                <tr style="border-bottom: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-secondary);">
                  <th style="padding: 0.85rem 1rem; text-align: right;">التاريخ</th>
                  <th style="padding: 0.85rem 1rem; text-align: right;">اسم الدارس / ولي الأمر</th>
                  <th style="padding: 0.85rem 1rem; text-align: right;">نوع التواصل والموضوع</th>
                  <th style="padding: 0.85rem 1rem; text-align: right;">ملاحظات ونتيجة المتابعة</th>
                </tr>
              </thead>
              <tbody id="parentLogsList">
                <tr>
                  <td colspan="4" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.85rem;">
                    لا توجد سجلات تواصل مسجلة حالياً.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="parentLogModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 520px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin: 0;">تسجيل تواصل جديد مع ولي أمر</h3>
        <button id="btnCloseParentModal" class="btn btn-secondary btn-sm" style="padding: 0.2rem 0.5rem;">&times;</button>
      </div>

      <form id="parentLogForm">
        <div class="form-group" style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.82rem; font-weight: 700; display: block; margin-bottom: 0.35rem;">اسم الدارس أو ولي الأمر</label>
          <input type="text" id="parentStudentName" class="form-control" placeholder="اسم الدارس..." required>
        </div>

        <div class="form-group" style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.82rem; font-weight: 700; display: block; margin-bottom: 0.35rem;">وسيلة التواصل</label>
          <select id="parentContactChannel" class="form-control">
            <option value="phone">مكالمة هاتفية</option>
            <option value="whatsapp">محادثة واتساب</option>
            <option value="in_person">مقابلة شخصية</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="font-size: 0.82rem; font-weight: 700; display: block; margin-bottom: 0.35rem;">تفاصيل المكالمة والنتيجة</label>
          <textarea id="parentNotes" class="form-control" rows="4" placeholder="ملخص ما تم في المحادثة..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem;">
          <button type="button" id="btnCancelParentModal" class="btn btn-secondary">إلغاء</button>
          <button type="submit" class="btn btn-primary">حفظ في السجل</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderBottomNav } from '../assets/js/shared/components/bottomNav.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container', 'أولياء الأمور', 'supervisor');
      renderSidebar('sidebar-container', 'parents', 'supervisor');
      renderBottomNav('supervisor');
      if (window.lucide) window.lucide.createIcons();

      const modal = document.getElementById('parentLogModal');
      document.getElementById('btnOpenNewParentLog')?.addEventListener('click', () => { modal.style.display = 'flex'; });
      document.getElementById('btnCloseParentModal')?.addEventListener('click', () => { modal.style.display = 'none'; });
      document.getElementById('btnCancelParentModal')?.addEventListener('click', () => { modal.style.display = 'none'; });

      document.getElementById('parentLogForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const studentName = document.getElementById('parentStudentName').value.trim();
        const channel = document.getElementById('parentContactChannel').value;
        const notes = document.getElementById('parentNotes').value.trim();

        try {
          await addDoc(collection(db, 'parent_logs'), {
            studentName,
            channel,
            notes,
            createdAt: new Date().toISOString()
          });
          Toast.success("تم تسجيل التواصل بنجاح");
          modal.style.display = 'none';
          document.getElementById('parentLogForm').reset();
        } catch (err) {
          console.error(err);
          Toast.danger("حدث خطأ أثناء الحفظ");
        }
      });

      const q = query(collection(db, 'parent_logs'), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        const tbody = document.getElementById('parentLogsList');
        if (snap.empty) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:2.5rem 1rem;color:var(--text-muted);font-size:0.85rem;">لا توجد سجلات تواصل مسجلة حالياً.</td></tr>`;
          return;
        }
        tbody.innerHTML = snap.docs.map(doc => {
          const d = doc.data();
          const date = d.createdAt ? new Date(d.createdAt).toLocaleDateString('ar-EG') : '-';
          return `
            <tr style="border-bottom:1px solid var(--border-color);font-size:0.82rem;">
              <td style="padding:0.85rem 1rem;font-weight:600;">${date}</td>
              <td style="padding:0.85rem 1rem;font-weight:700;color:var(--text-primary);">${d.studentName}</td>
              <td style="padding:0.85rem 1rem;">${d.channel === 'whatsapp' ? 'واتساب' : d.channel === 'phone' ? 'هاتف' : 'شخصي'}</td>
              <td style="padding:0.85rem 1rem;">${d.notes}</td>
            </tr>
          `;
        }).join('');
      });
    });
  </script>
</body>
</html>
