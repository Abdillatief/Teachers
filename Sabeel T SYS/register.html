<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>أكاديمية سبيل - تسجيل معلم جديد</title>
  
  <script>
    // Universal Anti-Cyclic JSON Protection (prevents "TypeError: cyclic object value")
    (function() {
      if (typeof window !== 'undefined' && !window.__sabeel_json_shield_active) {
        window.__sabeel_json_shield_active = true;
        const origStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          const seen = new WeakSet();
          const cycleReplacer = function(key, val) {
            if (typeof val === 'object' && val !== null) {
              if (val instanceof Error) {
                return { name: val.name, message: val.message, stack: val.stack };
              }
              if (typeof Node !== 'undefined' && val instanceof Node) {
                return '[DOMNode ' + (val.nodeName || 'Element') + ']';
              }
              if (typeof Window !== 'undefined' && val instanceof Window) {
                return '[Window]';
              }
              if (seen.has(val)) {
                return '[Circular]';
              }
              seen.add(val);
            }
            if (typeof replacer === 'function') {
              return replacer.call(this, key, val);
            }
            return val;
          };
          try {
            return origStringify(value, (typeof replacer === 'function' || !Array.isArray(replacer)) ? cycleReplacer : replacer, space);
          } catch (err) {
            if (err instanceof TypeError || String(err).includes('cyclic') || String(err).includes('circular')) {
              try {
                return origStringify(value, cycleReplacer, space);
              } catch {
                return '"[Circular]"';
              }
            }
            throw err;
          }
        };
      }
    })();

    if (localStorage.getItem('academy_dark_mode') === 'true') {
      document.documentElement.classList.add('dark-theme');
    }
  </script>

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Native Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body class="auth-page-wrapper">

  <main class="auth-app-shell" style="max-width: 440px;">
    
    <!-- App Header Identity -->
    <header class="auth-app-identity" style="margin-bottom: 1.25rem;">
      <div class="auth-app-logo">
        <img src="/icons/icon-192.png" alt="Sabeel Academy Logo" class="academy-logo-img">
      </div>
      <h1 class="auth-app-name">أكاديمية سَبِيل</h1>
      <p class="auth-app-tagline" id="registerSubtitle">بوابة انضمام الكوادر التعليمية والإدارية</p>
    </header>

    <section class="auth-app-card">
      
      <!-- Role Selection Tabs -->
      <div class="role-selector-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem; background: var(--bg-primary, #f1f5f9); padding: 0.25rem; border-radius: 10px; border: 1px solid var(--border-color, #e2e8f0);">
        <button type="button" id="roleTeacherBtn" class="role-tab-btn active" style="flex: 1; padding: 0.6rem 0.5rem; border-radius: 8px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.2s ease; background: var(--primary-color, #0d9488); color: #ffffff;">
          <i data-lucide="graduation-cap" style="width: 16px; height: 16px;"></i>
          <span>انضمام كمعلم</span>
        </button>
        <button type="button" id="roleSupervisorBtn" class="role-tab-btn" style="flex: 1; padding: 0.6rem 0.5rem; border-radius: 8px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.2s ease; background: transparent; color: var(--text-secondary, #64748b);">
          <i data-lucide="shield-check" style="width: 16px; height: 16px;"></i>
          <span>طلب حساب مشرف</span>
        </button>
      </div>

      <div class="auth-card-top-tag" id="cardTopTag">
        <i data-lucide="user-plus" style="width: 13px; height: 13px;"></i>
        <span id="cardTagText">طلب انضمام لهيئة التدريس</span>
      </div>

      <form id="registerForm" novalidate>
        <input type="hidden" id="selectedRole" value="teacher">

        <div class="auth-form-group">
          <label for="name" class="auth-label">الاسم الكامل</label>
          <div class="auth-input-wrapper">
            <i data-lucide="user" class="auth-input-icon"></i>
            <input type="text" id="name" class="auth-input auth-input-with-icon" placeholder="أدخل اسمك الثلاثي أو الرباعي" required autocomplete="name">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="phone" class="auth-label">رقم الهاتف أو الواتساب</label>
          <div class="auth-input-wrapper">
            <i data-lucide="phone" class="auth-input-icon"></i>
            <input type="tel" id="phone" class="auth-input auth-input-with-icon" placeholder="05xxxxxxxx" required style="direction: ltr; text-align: left;" autocomplete="tel">
          </div>
        </div>

        <!-- Supervisor-specific Department / Field Selection -->
        <div class="auth-form-group" id="supervisorDeptGroup" style="display: none;">
          <label for="supervisorDept" class="auth-label">تخصص أو قسم الإشراف المطلوب</label>
          <div class="auth-input-wrapper">
            <i data-lucide="briefcase" class="auth-input-icon"></i>
            <select id="supervisorDept" class="auth-input auth-input-with-icon" style="background-color: var(--bg-surface, #ffffff);">
              <option value="إشراف عام وتنسيق">إشراف عام وتنسيق إداري</option>
              <option value="شؤون الطلاب والاشتراكات">شؤون الطلاب والاشتراكات</option>
              <option value="شؤون المعلمين والحصص">شؤون المعلمين ومتابعة الحصص</option>
              <option value="الإشراف المالي والأجور">الإشراف المالي ومتابعة الرواتب</option>
              <option value="إدارة الجداول والمواعيد">إدارة الجداول والشواغر الدراسية</option>
            </select>
          </div>
        </div>

        <!-- Supervisor-specific Notes -->
        <div class="auth-form-group" id="supervisorNotesGroup" style="display: none;">
          <label for="supervisorNotes" class="auth-label">نبذة عن الخبرة أو ملاحظات إضافية (اختياري)</label>
          <div class="auth-input-wrapper">
            <i data-lucide="file-text" class="auth-input-icon"></i>
            <input type="text" id="supervisorNotes" class="auth-input auth-input-with-icon" placeholder="خبرات سابقة في الإدارة أو الإشراف التعليمي...">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="emailPrefix" class="auth-label">اسم الحساب المقترح</label>
          <div class="auth-input-wrapper" style="direction: ltr;">
            <input 
              type="text" 
              id="emailPrefix" 
              class="auth-input auth-email-input" 
              placeholder="اسم الحساب (مثال: ahmed123)" 
              required 
              autocomplete="username"
              spellcheck="false"
              autocapitalize="none"
            >
            <span class="auth-email-domain-badge">@gmail.com</span>
          </div>
        </div>

        <div class="auth-form-group">
          <label for="password" class="auth-label">كلمة المرور (8 رموز أو أكثر)</label>
          <div class="auth-input-wrapper">
            <i data-lucide="lock" class="auth-input-icon"></i>
            <input type="password" id="password" class="auth-input auth-input-with-icon" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="auth-submit-btn" style="margin-top: 1.25rem;">
          <i data-lucide="send" style="width: 18px; height: 18px;"></i>
          <span id="submitBtnText">إرسال طلب الانضمام كمعلم</span>
        </button>
      </form>

      <div class="auth-footer-prompt">
        <span>لديك حساب بالفعل؟</span>
        <a href="index.html" class="auth-link" style="margin-right: 0.25rem;">تسجيل الدخول</a>
      </div>
    </section>

    <footer class="auth-page-footer">
      <span>نظام سَبِيل &bull; تطوير </span>
      <span style="color: var(--primary-color); font-weight: 700;">Sabilix</span>
    </footer>

  </main>

  <div id="toast-container"></div>

  <script type="module" src="assets/js/features/auth/registerController.js"></script>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
