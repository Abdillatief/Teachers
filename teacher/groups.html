<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعاتي الجماعية - أكاديمية سبيل</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="users-round" style="color: var(--primary-color);"></i> المجموعات الموكلة إليك
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
              عرض المجموعات التعليمية، مواعيد الحصص، وأسماء الطلاب، وتسجيل الحصص الجماعية بسرعة.
            </p>
          </div>

          <button class="btn btn-primary" id="btnCreateGroupTeacher" style="gap: 0.5rem; font-weight: 700;">
            <i data-lucide="plus-circle" style="width: 18px; height: 18px;"></i> ➕ إنشاء مجموعة
          </button>
        </div>

        <div id="teacherGroupsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem;">
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">
            جاري تحميل المجموعات الخاصة بك...
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Teacher Group Details Modal -->
  <div id="teacherGroupDetailsModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 600px; border-radius: 12px; padding: 1.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.85rem;">
        <h3 id="tModalGroupName" style="font-weight: 800; color: var(--text-primary); margin: 0; font-size: 1.15rem;">تفاصيل المجموعة</h3>
        <span id="btnCloseTeacherDetailsModal" style="cursor: pointer; padding: 0.25rem;">
          <i data-lucide="x" style="color: var(--text-muted);"></i>
        </span>
      </div>

      <div id="tModalMeta" style="background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.85rem; margin-bottom: 1.25rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; font-size: 0.85rem;">
      </div>

      <h4 style="font-size: 0.95rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.75rem; display: flex; justify-content: space-between;">
        <span>طلاب المجموعة</span>
        <span id="tModalCountBadge" class="badge" style="background: var(--primary-light); color: var(--primary-color);"></span>
      </h4>

      <div id="tModalStudentsList" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 260px; overflow-y: auto;">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
        <button class="btn btn-primary" id="tBtnStartGroupSession" style="font-weight: 700; gap: 0.5rem;">
          <i data-lucide="play-circle" style="width: 18px; height: 18px;"></i> تسجيل حصة للمجموعة
        </button>
        <button class="btn btn-secondary" id="tBtnCloseDetails">إغلاق</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { getTeacherGroups, getGroupWithStudentDetails } from '../assets/js/features/groups/groupsManager.js';
    import { openQuickGroupModal } from '../assets/js/features/groups/quickGroupModal.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('teacher');

    let currentTeacherId = null;
    let currentTeacherName = '';
    let activeGroupId = null;

    async function initTeacherGroups() {
      renderSidebar('groups', 'teacher');
      renderNavbar('مجموعاتي الجماعية', { name: 'المعلم', roleName: 'معلم' });

      const grid = document.getElementById('teacherGroupsGrid');
      if (grid) {
        grid.addEventListener('click', (e) => {
          const recordBtn = e.target.closest('.btn-record-group-session');
          if (recordBtn) {
            window.location.href = `sessions.html?mode=group&groupId=${recordBtn.dataset.id}`;
            return;
          }

          const viewBtn = e.target.closest('.btn-view-group-students');
          if (viewBtn) {
            openTeacherGroupDetails(viewBtn.dataset.id);
            return;
          }
        });
      }

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          currentTeacherId = user.uid;
          try {
            const uDoc = await getDoc(doc(db, "users", user.uid));
            if (uDoc.exists()) {
              currentTeacherName = uDoc.data().name || 'المعلم';
              renderNavbar('مجموعاتي الجماعية', { name: currentTeacherName, roleName: 'معلم' });
            }
          } catch (err) {
            console.error("Error loading teacher profile:", err);
          }
          await loadTeacherGroups();
        }
      });

      document.getElementById('btnCreateGroupTeacher')?.addEventListener('click', () => {
        openQuickGroupModal({
          teacherId: currentTeacherId,
          teacherName: currentTeacherName,
          onGroupCreated: () => loadTeacherGroups()
        });
      });

      document.getElementById('btnCloseTeacherDetailsModal')?.addEventListener('click', () => {
        document.getElementById('teacherGroupDetailsModal').style.display = 'none';
      });
      document.getElementById('tBtnCloseDetails')?.addEventListener('click', () => {
        document.getElementById('teacherGroupDetailsModal').style.display = 'none';
      });

      document.getElementById('tBtnStartGroupSession')?.addEventListener('click', () => {
        if (activeGroupId) {
          window.location.href = `sessions.html?mode=group&groupId=${activeGroupId}`;
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTeacherGroups);
    } else {
      initTeacherGroups();
    }

    async function loadTeacherGroups() {
      const grid = document.getElementById('teacherGroupsGrid');
      if (!currentTeacherId) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">لم يتم التعرف على حساب المعلم.</div>';
        return;
      }

      const groups = await getTeacherGroups(currentTeacherId);

      if (groups.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem; background: var(--bg-card); border-radius: 12px; border: 1px dashed var(--border-color);">
            <i data-lucide="users-round" style="width: 48px; height: 48px; opacity: 0.4; margin-bottom: 0.5rem;"></i>
            <p style="font-weight: 700; margin: 0;">لا توجد مجموعات موكلة إليك حالياً.</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = groups.map(g => {
        const count = (g.studentIds || []).length;
        const maxCap = g.maxCapacity || 10;
        return `
          <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin: 0;">${g.name}</h3>
                <span class="badge" style="background: rgba(16, 185, 129, 0.1); color: var(--success); font-weight: 800;">نشطة 🟢</span>
              </div>

              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                📅 <strong>يوم الحصة:</strong> ${g.sessionDay || 'السبت'}
              </div>
              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                ⏰ <strong>الموعد:</strong> ${g.sessionTime || '05:00 م'} (${g.sessionDuration || 60} دقيقة)
              </div>
              <div style="font-size: 0.85rem; color: var(--primary-color); font-weight: 800; margin-bottom: 1rem;">
                👥 <strong>عدد الطلاب:</strong> ${count} / ${maxCap} طلاب
              </div>
            </div>

            <div style="display: flex; gap: 0.5rem; border-top: 1px solid var(--border-color); padding-top: 0.85rem;">
              <button class="btn btn-primary btn-record-group-session" data-id="${g.id}" style="flex: 1; font-weight: 700; font-size: 0.82rem;">
                ⚡ تسجيل حصة للمجموعة
              </button>
              <button class="btn btn-secondary btn-view-group-students" data-id="${g.id}" style="font-weight: 700; font-size: 0.82rem;">
                👁️ التفاصيل
              </button>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    async function openTeacherGroupDetails(groupId) {
      activeGroupId = groupId;
      const modal = document.getElementById('teacherGroupDetailsModal');
      modal.style.display = 'flex';

      const details = await getGroupWithStudentDetails(groupId);
      if (!details) {
        Toast.error("تعذر تحميل التفاصيل.");
        modal.style.display = 'none';
        return;
      }

      document.getElementById('tModalGroupName').textContent = details.name;
      document.getElementById('tModalMeta').innerHTML = `
        <div><strong>يوم الحصة:</strong> ${details.sessionDay || 'السبت'}</div>
        <div><strong>موعد الحصة:</strong> ${details.sessionTime || '05:00 م'}</div>
        <div><strong>المدة:</strong> ${details.sessionDuration || 60} دقيقة</div>
        <div><strong>عدد الطلاب:</strong> ${(details.students || []).length} / ${details.maxCapacity || 10}</div>
      `;

      document.getElementById('tModalCountBadge').textContent = `${(details.students || []).length} طلاب`;

      const listContainer = document.getElementById('tModalStudentsList');
      if (!details.students || details.students.length === 0) {
        listContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 1rem;">لا يوجد طلاب بالمجموعة.</div>';
      } else {
        listContainer.innerHTML = details.students.map(s => `
          <div style="background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.65rem 0.85rem; font-weight: 700; font-size: 0.88rem; color: var(--text-primary);">
            👤 ${s.name || 'طالب'}
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
