<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - بث الإشعارات و Push Notifications</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .status-pill {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .status-sent { background: rgba(59, 130, 246, 0.15); color: #2563eb; }
    .status-delivered { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-clicked { background: rgba(139, 92, 246, 0.15); color: #7c3aed; }
    .status-read { background: rgba(16, 185, 129, 0.25); color: #047857; }
    .status-failed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem;">
            <i data-lucide="bell-ring" style="color: var(--primary-color);"></i>
            بث الإشعارات وتنبيهات الهواتف (Push Notifications)
          </h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">إرسال إشعارات فورية تصل مباشرة لهواتف وأجهزة المعلمين حتى وإن كان المتصفح أو الموقع مغلقاً.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 1.5rem; flex-wrap: wrap;">
          <div class="card">
            <h3 style="font-weight: 700; font-size: 1.1rem; margin-bottom: 1.25rem;">بث إشعار Push جديد 📲</h3>
            <form id="broadcastNotificationForm">
              <div class="form-group">
                <label for="notifTitle">عنوان الإشعار</label>
                <input type="text" id="notifTitle" class="form-control" placeholder="مثال: تنبيه هام بشأن جدول الحصص..." required style="font-weight: bold;">
              </div>

              <div class="form-group">
                <label for="notifBody">محتوى وتفاصيل الرسالة</label>
                <textarea id="notifBody" class="form-control" rows="4" placeholder="اكتب نص الإشعار كاملاً هنا..." required></textarea>
              </div>

              <div class="form-group">
                <label for="notifRecipient">المستهدف بالإرسال</label>
                <select id="notifRecipient" class="form-control" style="font-weight: 600;">
                  <option value="all">الكل (جميع المعلمين المسجلين) 👥</option>
                </select>
              </div>

              <div class="form-group">
                <label for="notifUrl">رابط توجيه الإشعار (Deep Link)</label>
                <select id="notifUrl" class="form-control" style="font-weight: 500;">
                  <option value="/teacher/today-sessions.html">جدول حصص اليوم (افتراضي) 📅</option>
                  <option value="/teacher/notifications.html">مركز الإشعارات 🔔</option>
                  <option value="/teacher/sessions.html">سجل الحصص الشامل 📖</option>
                  <option value="/teacher/profile.html">الملف الشخصي 👤</option>
                </select>
              </div>

              <button type="submit" id="submitNotifBtn" class="btn btn-primary" style="width: 100%; gap: 0.5rem; font-weight: 700; margin-top: 1rem;">
                <i data-lucide="send"></i> إرسال وتنبيه الهواتف فوراً
              </button>
            </form>
          </div>

          <div class="card">
            <h3 style="font-weight: 700; font-size: 1.1rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
              <span>سجل الإشعارات وتتبع الاستلام 📊</span>
              <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);" id="notifCountBadge">0 إشعار</span>
            </h3>
            <div id="sentNotificationsList" style="display: flex; flex-direction: column; gap: 1rem; max-height: 550px; overflow-y: auto; padding-left: 0.25rem;">
              <!-- سيتم ملؤها ديناميكيًا -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar, showNotificationModalDetails } from '../assets/js/shared/components/navbar.js';
    import { collection, onSnapshot, doc, getDocs, deleteDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';
    import { showCustomConfirm } from '../assets/js/shared/utils/helpers.js';
    import { dispatchPushNotification } from '../assets/js/shared/utils/fcmManager.js';

    protectRoute('admin');

    auth.onAuthStateChanged((user) => {
      if (user) {
        renderSidebar('notifications', 'admin');
        renderNavbar('بث الإشعارات والـ Push Notifications', { name: 'الإدارة العامة', roleName: 'مدير الأكاديمية' });
        initNotificationsPanel();
      }
    });

    function initNotificationsPanel() {
      // 1. جلب المعلمين لتعبئة القائمة
      const teachersQuery = query(collection(db, "users"), where("role", "==", "teacher"));
      getDocs(teachersQuery).then(snap => {
        const select = document.getElementById('notifRecipient');
        snap.forEach(docSnap => {
          const t = docSnap.data();
          const opt = document.createElement('option');
          opt.value = docSnap.id;
          opt.textContent = `المعلم: ${t.name || 'غير مسمى'}`;
          select.appendChild(opt);
        });
      });

      // 2. تفعيل الاستماع الفوري لقائمة الإشعارات وحالات الاستلام
      const listContainer = document.getElementById('sentNotificationsList');
      onSnapshot(collection(db, "notifications"), (snapshot) => {
        if (snapshot.empty) {
          listContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 1.5rem;">لا توجد تعميمات مسجلة أو مرسلة مسبقاً.</p>`;
          document.getElementById('notifCountBadge').textContent = '0 إشعار';
          return;
        }

        const items = [];
        snapshot.forEach(docSnap => {
          items.push({ id: docSnap.id, ...docSnap.data() });
        });

        // الترتيب من الأحدث للأقدم
        items.sort((a,b) => {
          const timeA = a.createdAt?.seconds ? a.createdAt.seconds * 1000 : (new Date(a.createdAt || 0).getTime());
          const timeB = b.createdAt?.seconds ? b.createdAt.seconds * 1000 : (new Date(b.createdAt || 0).getTime());
          return timeB - timeA;
        });

        document.getElementById('notifCountBadge').textContent = `${items.length} إشعار`;

        listContainer.innerHTML = items.map(item => {
          const dateStr = item.createdAt ? (item.createdAt.seconds ? new Date(item.createdAt.seconds * 1000).toLocaleString('ar-EG') : new Date(item.createdAt).toLocaleString('ar-EG')) : 'الآن';
          
          const st = item.statuses || {};
          const isSent = st.sent?.status;
          const isDelivered = st.delivered?.status || item.status === 'delivered';
          const isClicked = st.clicked?.status;
          const isRead = st.read?.status || (item.readBy && item.readBy.length > 0);
          const isFailed = st.failed?.status || item.status === 'failed';

          let statusChips = [];
          if (isSent) statusChips.push(`<span class="status-pill status-sent">📤 تم الإرسال</span>`);
          if (isDelivered) statusChips.push(`<span class="status-pill status-delivered">📲 تم التسليم</span>`);
          if (isClicked) statusChips.push(`<span class="status-pill status-clicked">👆 تم النقر</span>`);
          if (isRead) statusChips.push(`<span class="status-pill status-read">👁️ تم القراءة</span>`);
          if (isFailed) statusChips.push(`<span class="status-pill status-failed">⚠️ فشل الإرسال</span>`);

          const targetCount = item.targetTokensCount || 0;
          const successCount = item.successTokensCount || 0;
          const failCount = item.failTokensCount || 0;
          
          const retryBtnHtml = (isFailed || item.status === 'sending') ? `
            <button class="btn btn-secondary retry-push-btn" data-id="${item.id}" style="padding: 0.3rem 0.6rem; font-size: 0.75rem; color: var(--primary-color); border-color: var(--primary-color);" title="إعادة محاولة التنبيه">
              <i data-lucide="rotate-cw" style="width: 13px; height: 13px;"></i> إعادة المحاولة
            </button>
          ` : '';

          return `
            <div class="admin-notif-card" data-id="${item.id}" style="background-color: var(--bg-primary); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.35rem;">
                <h4 style="font-weight: 800; color: var(--text-primary); margin: 0; font-size: 0.95rem;">${item.title}</h4>
                <div style="display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end;">
                  ${statusChips.join('')}
                </div>
              </div>

              <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; margin-bottom: 0.6rem; white-space: pre-line;">${item.body || item.message || ''}</p>
              
              <div style="font-size: 0.72rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 0.4rem;">
                <span>📅 الإرسال: ${dateStr}</span>
                <span>📱 الأجهزة المستهدفة: <strong>${targetCount}</strong> (نجاح: <strong style="color:var(--success);">${successCount}</strong> | فشل: <strong style="color:var(--danger);">${failCount}</strong>)</span>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                <span style="color: var(--primary-color); font-size: 0.72rem; font-weight: 700;">تفاصيل وحالات الاستلام ↗</span>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                  ${retryBtnHtml}
                  <button class="btn btn-secondary delete-notif-btn" data-id="${item.id}" style="padding: 0.3rem; color: var(--danger);" title="حذف الإشعار"><i data-lucide="trash-2" style="width: 14px; height: 14px;"></i></button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        if (window.lucide) {
          window.lucide.createIcons();
        }

        // 3. النقر لمشاهدة التفاصيل
        document.querySelectorAll('.admin-notif-card').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.delete-notif-btn') || e.target.closest('.retry-push-btn')) return;
            const id = card.dataset.id;
            const notif = items.find(i => i.id === id);
            if (notif) {
              showNotificationModalDetails(notif);
            }
          });
        });

        // 4. إعادة المحاولة
        document.querySelectorAll('.retry-push-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const notif = items.find(i => i.id === id);
            if (!notif) return;

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="spin"></i> جاري إعادة المحاولة...`;
            Toast.info("جاري محاولة إعادة إرسال تنبيه الـ Push للهواتف...");

            try {
              await dispatchPushNotification({
                title: notif.title,
                body: notif.body,
                recipientId: notif.recipientId,
                type: notif.type || 'broadcast',
                url: notif.url || '/teacher/today-sessions.html',
                existingDocId: notif.id
              });
              Toast.success("تم إعادة إدراج الإشعار في القائمة ومعالجته عبر Cloud Function 📲✅");
            } catch (err) {
              console.error(err);
              Toast.danger("فشلت إعادة الإرسال.");
            } finally {
              btn.disabled = false;
            }
          });
        });

        // 5. حذف الإشعار
        document.querySelectorAll('.delete-notif-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            showCustomConfirm("هل تريد حذف هذا الإشعار وسجل إرساله نهائياً؟", async () => {
              await deleteDoc(doc(db, "notifications", id));
              Toast.danger("تم إزالة الإشعار.");
            });
          });
        });
      });
    }

    // بث وتنبيه الهواتف عبر Push Notifications
    document.getElementById('broadcastNotificationForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitNotifBtn');
      const title = document.getElementById('notifTitle').value.trim();
      const body = document.getElementById('notifBody').value.trim();
      const recipientId = document.getElementById('notifRecipient').value;
      const url = document.getElementById('notifUrl').value;

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="spin"></i> جاري تنبيه أجهزة وهواتف المعلمين...`;

      try {
        await dispatchPushNotification({
          title,
          body,
          recipientId,
          type: 'broadcast',
          url
        });

        Toast.success("تم بث الإشعار ومعالجته عبر Firebase Cloud Function بنجاح 📲✅");
        document.getElementById('broadcastNotificationForm').reset();
      } catch (err) {
        console.error(err);
        Toast.danger("حدث خطأ أثناء بث الإشعار للهواتف.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send"></i> إرسال وتنبيه الهواتف فوراً`;
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
