<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - مركز التنبيهات والإشعارات</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .notif-filter-pill {
      padding: 0.5rem 1rem;
      border-radius: var(--border-radius-sm);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .notif-filter-pill.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
      box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
    }
    .notif-filter-pill:hover:not(.active) {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }
    .teacher-notif-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all 0.2s ease;
      position: relative;
      cursor: pointer;
    }
    .teacher-notif-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .teacher-notif-card.is-unread {
      background: #f0fdfa;
      border-color: #99f6e4;
      border-right: 4px solid var(--primary-color);
    }
    .dark-theme .teacher-notif-card.is-unread {
      background: rgba(13, 148, 136, 0.12);
      border-color: rgba(13, 148, 136, 0.35);
    }
    .teacher-notif-card.is-pinned {
      background: #fefce8;
      border-color: #fde047;
      border-right: 4px solid #eab308;
    }
    .dark-theme .teacher-notif-card.is-pinned {
      background: rgba(234, 179, 8, 0.12);
      border-color: rgba(234, 179, 8, 0.35);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header & Action Row -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
          <div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
              <i data-lucide="bell-ring" style="width: 22px; height: 22px; color: var(--primary-color);"></i>
              <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--text-primary); margin: 0;">مركز التنبيهات والإشعارات</h1>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0;">
              جميع التنبيهات الإدارية والمستحقات ومواعيد الحصص الموجهة لحسابك الخاص
            </p>
          </div>

          <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
            <button id="btnQuickTestTeacherNotif" class="btn btn-secondary btn-sm" title="إرسال إشعار تجريبي فوري للتأكد من عمل التنبيهات">
              <i data-lucide="sparkles" style="width: 15px; height: 15px; color: var(--primary-color);"></i>
              <span>تجربة إشعار فوري</span>
            </button>
            <button id="btnMarkAllReadPage" class="btn btn-outline btn-sm">
              <i data-lucide="check-check" style="width: 15px; height: 15px;"></i>
              <span>تحديد الكل كمقروء</span>
            </button>
            <button id="btnClearAllNotifsPage" class="btn btn-secondary btn-sm" style="color: #ef4444;">
              <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i>
              <span>مسح الإشعارات</span>
            </button>
          </div>
        </div>

        <!-- Metric Counter Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="card" style="border-right: 4px solid var(--primary-color); padding: 1rem;">
            <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">إجمالي الإشعارات</span>
            <h3 id="statTotalNotifs" style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0;">0</h3>
          </div>
          <div class="card" style="border-right: 4px solid #ef4444; padding: 1rem;">
            <span style="font-size: 0.78rem; font-weight: 700; color: #ef4444; display: block; margin-bottom: 0.35rem;">غير المقروءة</span>
            <h3 id="statUnreadNotifs" style="font-size: 1.5rem; font-weight: 800; color: #ef4444; margin: 0;">0</h3>
          </div>
          <div class="card" style="border-right: 4px solid #eab308; padding: 1rem;">
            <span style="font-size: 0.78rem; font-weight: 700; color: #ca8a04; display: block; margin-bottom: 0.35rem;">المثبتة والعاجلة</span>
            <h3 id="statPinnedNotifs" style="font-size: 1.5rem; font-weight: 800; color: #ca8a04; margin: 0;">0</h3>
          </div>
          <div class="card" style="border-right: 4px solid #10b981; padding: 1rem;">
            <span style="font-size: 0.78rem; font-weight: 700; color: #059669; display: block; margin-bottom: 0.35rem;">الرواتب والمستحقات</span>
            <h3 id="statSalaryNotifs" style="font-size: 1.5rem; font-weight: 800; color: #059669; margin: 0;">0</h3>
          </div>
        </div>

        <!-- Filter Tabs & Search Bar -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 0.85rem 1.15rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
            <!-- Tabs -->
            <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;" id="filterTabsGroup">
              <button class="notif-filter-pill active" data-filter="all">
                <span>الكل</span>
                <span id="badgeTabAll" style="background: rgba(255,255,255,0.25); font-size: 0.7rem; padding: 1px 6px; border-radius: 99px;">0</span>
              </button>
              <button class="notif-filter-pill" data-filter="unread">
                <span>غير المقروءة</span>
                <span id="badgeTabUnread" style="background: rgba(0,0,0,0.06); font-size: 0.7rem; padding: 1px 6px; border-radius: 99px;">0</span>
              </button>
              <button class="notif-filter-pill" data-filter="sessions">
                <i data-lucide="play-circle" style="width: 14px; height: 14px;"></i>
                <span>الحصص والمواعيد</span>
              </button>
              <button class="notif-filter-pill" data-filter="salary">
                <i data-lucide="wallet" style="width: 14px; height: 14px;"></i>
                <span>المستحقات والرواتب</span>
              </button>
              <button class="notif-filter-pill" data-filter="broadcast">
                <i data-lucide="megaphone" style="width: 14px; height: 14px;"></i>
                <span>التعاميم والإعلانات</span>
              </button>
            </div>

            <!-- Search input -->
            <div style="min-width: 220px; flex: 1; max-width: 320px; position: relative;">
              <input type="text" id="notifSearchInput" class="form-control" placeholder="بحث في الإشعارات..." style="padding-right: 2.2rem; font-size: 0.82rem;">
              <i data-lucide="search" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none;"></i>
            </div>
          </div>
        </div>

        <!-- Notifications List Container -->
        <div id="teacherNotificationsList" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem 1rem;">
            <div class="skeleton-box" style="height: 70px; margin-bottom: 0.6rem; border-radius: 8px;"></div>
            <div class="skeleton-box" style="height: 70px; margin-bottom: 0.6rem; border-radius: 8px;"></div>
            <div class="skeleton-box" style="height: 70px; border-radius: 8px;"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar, showNotificationModalDetails } from '../assets/js/shared/components/navbar.js';
    import { 
      subscribeToUserNotifications, 
      sendNotificationToUser 
    } from '../assets/js/shared/services/notificationService.js';
    import { getNotificationEventMeta } from '../assets/js/shared/utils/adminNotificationService.js';
    import { Toast } from '../assets/js/shared/utils/toast.js';
    import { showCustomConfirm } from '../assets/js/shared/utils/helpers.js';
    import { doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    protectRoute('teacher');

    let currentTeacher = null;
    let cachedNotifications = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // Initialize UI
    const sessionCache = sessionStorage.getItem('sabeel_user_session');
    if (sessionCache) {
      try {
        currentTeacher = JSON.parse(sessionCache);
        renderSidebar('notifications', 'teacher');
        renderNavbar('مركز التنبيهات والإشعارات', {
          name: currentTeacher.name || 'المعلم',
          roleName: 'معلم معتمد'
        });
      } catch (e) {}
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) return;

      if (!currentTeacher) {
        currentTeacher = { uid: user.uid, email: user.email, name: user.displayName || 'المعلم' };
        renderSidebar('notifications', 'teacher');
        renderNavbar('مركز التنبيهات والإشعارات', {
          name: currentTeacher.name,
          roleName: 'معلم معتمد'
        });
      }

      // Strict Zero-Leak Listener for Teacher Notifications
      subscribeToUserNotifications(user, 'teacher', (notificationsList) => {
        cachedNotifications = notificationsList || [];
        updateCounters();
        renderList();
      });
    });

    // Update Counters
    function updateCounters() {
      const total = cachedNotifications.length;
      const unread = cachedNotifications.filter(n => !n.readBy || !n.readBy.includes(currentTeacher?.uid)).length;
      const pinned = cachedNotifications.filter(n => Boolean(n.isPinned) || n.priority === 'urgent').length;
      const salary = cachedNotifications.filter(n => {
        const t = n.type || '';
        return t.includes('salary') || t.includes('bonus') || t.includes('deduction');
      }).length;

      const elTotal = document.getElementById('statTotalNotifs');
      const elUnread = document.getElementById('statUnreadNotifs');
      const elPinned = document.getElementById('statPinnedNotifs');
      const elSalary = document.getElementById('statSalaryNotifs');
      const badgeAll = document.getElementById('badgeTabAll');
      const badgeUnread = document.getElementById('badgeTabUnread');

      if (elTotal) elTotal.textContent = total;
      if (elUnread) elUnread.textContent = unread;
      if (elPinned) elPinned.textContent = pinned;
      if (elSalary) elSalary.textContent = salary;
      if (badgeAll) badgeAll.textContent = total;
      if (badgeUnread) badgeUnread.textContent = unread;
    }

    // Render Notifications List
    function renderList() {
      const container = document.getElementById('teacherNotificationsList');
      if (!container) return;

      let items = [...cachedNotifications];
      const uid = currentTeacher?.uid;

      // Filter by tab
      if (currentFilter === 'unread') {
        items = items.filter(n => !n.readBy || !n.readBy.includes(uid));
      } else if (currentFilter === 'sessions') {
        items = items.filter(n => {
          const t = n.type || '';
          return t.includes('session') || t.includes('trial') || t.includes('group');
        });
      } else if (currentFilter === 'salary') {
        items = items.filter(n => {
          const t = n.type || '';
          return t.includes('salary') || t.includes('bonus') || t.includes('deduction');
        });
      } else if (currentFilter === 'broadcast') {
        items = items.filter(n => {
          const t = n.type || '';
          return t.includes('broadcast') || t.includes('announcement') || t.includes('maintenance') || n.recipientId === 'teachers' || n.recipientId === 'all';
        });
      }

      // Filter by search query
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        items = items.filter(n => {
          const title = (n.title || '').toLowerCase();
          const body = (n.body || n.message || '').toLowerCase();
          return title.includes(q) || body.includes(q);
        });
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; color: var(--text-muted); padding: 3rem 1rem;">
            <i data-lucide="bell-off" style="width: 40px; height: 40px; margin-bottom: 0.75rem; opacity: 0.4;"></i>
            <h3 style="font-size: 1rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.25rem 0;">
              ${currentFilter === 'unread' ? 'لا توجد إشعارات غير مقروءة' : 'لا توجد إشعارات تطابق اختيارك'}
            </h3>
            <p style="font-size: 0.8rem; margin: 0;">جميع الإشعارات الموجهة لك ستظهر هنا تلقائياً بتحديث فوري ومباشر.</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons({ root: container });
        return;
      }

      container.innerHTML = items.map(item => {
        const isRead = item.readBy && item.readBy.includes(uid);
        const isPinnedForUser = Boolean(item.isPinned) && (!item.unpinnedBy || !item.unpinnedBy.includes(uid));
        const meta = getNotificationEventMeta(item);

        let itemClass = 'teacher-notif-card';
        if (isPinnedForUser) itemClass += ' is-pinned';
        else if (!isRead) itemClass += ' is-unread';

        let timeLabel = 'الآن';
        if (item.createdAt) {
          const d = item.createdAt.seconds ? new Date(item.createdAt.seconds * 1000) : new Date(item.createdAt);
          timeLabel = d.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
        }

        const deepLink = item.deepLink || item.url || item.data?.deepLink || item.data?.url;

        return `
          <div class="${itemClass}" data-id="${item.id}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: ${meta.badgeBg}; color: ${meta.color || 'var(--primary-color)'}; flex-shrink: 0;">
                  <i data-lucide="${isPinnedForUser ? 'pin' : (meta.icon || 'bell')}" style="width: 16px; height: 16px;"></i>
                </span>
                <h3 style="font-size: 0.95rem; font-weight: ${isRead ? '600' : '800'}; color: var(--text-primary); margin: 0;">
                  ${item.title || 'إشعار جديد'}
                </h3>
                ${!isRead ? `<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary-color); display: inline-block;"></span>` : ''}
              </div>

              <div style="display: flex; align-items: center; gap: 0.4rem;">
                <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 500;">${timeLabel}</span>
                <button class="btn btn-sm btn-delete-notif" data-id="${item.id}" title="حذف الإشعار" style="background: none; border: none; padding: 3px; cursor: pointer; color: var(--text-muted);">
                  <i data-lucide="x" style="width: 14px; height: 14px;"></i>
                </button>
              </div>
            </div>

            <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin: 0;">
              ${item.body || item.message || ''}
            </p>

            <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem;">
              <div style="display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;">
                <span class="badge" style="background: ${meta.badgeBg}; color: ${meta.badgeColor}; font-size: 0.68rem; font-weight: 700; border: 1px solid ${meta.borderColor}33; padding: 0.1rem 0.45rem; border-radius: 4px;">
                  ${meta.label}
                </span>
                ${isPinnedForUser ? `
                  <span class="badge" style="background: rgba(234, 179, 8, 0.2); color: #854d0e; font-size: 0.68rem; font-weight: 800; border: 1px solid rgba(234, 179, 8, 0.45); padding: 0.1rem 0.45rem; border-radius: 4px;">
                    📌 مثبت
                  </span>
                ` : ''}
              </div>

              <div style="display: flex; align-items: center; gap: 0.4rem;">
                ${deepLink ? `
                  <a href="${deepLink}" class="btn btn-sm btn-primary" style="padding: 0.2rem 0.6rem; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 0.25rem;" onclick="event.stopPropagation();">
                    <span>فتح الوجهة</span>
                    <i data-lucide="arrow-left" style="width: 12px; height: 12px;"></i>
                  </a>
                ` : ''}
                <button class="btn btn-sm btn-outline btn-view-details" data-id="${item.id}" style="padding: 0.2rem 0.6rem; font-size: 0.72rem;">
                  تفاصيل
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons({ root: container });

      // Attach clicks
      container.querySelectorAll('.teacher-notif-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-delete-notif') || e.target.closest('a')) return;
          const id = card.dataset.id;
          const item = cachedNotifications.find(n => n.id === id);
          if (item) {
            // Mark as read
            if (!item.readBy || !item.readBy.includes(uid)) {
              updateDoc(doc(db, "notifications", id), {
                readBy: arrayUnion(uid)
              }).catch(() => {});
            }
            showNotificationModalDetails(item, currentTeacher);
          }
        });
      });

      // Delete action
      container.querySelectorAll('.btn-delete-notif').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          try {
            await updateDoc(doc(db, "notifications", id), {
              deletedBy: arrayUnion(uid)
            });
            Toast.success("تم حذف الإشعار من قائمتك.");
          } catch (err) {
            console.error("Delete error:", err);
          }
        });
      });
    }

    // Tab switcher
    document.querySelectorAll('.notif-filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.notif-filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });

    // Search input
    const searchInput = document.getElementById('notifSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderList();
      });
    }

    // Mark all as read button
    document.getElementById('btnMarkAllReadPage')?.addEventListener('click', async () => {
      const uid = currentTeacher?.uid;
      const unreadItems = cachedNotifications.filter(n => !n.readBy || !n.readBy.includes(uid));
      if (unreadItems.length === 0) {
        Toast.info("جميع الإشعارات محددة كمقروءة بالفعل.");
        return;
      }
      try {
        await Promise.all(unreadItems.map(item => 
          updateDoc(doc(db, "notifications", item.id), {
            readBy: arrayUnion(uid)
          })
        ));
        Toast.success("تم تحديد جميع الإشعارات كمقروءة بنجاح ✅");
      } catch (err) {
        console.error("Error marking all read:", err);
        Toast.error("حدث خطأ أثناء التحديث.");
      }
    });

    // Clear all button
    document.getElementById('btnClearAllNotifsPage')?.addEventListener('click', () => {
      const uid = currentTeacher?.uid;
      if (cachedNotifications.length === 0) return;

      showCustomConfirm("هل أنت متأكد من مسح جميع الإشعارات الحالية من قائمتك؟", async () => {
        try {
          await Promise.all(cachedNotifications.map(item => 
            updateDoc(doc(db, "notifications", item.id), {
              deletedBy: arrayUnion(uid)
            })
          ));
          Toast.success("تم مسح وتنظيف قائمة الإشعارات بنجاح ✅");
        } catch (err) {
          console.error("Clear error:", err);
          Toast.error("فشل مسح الإشعارات.");
        }
      });
    });

    // Quick test notification for this teacher
    document.getElementById('btnQuickTestTeacherNotif')?.addEventListener('click', async () => {
      if (!currentTeacher || !currentTeacher.uid) return;
      try {
        Toast.info("جاري إرسال إشعار تجريبي لحسابك...");
        const res = await sendNotificationToUser(
          currentTeacher.uid,
          '🔔 تجربة إشعار المعلم',
          'هذا إشعار تجريبي خاص بك للتأكد من وصول وتنسيق التنبيهات الخاصة بحسابك بدون أي تسريب.',
          {
            targetRole: 'teacher',
            type: 'admin_direct_message',
            priority: 'urgent',
            deepLink: '/teacher/today-sessions.html'
          }
        );
        if (res.success) {
          Toast.success("تم إرسال الإشعار التجريبي بنجاح! سيظهر في قائمتك وجرس التنبيهات الآن.");
        } else {
          Toast.warning("تم حفظ الإشعار داخلياً بنجاح.");
        }
      } catch (err) {
        console.error("Test notif error:", err);
        Toast.error("خطأ: " + err.message);
      }
    });

  </script>
</body>
</html>
