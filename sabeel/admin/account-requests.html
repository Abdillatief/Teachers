<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - طلبات الحسابات المعلقة</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        <!-- Header -->
        <div class="page-header" style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.35rem 0; display: flex; align-items: center; gap: 0.6rem;">
              <i data-lucide="user-check" style="width: 26px; height: 26px; color: var(--primary-color);"></i>
              طلبات الحسابات المعلقة
            </h1>
            <p style="margin: 0; font-size: 0.88rem; color: var(--text-muted);">
              مراجعة طلبات الانضمام الجديدة للمعلمين والمشرفين واعتماد الصلاحيات
            </p>
          </div>
        </div>

        <!-- Metrics Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="card" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;">
            <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(2, 132, 199, 0.12); border: 1px solid rgba(2, 132, 199, 0.25); display: flex; align-items: center; justify-content: center; color: var(--primary-color);">
              <i data-lucide="users" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">إجمالي الطلبات المعلقة</div>
              <div id="statTotalPending" style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">0</div>
            </div>
          </div>

          <div class="card" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;">
            <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); display: flex; align-items: center; justify-content: center; color: #10b981;">
              <i data-lucide="graduation-cap" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">طلبات المعلمين</div>
              <div id="statTeachersPending" style="font-size: 1.5rem; font-weight: 800; color: #10b981;">0</div>
            </div>
          </div>

          <div class="card" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;">
            <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.25); display: flex; align-items: center; justify-content: center; color: #f59e0b;">
              <i data-lucide="shield" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">طلبات المشرفين</div>
              <div id="statSupervisorsPending" style="font-size: 1.5rem; font-weight: 800; color: #f59e0b;">0</div>
            </div>
          </div>
        </div>

        <!-- Filter Buttons -->
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
          <button id="filterAllBtn" class="tab-btn active" style="padding: 0.55rem 1.25rem; font-size: 0.88rem; font-weight: 600; border-radius: 8px; border: 1px solid var(--border-color-strong); background: var(--bg-hover); color: var(--text-primary); cursor: pointer;">
            جميع الطلبات
          </button>
          <button id="filterTeacherBtn" class="tab-btn" style="padding: 0.55rem 1.25rem; font-size: 0.88rem; font-weight: 600; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-muted); cursor: pointer;">
            المعلمون
          </button>
          <button id="filterSupervisorBtn" class="tab-btn" style="padding: 0.55rem 1.25rem; font-size: 0.88rem; font-weight: 600; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-muted); cursor: pointer;">
            المشرفون
          </button>
        </div>

        <!-- Requests Table -->
        <div class="card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;">
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.90rem; text-align: right;">
              <thead>
                <tr style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.82rem;">
                  <th style="padding: 0.9rem 1.25rem;">الاسم الكامل</th>
                  <th style="padding: 0.9rem 1.25rem;">نوع الحساب</th>
                  <th style="padding: 0.9rem 1.25rem;">البريد الإلكتروني</th>
                  <th style="padding: 0.9rem 1.25rem;">رقم الهاتف</th>
                  <th style="padding: 0.9rem 1.25rem;">القسم / الملاحظات</th>
                  <th style="padding: 0.9rem 1.25rem;">تاريخ الطلب</th>
                  <th style="padding: 0.9rem 1.25rem; text-align: center;">الإجراء</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody">
                <tr>
                  <td colspan="7" style="padding: 2.5rem; text-align: center; color: var(--text-muted);">
                    <i data-lucide="loader-2" class="animate-spin" style="width: 24px; height: 24px; margin: 0 auto 0.5rem auto; display: block;"></i>
                    جاري تحميل الطلبات...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import '../assets/js/shared/utils/jsonShield.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { 
      collection, 
      onSnapshot, 
      doc, 
      updateDoc, 
      setDoc,
      serverTimestamp,
      query,
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';
    import { showCustomConfirm } from '../assets/js/shared/utils/helpers.js';

    protectRoute('admin');

    let pendingUsers = [];
    let activeFilter = 'all';

    auth.onAuthStateChanged((user) => {
      if (user) {
        renderSidebar('account-requests', 'admin');
        renderNavbar('طلبات الحسابات', { name: 'الإدارة المركزية', roleName: 'مدير النظام' });
        initRequestsListener();
      }
    });

    const filterAllBtn = document.getElementById('filterAllBtn');
    const filterTeacherBtn = document.getElementById('filterTeacherBtn');
    const filterSupervisorBtn = document.getElementById('filterSupervisorBtn');

    function setFilter(filter) {
      activeFilter = filter;
      [filterAllBtn, filterTeacherBtn, filterSupervisorBtn].forEach(b => {
        b.style.background = 'transparent';
        b.style.borderColor = 'transparent';
        b.style.color = 'var(--text-muted)';
      });
      const activeBtn = filter === 'all' ? filterAllBtn : filter === 'teacher' ? filterTeacherBtn : filterSupervisorBtn;
      activeBtn.style.background = 'var(--bg-hover)';
      activeBtn.style.borderColor = 'var(--border-color-strong)';
      activeBtn.style.color = 'var(--text-primary)';
      renderRequests();
    }

    filterAllBtn.addEventListener('click', () => setFilter('all'));
    filterTeacherBtn.addEventListener('click', () => setFilter('teacher'));
    filterSupervisorBtn.addEventListener('click', () => setFilter('supervisor'));

    function initRequestsListener() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        pendingUsers = [];
        snapshot.forEach(docSnap => {
          const u = docSnap.data();
          if (u.status === 'pending') {
            const roleType = (u.isSubAdmin || u.role === 'supervisor') ? 'supervisor' : (u.role || 'teacher');
            pendingUsers.push({ id: docSnap.id, ...u, roleType });
          }
        });

        updateStats();
        renderRequests();
      });
    }

    function updateStats() {
      const teachers = pendingUsers.filter(u => u.roleType === 'teacher');
      const supervisors = pendingUsers.filter(u => u.roleType === 'supervisor');

      document.getElementById('statTotalPending').textContent = pendingUsers.length;
      document.getElementById('statTeachersPending').textContent = teachers.length;
      document.getElementById('statSupervisorsPending').textContent = supervisors.length;
    }

    function renderRequests() {
      const tbody = document.getElementById('requestsTableBody');
      const filtered = pendingUsers.filter(u => {
        if (activeFilter === 'all') return true;
        return u.roleType === activeFilter;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="padding: 3rem 1rem; text-align: center; color: var(--text-muted);">
              <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(16, 185, 129, 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem auto; color: #10b981;">
                <i data-lucide="check-circle-2" style="width: 24px; height: 24px;"></i>
              </div>
              <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">لا توجد طلبات معلقة</div>
              <div style="font-size: 0.82rem;">تمت مراجعة واعتماد جميع طلبات الحسابات بنجاح.</div>
            </td>
          </tr>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      let rows = '';
      filtered.forEach(u => {
        const isSup = u.roleType === 'supervisor';
        const roleBadge = isSup
          ? `<span style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.78rem; font-weight: 700; background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.25);"><i data-lucide="shield" style="width: 14px; height: 14px;"></i> مشرف إداري</span>`
          : `<span style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.78rem; font-weight: 700; background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.25);"><i data-lucide="graduation-cap" style="width: 14px; height: 14px;"></i> معلم</span>`;

        rows += `
          <tr style="border-bottom: 1px solid var(--border-color);">
            <td style="padding: 1rem 1.25rem; font-weight: 600; color: var(--text-primary);">${u.name || '—'}</td>
            <td style="padding: 1rem 1.25rem;">${roleBadge}</td>
            <td style="padding: 1rem 1.25rem; color: var(--text-secondary); direction: ltr; text-align: right;">${u.email || '—'}</td>
            <td style="padding: 1rem 1.25rem; color: var(--text-secondary); direction: ltr; text-align: right;">${u.phone || '—'}</td>
            <td style="padding: 1rem 1.25rem; color: var(--text-muted); font-size: 0.85rem;">${u.supervisorTitle || u.department || u.notes || '—'}</td>
            <td style="padding: 1rem 1.25rem; color: var(--text-muted); font-size: 0.82rem;">${u.createdAt ? u.createdAt.split('T')[0] : '—'}</td>
            <td style="padding: 1rem 1.25rem; text-align: center;">
              <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button data-id="${u.id}" data-role="${u.roleType}" data-name="${u.name}" class="btn-approve" style="padding: 0.4rem 0.75rem; font-size: 0.82rem; font-weight: 600; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.12); color: #10b981; cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem;">
                  <i data-lucide="check" style="width: 14px; height: 14px;"></i>
                  قبول
                </button>
                <button data-id="${u.id}" data-name="${u.name}" class="btn-reject" style="padding: 0.4rem 0.75rem; font-size: 0.82rem; font-weight: 600; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.12); color: #ef4444; cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem;">
                  <i data-lucide="x" style="width: 14px; height: 14px;"></i>
                  رفض
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = rows;
      if (window.lucide) window.lucide.createIcons();

      // Bind approve buttons
      document.querySelectorAll('.btn-approve').forEach(btn => {
        btn.addEventListener('click', async () => {
          const uid = btn.getAttribute('data-id');
          const roleType = btn.getAttribute('data-role');
          const name = btn.getAttribute('data-name');

          const confirmed = await showCustomConfirm({
            title: 'تأكيد قبول الحساب',
            message: `هل أنت متأكد من قبول حساب (${name}) وتفعيله رسمياً؟`,
            confirmText: 'نعم، تفعيل الحساب',
            confirmColor: '#10b981'
          });

          if (!confirmed) return;

          btn.disabled = true;
          try {
            const updatePayload = {
              status: 'approved',
              approvedAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            };

            // If supervisor, grant default core monitoring permissions
            if (roleType === 'supervisor') {
              updatePayload.role = 'supervisor';
              updatePayload.isSubAdmin = true;
              updatePayload.permissions = {
                viewStudents: true,
                addEditStudents: false,
                deleteStudents: false,
                manageSessions: true,
                viewTeachers: true,
                manageTeacherSchedules: true,
                manageGroups: true,
                viewReports: false,
                editSettings: false
              };
            } else {
              updatePayload.role = 'teacher';
              // Also ensure teacher document exists in teachers collection
              await setDoc(doc(db, "teachers", uid), {
                name: name,
                email: btn.closest('tr').children[2].textContent.trim(),
                phone: btn.closest('tr').children[3].textContent.trim(),
                status: 'active',
                createdAt: serverTimestamp()
              }, { merge: true });
            }

            await updateDoc(doc(db, "users", uid), updatePayload);
            Toast.success(`تم تفعيل حساب ${name} بنجاح.`);
          } catch (err) {
            console.error("Approve error:", err);
            Toast.error("تعذر تفعيل الحساب.");
            btn.disabled = false;
          }
        });
      });

      // Bind reject buttons
      document.querySelectorAll('.btn-reject').forEach(btn => {
        btn.addEventListener('click', async () => {
          const uid = btn.getAttribute('data-id');
          const name = btn.getAttribute('data-name');

          const confirmed = await showCustomConfirm({
            title: 'رفض طلب الانضمام',
            message: `هل أنت متأكد من رفض طلب حساب (${name})؟`,
            confirmText: 'نعم، رفض الطلب',
            confirmColor: '#dc2626'
          });

          if (!confirmed) return;

          try {
            await updateDoc(doc(db, "users", uid), {
              status: 'rejected',
              rejectedAt: serverTimestamp()
            });
            Toast.warning(`تم رفض طلب الحساب.`);
          } catch (err) {
            console.error("Reject error:", err);
            Toast.error("تعذر تحديث حالة الطلب.");
          }
        });
      });
    }
  </script>
</body>
</html>
