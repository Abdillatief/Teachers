<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سبيل - متابعة الطلاب والدارسين</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header Controls -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem 1.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
              <h1 style="font-size: 1.25rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="graduation-cap" style="color: var(--primary-color);"></i>
                سجل متابعة الطلاب والدارسين
              </h1>
              <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem;">
                استعراض بيانات الطلاب الميدانية، المواعيد المجدولة، وحالة الالتزام الدراسي.
              </p>
            </div>

            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <span class="badge" style="background: var(--bg-primary); border: 1px solid var(--border-color); font-weight: 700; padding: 0.5rem 0.8rem; font-size: 0.82rem;" id="studentsCountBadge">
                جاري التحميل...
              </span>
            </div>
          </div>

          <!-- Filter / Search Bar -->
          <div style="display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 240px; position: relative;">
              <input type="text" id="searchStudentInput" class="form-control" placeholder="بحث باسم الطالب، رقم الهاتف، أو اسم المعلم..." style="padding-right: 2.2rem; font-size: 0.85rem;">
              <i data-lucide="search" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
            </div>

            <select id="statusFilter" class="form-control" style="width: auto; min-width: 150px; font-size: 0.85rem;">
              <option value="all">كافة الحالات</option>
              <option value="Active">نشط ومنتظم</option>
              <option value="Suspended">معلق / إجازة</option>
              <option value="archived">مؤرشف / منقطع</option>
            </select>

            <select id="typeFilter" class="form-control" style="width: auto; min-width: 150px; font-size: 0.85rem;">
              <option value="all">كافة الاشتراكات</option>
              <option value="individual">فردي خاص</option>
              <option value="group">مجموعة جماعية</option>
            </select>
          </div>
        </div>

        <!-- Students Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>اسم الطالب</th>
                  <th>المعلم المسند</th>
                  <th>نوع الاشتراك</th>
                  <th>أيام ومواعيد الحصص</th>
                  <th>الحالة</th>
                  <th>هاتف ولي الأمر</th>
                  <th style="text-align: center;">إجراءات</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
                    جاري تحميل سجل الطلاب...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Student Quick Details Modal -->
  <div id="studentDetailsModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; padding: 1rem;">
    <div class="modal-card" style="background: var(--bg-surface); border-radius: 14px; max-width: 520px; width: 100%; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
      <div style="padding: 1.25rem 1.5rem; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 1rem; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 0.4rem;">
          <i data-lucide="info" style="width: 17px; height: 17px; color: var(--primary-color);"></i>
          بطاقة متابعة الطالب
        </h3>
        <button type="button" id="closeStudentModalBtn" style="background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer;">&times;</button>
      </div>

      <div id="studentModalContent" style="padding: 1.5rem; font-size: 0.85rem; line-height: 1.6;">
        <!-- Hydrated dynamically -->
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import '../assets/js/shared/utils/jsonShield.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute, getCurrentUserSession } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { dataStore } from '../assets/js/shared/data/dataStore.js';
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('supervisor', 'viewStudents');

    let allStudents = [];

    auth.onAuthStateChanged(async (user) => {
      if (!user) return;
      const session = getCurrentUserSession() || {};
      renderSidebar('students', 'supervisor');
      renderNavbar('متابعة الطلاب', { name: session.name || user.email, roleName: session.department || 'مشرف إداري' });

      dataStore.subscribe('students', (students) => {
        allStudents = students || [];
        renderStudents();
      });
    });

    const searchInput = document.getElementById('searchStudentInput');
    const statusFilter = document.getElementById('statusFilter');
    const typeFilter = document.getElementById('typeFilter');

    searchInput.addEventListener('input', () => renderStudents());
    statusFilter.addEventListener('change', () => renderStudents());
    typeFilter.addEventListener('change', () => renderStudents());

    function renderStudents() {
      const q = (searchInput.value || '').trim().toLowerCase();
      const status = statusFilter.value;
      const type = typeFilter.value;

      const filtered = allStudents.filter(s => {
        const matchesQ = !q || (s.name || '').toLowerCase().includes(q) || (s.teacherName || '').toLowerCase().includes(q) || (s.phone || '').includes(q);
        const matchesStatus = status === 'all' || (s.status || 'Active') === status;
        const matchesType = type === 'all' || (s.subscriptionType || 'individual') === type;
        return matchesQ && matchesStatus && matchesType;
      });

      document.getElementById('studentsCountBadge').textContent = `العدد المعروض: ${filtered.length} من إجمالي ${allStudents.length}`;

      const tbody = document.getElementById('studentsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
              لا توجد نتائج مطابقة لشروط البحث.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(s => {
        const schedDays = (s.schedule && s.schedule.days) ? s.schedule.days.join('، ') : (s.sessionDays || []).join('، ') || 'غير محدد';
        const schedTime = s.schedule?.uniformTime || s.sessionTime || '';
        const isSuspended = s.status === 'Suspended';
        const isArchived = s.status === 'archived';

        let statusBadge = '<span class="badge" style="background: var(--success-light, rgba(22, 163, 74, 0.1)); color: var(--success, #16a34a); font-weight: 700;">نشط</span>';
        if (isSuspended) statusBadge = '<span class="badge" style="background: rgba(245, 158, 11, 0.12); color: #d97706; font-weight: 700;">معلق</span>';
        if (isArchived) statusBadge = '<span class="badge" style="background: rgba(148, 163, 184, 0.15); color: #64748b; font-weight: 700;">مؤرشف</span>';

        return `
          <tr>
            <td>
              <div style="font-weight: 700; color: var(--text-primary);">${s.name || 'طالب'}</div>
              <div style="font-size: 0.74rem; color: var(--text-muted);">${s.notes || ''}</div>
            </td>
            <td><span style="font-size: 0.85rem; color: var(--text-secondary);">أ. ${s.teacherName || 'غير مسند'}</span></td>
            <td><span style="font-size: 0.8rem;">${s.subscriptionType === 'group' ? 'مجموعة جماعية' : 'فردي'}</span></td>
            <td>
              <div style="font-size: 0.8rem; font-weight: 600;">${schedDays}</div>
              ${schedTime ? `<div style="font-size: 0.74rem; color: var(--text-muted);">${schedTime}</div>` : ''}
            </td>
            <td>${statusBadge}</td>
            <td><span style="font-size: 0.82rem; font-family: monospace; direction: ltr; display: inline-block;">${s.phone || s.parentPhone || '--'}</span></td>
            <td style="text-align: center;">
              <button type="button" class="btn btn-secondary view-details-btn" data-id="${s.id}" style="padding: 0.35rem 0.65rem; font-size: 0.78rem;">
                تفاصيل
              </button>
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.view-details-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sid = e.currentTarget.dataset.id;
          const student = allStudents.find(s => s.id === sid);
          if (student) openStudentDetailsModal(student);
        });
      });
    }

    const modal = document.getElementById('studentDetailsModal');
    const modalContent = document.getElementById('studentModalContent');
    document.getElementById('closeStudentModalBtn').addEventListener('click', () => { modal.style.display = 'none'; });

    function openStudentDetailsModal(s) {
      modalContent.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div><strong>الاسم الكامل:</strong> ${s.name || '--'}</div>
          <div><strong>المعلم الحالي:</strong> أ. ${s.teacherName || 'غير مسند'}</div>
          <div><strong>هاتف ولي الأمر:</strong> <span style="direction: ltr; display: inline-block;">${s.phone || s.parentPhone || 'غير مسجل'}</span></div>
          <div><strong>أيام المواعيد:</strong> ${(s.schedule?.days || s.sessionDays || []).join('، ') || 'غير محدد'}</div>
          <div><strong>التوقيت المجدول:</strong> ${s.schedule?.uniformTime || s.sessionTime || 'غير محدد'}</div>
          <div><strong>المنهج والمسار:</strong> ${s.memorizationDirection === 'descending' ? 'عمودي (من قصار السور للأعلى)' : 'أفقي (من سورة البقرة)'}</div>
          <div><strong>تاريخ الانضمام:</strong> ${s.createdAt ? s.createdAt.substring(0, 10) : '--'}</div>
          <div><strong>ملاحظات المتابعة:</strong> ${s.notes || 'لا توجد ملاحظات مسجلة.'}</div>
        </div>
      `;
      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
