<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة ومراجعة الحصص (لوحة المشرف)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .session-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }
    .session-table th {
      background-color: var(--bg-primary);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    .session-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.86rem;
      vertical-align: middle;
    }
    .session-table tbody tr:hover {
      background-color: var(--bg-primary);
    }
  </style>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header -->
        <div style="margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="calendar-check" style="color: var(--primary-color); width: 26px; height: 26px;"></i>
              متابعة وتدقيق الحصص
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
              مراجعة الحصص المنفذة والجارية، التحقق من الإنجاز والمنهج، واعتماد السجلات الإدارية.
            </p>
          </div>
          <div>
            <button id="btnRefreshSessions" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">
              <i data-lucide="rotate-cw" style="width: 15px; height: 15px;"></i> تحديث السجلات
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="card" style="padding: 1rem 1.25rem; margin-bottom: 1.5rem;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
            <div style="flex: 1; min-width: 220px;">
              <input type="text" id="sessionSearchInput" class="form-control" placeholder="بحث باسم المعلم أو الطالب...">
            </div>
            <div style="width: 180px;">
              <select id="statusFilter" class="form-control">
                <option value="all">كل حالات الحصص</option>
                <option value="completed">منجزة ومعتمدة</option>
                <option value="delayed">مؤجلة</option>
                <option value="student_absent">غياب الطالب</option>
              </select>
            </div>
            <div style="width: 180px;">
              <input type="date" id="dateFilter" class="form-control">
            </div>
          </div>
        </div>

        <!-- Sessions Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="overflow-x: auto;">
            <table class="session-table">
              <thead>
                <tr>
                  <th>المعلم</th>
                  <th>الطالب</th>
                  <th>التاريخ والوقت</th>
                  <th>المدة</th>
                  <th>المنجز القرآني والملاحظات</th>
                  <th>الحالة</th>
                  <th style="text-align: center;">الاعتماد</th>
                </tr>
              </thead>
              <tbody id="sessionsTableBody">
                <tr>
                  <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                    جاري تحميل سجلات الحصص...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute, hasSupervisorPermission } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, query, orderBy, limit, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('supervisor');

    if (!hasSupervisorPermission('manageSessions')) {
      Toast.warning("غير مصرح لك بإدارة الحصص.");
      setTimeout(() => {
        window.location.replace('/supervisor/dashboard.html');
      }, 1200);
    }

    let allSessions = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sessions', 'supervisor');
      renderNavbar('متابعة الحصص', { name: 'المشرف الإداري', roleName: 'مشرف الأكاديمية' });

      document.getElementById('sessionSearchInput').addEventListener('input', renderTable);
      document.getElementById('statusFilter').addEventListener('change', renderTable);
      document.getElementById('dateFilter').addEventListener('change', renderTable);
      document.getElementById('btnRefreshSessions').addEventListener('click', () => {
        Toast.info("جاري تحديث قائمة الحصص...");
      });

      // Stream recent sessions (limit 150 for speed)
      const q = query(collection(db, "sessions"), orderBy("createdAt", "desc"), limit(150));
      onSnapshot(q, (snapshot) => {
        const sessions = [];
        snapshot.forEach(docSnap => {
          sessions.push({ id: docSnap.id, ...docSnap.data() });
        });
        allSessions = sessions;
        renderTable();
      }, (err) => {
        console.error("Error loading sessions:", err);
      });
    });

    function renderTable() {
      const tbody = document.getElementById('sessionsTableBody');
      const searchVal = document.getElementById('sessionSearchInput').value.trim().toLowerCase();
      const statusVal = document.getElementById('statusFilter').value;
      const dateVal = document.getElementById('dateFilter').value;

      const filtered = allSessions.filter(s => {
        if (statusVal !== 'all' && s.status !== statusVal) return false;
        if (dateVal && s.date !== dateVal) return false;

        if (searchVal) {
          const tName = (s.teacherName || '').toLowerCase();
          const sName = (s.studentName || '').toLowerCase();
          if (!tName.includes(searchVal) && !sName.includes(searchVal)) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 3rem;">
              <i data-lucide="calendar" style="width: 40px; height: 40px; margin: 0 auto 0.5rem auto; opacity: 0.5;"></i>
              <div style="font-weight: 700; color: var(--text-primary);">لا توجد حصص مطابقة لمعايير الفلترة</div>
            </td>
          </tr>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      tbody.innerHTML = filtered.map(s => {
        let statusBadge = '';
        if (s.status === 'completed') {
          statusBadge = '<span class="badge" style="background: rgba(16, 185, 129, 0.1); color: var(--success); font-weight: 700;">منجزة</span>';
        } else if (s.status === 'delayed') {
          statusBadge = '<span class="badge" style="background: rgba(217, 119, 6, 0.1); color: #d97706; font-weight: 700;">مؤجلة</span>';
        } else if (s.status === 'student_absent') {
          statusBadge = '<span class="badge" style="background: rgba(239, 68, 68, 0.1); color: var(--danger); font-weight: 700;">غياب</span>';
        } else {
          statusBadge = '<span class="badge" style="background: var(--bg-primary); color: var(--text-secondary); font-weight: 700;">جارية</span>';
        }

        const isApproved = s.approved === true || s.supervisorApproved === true;

        return `
          <tr>
            <td>
              <div style="font-weight: 800; color: var(--text-primary);">${s.teacherName || 'معلم'}</div>
            </td>
            <td>
              <div style="font-weight: 800; color: var(--text-primary);">${s.studentName || 'طالب'}</div>
            </td>
            <td>
              <div>${s.date || '--'}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${s.time || ''}</div>
            </td>
            <td>${s.duration || 30} دقيقة</td>
            <td>
              <div style="max-width: 250px; font-size: 0.82rem; line-height: 1.4; color: var(--text-secondary);">
                ${s.notes || s.surahName || 'لا توجد ملاحظات مدونة'}
              </div>
            </td>
            <td>${statusBadge}</td>
            <td style="text-align: center;">
              ${isApproved ? `
                <span class="badge" style="background: rgba(16, 185, 129, 0.1); color: var(--success); font-weight: 700; padding: 0.25rem 0.6rem;">
                  معتمدة
                </span>
              ` : `
                <button type="button" class="btn btn-secondary btn-approve-session" data-id="${s.id}" style="font-size: 0.78rem; padding: 0.3rem 0.65rem; font-weight: 700; border-color: var(--primary-color); color: var(--primary-color);">
                  اعتماد إداري
                </button>
              `}
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      // Bind session approval
      tbody.querySelectorAll('.btn-approve-session').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const sessId = e.currentTarget.dataset.id;
          btn.disabled = true;
          try {
            await updateDoc(doc(db, "sessions", sessId), {
              supervisorApproved: true,
              supervisorApprovedAt: new Date()
            });
            Toast.success("تم اعتماد الحصة بنجاح.");
          } catch (err) {
            console.error("Failed to approve session:", err);
            Toast.danger("تعذر اعتماد الحصة.");
            btn.disabled = false;
          }
        });
      });
    }
  </script>
</body>
</html>
