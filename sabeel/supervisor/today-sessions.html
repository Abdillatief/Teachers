<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة حصص اليوم (المشرفون)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        <div class="page-header" style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.35rem 0; display: flex; align-items: center; gap: 0.6rem;">
              <i data-lucide="play-circle" style="width: 26px; height: 26px; color: var(--primary-color);"></i>
              الحصص الجارية اليومية
            </h1>
            <p style="margin: 0; font-size: 0.88rem; color: var(--text-muted);" id="todayDateLabel">
              متابعة مباشرة لجميع الحصص المنفذة والجارية لليوم
            </p>
          </div>
        </div>

        <div class="card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;">
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.90rem; text-align: right;">
              <thead>
                <tr style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.82rem;">
                  <th style="padding: 0.9rem 1.25rem;">المعلم</th>
                  <th style="padding: 0.9rem 1.25rem;">الطالب</th>
                  <th style="padding: 0.9rem 1.25rem;">الوقت المجدول</th>
                  <th style="padding: 0.9rem 1.25rem;">النوع</th>
                  <th style="padding: 0.9rem 1.25rem;">الحالة</th>
                  <th style="padding: 0.9rem 1.25rem;">المسار القرآني</th>
                  <th style="padding: 0.9rem 1.25rem;">الملاحظات</th>
                </tr>
              </thead>
              <tbody id="todayListTableBody">
                <tr>
                  <td colspan="7" style="padding: 2.5rem; text-align: center; color: var(--text-muted);">
                    <i data-lucide="loader-2" class="animate-spin" style="width: 24px; height: 24px; margin: 0 auto 0.5rem auto; display: block;"></i>
                    جاري تحميل جدول اليوم...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import '../assets/js/shared/utils/jsonShield.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSupervisorSidebar } from '../assets/js/shared/components/supervisorSidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    protectRoute('supervisor');

    const todayStr = new Date().toISOString().split('T')[0];

    auth.onAuthStateChanged((user) => {
      if (user) {
        let currentUser = null;
        try {
          const raw = sessionStorage.getItem('sabeel_user_session');
          if (raw) currentUser = JSON.parse(raw);
        } catch (e) {}

        renderSupervisorSidebar('today-sessions');
        renderNavbar('حصص اليوم', { 
          name: currentUser?.name || 'مشرف معتمد', 
          roleName: currentUser?.supervisorTitle || 'مشرف إداري' 
        });

        document.getElementById('todayDateLabel').textContent = `تاريخ اليوم: ${todayStr} • متابعة مباشرة للحصص الجارية`;

        const q = query(collection(db, "sessions"), where("date", "==", todayStr));
        onSnapshot(q, (snapshot) => {
          const sessions = [];
          snapshot.forEach(d => sessions.push({ id: d.id, ...d.data() }));
          renderTable(sessions);
        });
      }
    });

    function renderTable(sessions) {
      const tbody = document.getElementById('todayListTableBody');
      if (sessions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="padding: 2.5rem; text-align: center; color: var(--text-muted);">لم يتم تسجيل أي حصص لليوم بعد.</td></tr>`;
        return;
      }

      let rows = '';
      sessions.forEach(s => {
        const statusBadge = s.status === 'completed'
          ? `<span style="color: #10b981; font-weight: 600;">منفذة ومكتملة</span>`
          : s.status === 'student_absent'
          ? `<span style="color: #ef4444; font-weight: 600;">غياب الطالب</span>`
          : `<span style="color: #f59e0b; font-weight: 600;">معلقة / مؤجلة</span>`;

        rows += `
          <tr style="border-bottom: 1px solid var(--border-color);">
            <td style="padding: 0.9rem 1.25rem; font-weight: 600; color: var(--text-primary);">${s.teacherName || '—'}</td>
            <td style="padding: 0.9rem 1.25rem; font-weight: 600; color: var(--text-primary);">${s.studentName || '—'}</td>
            <td style="padding: 0.9rem 1.25rem; color: var(--text-muted);">${s.time || '—'}</td>
            <td style="padding: 0.9rem 1.25rem; color: var(--text-secondary);">${s.type === 'trial' ? 'تجريبية' : 'فردية'}</td>
            <td style="padding: 0.9rem 1.25rem;">${statusBadge}</td>
            <td style="padding: 0.9rem 1.25rem; color: var(--primary-color);">${s.surahName ? s.surahName + ' (آية ' + (s.actualVerse || 1) + ')' : '—'}</td>
            <td style="padding: 0.9rem 1.25rem; color: var(--text-muted); font-size: 0.82rem;">${s.notes || '—'}</td>
          </tr>
        `;
      });

      tbody.innerHTML = rows;
      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
