<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة المعلمين (لوحة المشرف)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .teacher-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1.25rem;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .teacher-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
  </style>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header -->
        <div style="margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="users" style="color: var(--primary-color); width: 26px; height: 26px;"></i>
              متابعة شؤون المعلمين
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
              متابعة حضور المعلمين، جداول الحصص المعتمدة، وأرقام التواصل دون كشف البيانات المالية.
            </p>
          </div>
        </div>

        <!-- KPI Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="card" style="padding: 1.25rem; border-right: 4px solid var(--primary-color);">
            <div style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700;">إجمالي الكادر التعليمي</div>
            <h3 id="statTotalTeachers" style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary); margin: 0.25rem 0 0 0;">0</h3>
          </div>
          <div class="card" style="padding: 1.25rem; border-right: 4px solid var(--success);">
            <div style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700;">المعلمون النشطون</div>
            <h3 id="statActiveTeachers" style="font-size: 1.75rem; font-weight: 800; color: var(--success); margin: 0.25rem 0 0 0;">0</h3>
          </div>
        </div>

        <!-- Search & Filter -->
        <div class="card" style="padding: 1rem 1.25rem; margin-bottom: 1.5rem;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
            <div style="flex: 1; min-width: 240px;">
              <input type="text" id="teacherSearchInput" class="form-control" placeholder="بحث باسم المعلم، التخصص أو رقم الهاتف...">
            </div>
            <div style="width: 180px;">
              <select id="teacherStatusFilter" class="form-control">
                <option value="all">كافة الحالات</option>
                <option value="active">نشط ومعتمد</option>
                <option value="pending">بانتظار التفعيل</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Teachers Grid -->
        <div id="teachersGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem;">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem; grid-column: 1 / -1;">
            جاري تحميل قائمة المعلمين...
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute, hasSupervisorPermission } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    // Route Protection: Supervisor & Admin only
    protectRoute('supervisor');

    // Permission Verification
    if (!hasSupervisorPermission('viewTeachers')) {
      Toast.warning("غير مصرح لك باستعراض قائمة المعلمين.");
      setTimeout(() => {
        window.location.replace('/supervisor/dashboard.html');
      }, 1200);
    }

    let allTeachers = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('teachers', 'supervisor');
      renderNavbar('متابعة المعلمين', { name: 'المشرف الإداري', roleName: 'مشرف الأكاديمية' });

      document.getElementById('teacherSearchInput').addEventListener('input', renderTeachers);
      document.getElementById('teacherStatusFilter').addEventListener('change', renderTeachers);

      // Load teachers from users collection
      const q = query(collection(db, "users"), where("role", "==", "teacher"));
      onSnapshot(q, (snapshot) => {
        const teachers = [];
        snapshot.forEach(docSnap => {
          teachers.push({ id: docSnap.id, uid: docSnap.id, ...docSnap.data() });
        });
        allTeachers = teachers;
        updateKPIs();
        renderTeachers();
      }, (err) => {
        console.error("Error loading teachers:", err);
      });
    });

    function updateKPIs() {
      document.getElementById('statTotalTeachers').textContent = allTeachers.length;
      document.getElementById('statActiveTeachers').textContent = allTeachers.filter(t => t.status === 'active' || !t.status).length;
    }

    function renderTeachers() {
      const grid = document.getElementById('teachersGrid');
      const searchVal = document.getElementById('teacherSearchInput').value.trim().toLowerCase();
      const statusVal = document.getElementById('teacherStatusFilter').value;

      const filtered = allTeachers.filter(t => {
        const isAct = t.status === 'active' || !t.status;
        if (statusVal === 'active' && !isAct) return false;
        if (statusVal === 'pending' && t.status !== 'pending') return false;

        if (searchVal) {
          const name = (t.name || '').toLowerCase();
          const phone = (t.phone || '').toLowerCase();
          const spec = (t.specialization || '').toLowerCase();
          if (!name.includes(searchVal) && !phone.includes(searchVal) && !spec.includes(searchVal)) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
            <i data-lucide="users" style="width: 40px; height: 40px; margin: 0 auto 0.5rem auto; opacity: 0.5;"></i>
            <div style="font-weight: 700; color: var(--text-primary);">لا يوجد معلمون مطابقون لمعايير البحث</div>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map(t => {
        const isActive = t.status === 'active' || !t.status;
        return `
          <div class="teacher-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <h3 style="font-size: 1.05rem; font-weight: 800; color: var(--text-primary); margin: 0 0 0.25rem 0;">${t.name || 'معلم'}</h3>
                <span style="font-size: 0.8rem; color: var(--text-muted);">${t.specialization || 'تحفيظ القرآن الكريم والتجويد'}</span>
              </div>
              <span class="badge" style="background: ${isActive ? 'rgba(16, 185, 129, 0.1)' : 'rgba(234, 88, 12, 0.1)'}; color: ${isActive ? 'var(--success)' : '#ea580c'}; font-weight: 700; font-size: 0.75rem;">
                ${isActive ? 'معتمد' : 'معلق'}
              </span>
            </div>

            <div style="font-size: 0.82rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 0.4rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 0.4rem;">
                <i data-lucide="phone" style="width: 14px; height: 14px; color: var(--primary-color);"></i>
                <span style="direction: ltr;">${t.phone || 'غير مسجل'}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 0.4rem;">
                <i data-lucide="mail" style="width: 14px; height: 14px; color: var(--primary-color);"></i>
                <span>${t.email || 'غير مسجل'}</span>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.75rem; font-size: 0.78rem;">
              <span style="color: var(--text-muted);">رقم المعلم: <code>${t.id.slice(0, 8)}</code></span>
              <a href="tel:${t.phone || ''}" class="btn btn-secondary" style="font-size: 0.78rem; padding: 0.25rem 0.65rem; font-weight: 700; text-decoration: none;">
                <i data-lucide="phone-call" style="width: 13px; height: 13px;"></i> اتصال مباشر
              </a>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
