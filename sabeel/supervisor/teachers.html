<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة المعلمين (المشرفون)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        <div class="page-header" style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.35rem 0; display: flex; align-items: center; gap: 0.6rem;">
              <i data-lucide="users" style="width: 26px; height: 26px; color: #10b981;"></i>
              دليل ومتابعة المعلمين
            </h1>
            <p style="margin: 0; font-size: 0.88rem; color: var(--text-muted);">
              استعراض هيئة التدريس، وسائل الاتصال، وحالة المعلمين
            </p>
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <input id="searchTeacherInput" type="text" placeholder="بحث باسم المعلم..." style="padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font-size: 0.88rem; min-width: 250px;">
          </div>
        </div>

        <div class="card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;">
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.90rem; text-align: right;">
              <thead>
                <tr style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.82rem;">
                  <th style="padding: 0.9rem 1.25rem;">اسم المعلم</th>
                  <th style="padding: 0.9rem 1.25rem;">البريد الإلكتروني</th>
                  <th style="padding: 0.9rem 1.25rem;">رقم الهاتف</th>
                  <th style="padding: 0.9rem 1.25rem;">الحالة</th>
                  <th style="padding: 0.9rem 1.25rem;">تاريخ الانضمام</th>
                </tr>
              </thead>
              <tbody id="teachersTableBody">
                <tr>
                  <td colspan="5" style="padding: 2.5rem; text-align: center; color: var(--text-muted);">
                    <i data-lucide="loader-2" class="animate-spin" style="width: 24px; height: 24px; margin: 0 auto 0.5rem auto; display: block;"></i>
                    جاري تحميل قائمة المعلمين...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import '../assets/js/shared/utils/jsonShield.js';
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute } from '../assets/js/features/auth/authService.js';
    import { renderSupervisorSidebar } from '../assets/js/shared/components/supervisorSidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    protectRoute('supervisor');

    let allTeachers = [];

    auth.onAuthStateChanged((user) => {
      if (user) {
        let currentUser = null;
        try {
          const raw = sessionStorage.getItem('sabeel_user_session');
          if (raw) currentUser = JSON.parse(raw);
        } catch (e) {}

        renderSupervisorSidebar('teachers');
        renderNavbar('متابعة المعلمين', { 
          name: currentUser?.name || 'مشرف معتمد', 
          roleName: currentUser?.supervisorTitle || 'مشرف إداري' 
        });

        initTeachersListener();
      }
    });

    const searchInput = document.getElementById('searchTeacherInput');
    searchInput.addEventListener('input', renderTeachersTable);

    function initTeachersListener() {
      onSnapshot(collection(db, "teachers"), (snapshot) => {
        allTeachers = [];
        snapshot.forEach(docSnap => {
          allTeachers.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderTeachersTable();
      });
    }

    function renderTeachersTable() {
      const tbody = document.getElementById('teachersTableBody');
      const query = (searchInput.value || '').toLowerCase().trim();

      const filtered = allTeachers.filter(t => {
        if (!query) return true;
        return (t.name || '').toLowerCase().includes(query) || (t.email || '').toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding: 2.5rem; text-align: center; color: var(--text-muted);">لا يوجد معلمون مطابقون.</td></tr>`;
        return;
      }

      let rows = '';
      filtered.forEach(t => {
        rows += `
          <tr style="border-bottom: 1px solid var(--border-color);">
            <td style="padding: 0.9rem 1.25rem; font-weight: 600; color: var(--text-primary);">${t.name || '—'}</td>
            <td style="padding: 0.9rem 1.25rem; color: var(--text-secondary); direction: ltr; text-align: right;">${t.email || '—'}</td>
            <td style="padding: 0.9rem 1.25rem; color: var(--text-muted); direction: ltr; text-align: right;">${t.phone || '—'}</td>
            <td style="padding: 0.9rem 1.25rem;"><span style="color: #10b981; font-weight: 600;">نشط ومتاح</span></td>
            <td style="padding: 0.9rem 1.25rem; color: var(--text-muted); font-size: 0.82rem;">${t.createdAt?.seconds ? new Date(t.createdAt.seconds * 1000).toISOString().split('T')[0] : '—'}</td>
          </tr>
        `;
      });

      tbody.innerHTML = rows;
      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
