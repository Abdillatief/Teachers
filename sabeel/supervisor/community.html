<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - مجتمع المعلمين والمشرفين (لوحة المشرف)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header -->
        <div style="margin-bottom: 1.75rem;">
          <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
            <i data-lucide="message-square" style="color: var(--primary-color); width: 26px; height: 26px;"></i>
            منتدى التنسيق والمجتمع الداخلي
          </h1>
          <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
            التواصل والمشاركة في الملاحظات والتوجيهات التربوية بين الكادر الإشرافي والتعليمي.
          </p>
        </div>

        <!-- New Post Card -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3 style="font-size: 1rem; font-weight: 800; margin: 0 0 1rem 0; color: var(--text-primary);">إضافة تعميم أو توجيه جديد</h3>
          <form id="newPostForm">
            <div class="form-group" style="margin-bottom: 0.75rem;">
              <input type="text" id="postTitleInput" class="form-control" placeholder="عنوان التوجيه أو الموضوع..." required>
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
              <textarea id="postContentInput" class="form-control" rows="3" placeholder="اكتب تفاصيل التوجيه أو الإشعار..." required></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end;">
              <button type="submit" id="btnSubmitPost" class="btn btn-primary" style="font-weight: 700;">
                <i data-lucide="send" style="width: 15px; height: 15px;"></i> نشر الآن
              </button>
            </div>
          </form>
        </div>

        <!-- Posts Container -->
        <div id="postsContainer">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem;">
            جاري استرجاع منشورات وتوجيهات المجتمع...
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute, hasSupervisorPermission } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('supervisor');

    if (!hasSupervisorPermission('communityAccess')) {
      Toast.warning("غير مصرح لك بدخول منتدى المجتمع الداخلي.");
      setTimeout(() => {
        window.location.replace('/supervisor/dashboard.html');
      }, 1200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('community', 'supervisor');
      renderNavbar('المجتمع الداخلي', { name: 'المشرف الإداري', roleName: 'مشرف الأكاديمية' });

      // Handle new post
      document.getElementById('newPostForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('postTitleInput').value.trim();
        const content = document.getElementById('postContentInput').value.trim();
        const submitBtn = document.getElementById('btnSubmitPost');

        if (!title || !content) return;
        submitBtn.disabled = true;

        try {
          await addDoc(collection(db, "community_posts"), {
            title,
            content,
            authorName: 'المشرف الإداري',
            authorRole: 'supervisor',
            authorUid: auth?.currentUser?.uid || '',
            createdAt: serverTimestamp()
          });
          Toast.success("تم نشر التوجيه بنجاح.");
          document.getElementById('newPostForm').reset();
        } catch (err) {
          console.error("Failed to post:", err);
          Toast.danger("تعذر النشر، يرجى المحاولة لاحقاً.");
        } finally {
          submitBtn.disabled = false;
        }
      });

      // Stream posts
      const q = query(collection(db, "community_posts"), orderBy("createdAt", "desc"), limit(30));
      onSnapshot(q, (snapshot) => {
        const posts = [];
        snapshot.forEach(docSnap => {
          posts.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderPosts(posts);
      }, (err) => {
        console.warn("Community stream notice:", err);
      });
    });

    function renderPosts(posts) {
      const container = document.getElementById('postsContainer');
      if (posts.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            <i data-lucide="message-square" style="width: 40px; height: 40px; margin: 0 auto 0.5rem auto; opacity: 0.5;"></i>
            <div style="font-weight: 700; color: var(--text-primary);">لا توجد منشورات حتى الآن</div>
            <div style="font-size: 0.85rem;">كن أول من يشارك توجيهاً أو استفساراً مع الكادر الأكاديمي.</div>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      container.innerHTML = posts.map(p => {
        const dateStr = p.createdAt ? new Date(p.createdAt.toDate ? p.createdAt.toDate() : p.createdAt).toLocaleDateString('ar-EG') : 'الآن';
        return `
          <div class="card" style="margin-bottom: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-weight: 800; color: var(--text-primary); font-size: 0.95rem;">${p.authorName || 'عضو في الأكاديمية'}</span>
                <span class="badge" style="background: rgba(99, 102, 241, 0.1); color: #6366f1; font-size: 0.72rem; font-weight: 700;">
                  ${p.authorRole === 'supervisor' ? 'مشرف إداري' : 'معلم'}
                </span>
              </div>
              <span style="font-size: 0.78rem; color: var(--text-muted);">${dateStr}</span>
            </div>
            <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--text-primary); margin: 0 0 0.5rem 0;">${p.title}</h4>
            <p style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin: 0;">${p.content}</p>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
