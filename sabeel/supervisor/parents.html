<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل - متابعة أولياء الأمور (لوحة المشرف)</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .parent-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 1.25rem;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .parent-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
  </style>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper" id="mainWrapper">
      <nav class="navbar" id="appNavbar"></nav>

      <main class="content-body">
        
        <!-- Header -->
        <div style="margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem;">
              <i data-lucide="contact" style="color: var(--primary-color); width: 26px; height: 26px;"></i>
              شؤون ومتابعة أولياء الأمور
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
              سجل التواصل مع أولياء الأمور، متابعة تقدم الأبناء والتنسيق الإداري.
            </p>
          </div>
        </div>

        <!-- Search -->
        <div class="card" style="padding: 1rem 1.25rem; margin-bottom: 1.5rem;">
          <input type="text" id="parentSearchInput" class="form-control" placeholder="بحث باسم الدارس، اسم ولي الأمر، أو رقم الهاتف...">
        </div>

        <!-- Parents Grid -->
        <div id="parentsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem;">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem; grid-column: 1 / -1;">
            جاري استرجاع بيانات التواصل...
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db } from '../assets/js/config/firebase.js';
    import { protectRoute, hasSupervisorPermission } from '../assets/js/features/auth/authService.js';
    import { renderSidebar } from '../assets/js/shared/components/sidebar.js';
    import { renderNavbar } from '../assets/js/shared/components/navbar.js';
    import { collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { Toast } from '../assets/js/shared/utils/toast.js';

    protectRoute('supervisor');

    if (!hasSupervisorPermission('parentFollowup')) {
      Toast.warning("غير مصرح لك بمتابعة أولياء الأمور.");
      setTimeout(() => {
        window.location.replace('/supervisor/dashboard.html');
      }, 1200);
    }

    let allStudents = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('parents', 'supervisor');
      renderNavbar('متابعة أولياء الأمور', { name: 'المشرف الإداري', roleName: 'مشرف الأكاديمية' });

      document.getElementById('parentSearchInput').addEventListener('input', renderParents);

      onSnapshot(collection(db, "students"), (snapshot) => {
        const students = [];
        snapshot.forEach(docSnap => {
          students.push({ id: docSnap.id, ...docSnap.data() });
        });
        allStudents = students;
        renderParents();
      }, (err) => {
        console.error("Error loading students:", err);
      });
    });

    function renderParents() {
      const grid = document.getElementById('parentsGrid');
      const searchVal = document.getElementById('parentSearchInput').value.trim().toLowerCase();

      const filtered = allStudents.filter(s => {
        if (s.status === 'archived') return false;

        if (searchVal) {
          const sName = (s.name || '').toLowerCase();
          const pName = (s.parentName || '').toLowerCase();
          const pPhone = (s.parentPhone || s.phone || '').toLowerCase();
          if (!sName.includes(searchVal) && !pName.includes(searchVal) && !pPhone.includes(searchVal)) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
            <i data-lucide="contact" style="width: 40px; height: 40px; margin: 0 auto 0.5rem auto; opacity: 0.5;"></i>
            <div style="font-weight: 700; color: var(--text-primary);">لا توجد نتائج مطابقة</div>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const parentPhone = s.parentPhone || s.phone || 'غير مسجل';
        return `
          <div class="parent-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <h3 style="font-size: 1rem; font-weight: 800; color: var(--text-primary); margin: 0 0 0.25rem 0;">${s.name}</h3>
                <span style="font-size: 0.8rem; color: var(--text-muted);">ولي الأمر: ${s.parentName || 'غير مدون'}</span>
              </div>
              <span class="badge" style="background: rgba(13, 148, 136, 0.1); color: var(--primary-color); font-weight: 700; font-size: 0.75rem;">
                ${s.subscriptionType === 'group' ? 'جماعي' : 'فردي'}
              </span>
            </div>

            <div style="font-size: 0.82rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 0.35rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 0.4rem;">
                <i data-lucide="phone" style="width: 14px; height: 14px; color: var(--primary-color);"></i>
                <span style="direction: ltr; font-weight: 600;">${parentPhone}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 0.4rem;">
                <i data-lucide="user" style="width: 14px; height: 14px; color: var(--text-muted);"></i>
                <span>المعلم المسؤول: <strong>${s.teacherName || 'غير مسند'}</strong></span>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
              <span style="font-size: 0.75rem; color: var(--text-muted);">الحصص المنجزة: <strong>${s.sessionsCount || 0}</strong></span>
              <a href="tel:${parentPhone !== 'غير مسجل' ? parentPhone : ''}" class="btn btn-secondary" style="font-size: 0.78rem; padding: 0.3rem 0.65rem; font-weight: 700; text-decoration: none;">
                <i data-lucide="phone-outgoing" style="width: 13px; height: 13px;"></i> اتصال
              </a>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
