<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>أكاديمية سبيل - تسجيل معلم جديد</title>
  
  <script>
    if (localStorage.getItem('academy_dark_mode') === 'true') {
      document.documentElement.classList.add('dark-theme');
    }
  </script>

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabeel">
  <meta name="application-name" content="Sabeel Academy">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="module" src="/assets/js/shared/utils/pwaManager.js"></script>
</head>
<body class="auth-page-wrapper" style="align-items: center; justify-content: center; padding: 2rem 1rem;">

  <div class="auth-form-container" style="max-width: 480px;">
    <div class="auth-card">
      <div class="auth-card-header" style="text-align: center;">
        <div style="width: 54px; height: 54px; border-radius: 14px; background: var(--primary-subtle); border: 1px solid var(--primary-border); display: inline-flex; align-items: center; justify-content: center; color: var(--primary-color); margin-bottom: 0.75rem;">
          <i data-lucide="user-plus" style="width: 26px; height: 26px;"></i>
        </div>
        <h2 class="auth-card-title" style="font-size: 1.4rem;">انضمام كمعلم جديد</h2>
        <p class="auth-card-desc">سجل بياناتك وسيتم مراجعة الطلب واعتماده من قبل إدارة الأكاديمية</p>
      </div>

      <form id="registerForm">
        <div class="auth-form-group">
          <label for="name" class="auth-label">الاسم الكامل</label>
          <div class="auth-input-wrapper">
            <i data-lucide="user" class="auth-input-icon"></i>
            <input type="text" id="name" class="auth-input auth-input-with-icon" placeholder="أدخل اسمك الثلاثي أو الرباعي" required>
          </div>
        </div>

        <div class="auth-form-group">
          <label for="phone" class="auth-label">رقم الهاتف / الواتساب</label>
          <div class="auth-input-wrapper">
            <i data-lucide="phone" class="auth-input-icon"></i>
            <input type="tel" id="phone" class="auth-input auth-input-with-icon" placeholder="05xxxxxxxx" required style="direction: ltr; text-align: left;">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="emailPrefix" class="auth-label">البريد الإلكتروني للمعلم</label>
          <div class="auth-input-wrapper" style="direction: ltr;">
            <input 
              type="text" 
              id="emailPrefix" 
              class="auth-input auth-email-input" 
              placeholder="اسم الحساب (مثال: ahmed123)" 
              required 
              autocomplete="username"
            >
            <span class="auth-email-domain-badge">@gmail.com</span>
          </div>
        </div>

        <div class="auth-form-group">
          <label for="password" class="auth-label">كلمة المرور (8 أحرف أو أكثر)</label>
          <div class="auth-input-wrapper">
            <i data-lucide="lock" class="auth-input-icon"></i>
            <input type="password" id="password" class="auth-input auth-input-with-icon" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" style="margin-top: 1.5rem;">
          <i data-lucide="send" style="width: 18px; height: 18px;"></i>
          <span>إرسال طلب الانضمام</span>
        </button>
      </form>

      <div class="auth-footer-prompt">
        <span>لديك حساب بالفعل؟</span>
        <a href="index.html" class="auth-link" style="margin-right: 0.25rem;">تسجيل الدخول</a>
      </div>
    </div>

    <div class="auth-page-footer">
      <span>نظام سَبِيل &bull; تطوير </span>
      <span style="color: var(--primary-color); font-weight: 700;">Sabilix</span>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="assets/js/features/auth/registerController.js"></script>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
